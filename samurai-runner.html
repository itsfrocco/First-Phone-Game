<script>
'use strict';

/* ============================================================
   CONFIG — every tuning number lives here
   ============================================================ */
const W = 400, H = 720;                       // logical size; everything is laid out in these units
const R = Math.min(3, Math.max(1, Math.round(window.devicePixelRatio || 1)));  // render scale for crisp art
const S = 1 / R;                              // sprite scale that undoes R
const FONT = '"Trebuchet MS", "Avenir Next", "Segoe UI", system-ui, sans-serif';

const CFG = {
  startArmy: 1,
  maxDrawn: 20,            // soldiers drawn on screen; the count can go higher
  armyY: 560,              // front row of the army
  pathLeft: 60, pathRight: 340,
  steerMin: 78, steerMax: 322,
  baseSpeed: 90,           // px/s at the start of a level
  speedRamp: 0.30,         // +30% by the end
  attackRange: 38,
  slowScale: 0.30,         // world speed while the special is active
  slowMs: 4000,
  specialMax: 36,          // fewest kills that fill the special bar
  specialsPerLevel: 2.7,   // the bar is sized so a level's regular enemies fill it about this many times
  charmDamageUp: 1.10,     // each lucky charm broken: +10% blade damage for the rest of the run
  bossSlow: 0.97,          // the run slows 3% once the boss is down
  shake: 0.4,              // screen-shake strength multiplier (0 = off)
  // Regular enemies run at the army, then strike. `hit` is the share of one samurai lost per strike.
  enemy: {
    reach: 16,
    demonShare: 0.25,      // how many regular enemies are demons, in levels that have them
    demonHp: 2,            // a demon has this many times a zombie's health
    fightRush: 80,         // extra run speed while the scroll is stopped for a big fight
    zombie: { speed: 38, hit: 0.22, strikeMs: 1100 },
    demon:  { speed: 55, hit: 0.42, strikeMs: 900 },
  },
  // Big fights share one cycle: follow the army -> wind up (red zone on the ground) -> strike -> pause.
  //   speed          px/s sideways after the army
  //   chaseMs/windMs/recoverMs   follow, wind up (the dodge window), pause
  //   reach          a strike hits if the army's centre is within this of the landing spot
  //   cleave/cleaveShare   a hit takes the larger of `cleave` or `cleaveShare` of the army
  //   power*         occasional special: 'jump' slams where the army stood; 'fly' does the same from the air, untouchable meanwhile
  //   trickle        regular enemies keep arriving while he lives
  bosses: {
    demon: { key: 'boss', name: 'FAT DEMON', slain: 'DEMON SLAIN', r: 50, souls: 40, speed: 60, chaseMs: 930, windMs: 600, recoverMs: 330,
      reach: 85, cleave: 4, cleaveShare: 0.10, powerChance: 0.35, powerWindMs: 1070, powerReach: 100, powerMult: 2, powerStyle: 'jump' },
    giant: { key: 'giant', name: 'GIANT ZOMBIE', slain: 'GIANT SLAIN', r: 44, souls: 20, speed: 40, chaseMs: 1400, windMs: 900, recoverMs: 500,
      reach: 85, cleave: 2, cleaveShare: 0.05, powerChance: 0, trickle: true, trickleMs: 1500 },       // half the fat demon's speed and damage
    // The saga boss. Phase 1 is measured: two-swing combos and an occasional lightning slash down a lane.
    // At `phase2` of his health he powers up (a short cutscene; he cannot be hurt and regains `powerUpHeal` of his health).
    // Phase 2 runs `phase2Haste` times faster with three-swing combos, his swings leave lightning on the ground
    // for `linger` ms, and he sometimes dashes to where the army stands.
    thunder: { key: 'thunder', name: 'TAKEMIKAZUCHI', slain: 'THE THUNDER GOD FALLS', r: 48, souls: 150, speed: 68, chaseMs: 1070, windMs: 690, recoverMs: 470,
      reach: 85, cleave: 3, cleaveShare: 0.06, combo: 2, phase2Combo: 3, comboWindMs: 510, comboStep: 45,
      powerChance: 0.25, powers: [['bolt'], ['bolt', 'dash']], powerWind: { bolt: 1200, dash: 640 }, powerReach: 85, boltHalf: 48, powerMult: 2,
      phase2: 0.5, phase2Haste: 1.33, phase2Name: 'THE STORM AWAKENS', powerUpMs: 2400, powerUpHeal: 0.2, linger: 1000, lingerTick: 500, lingerShare: 0.03 },
    tengu: { key: 'tenguBoss', name: 'TENGU', slain: 'TENGU SLAIN', r: 46, souls: 35, speed: 40, chaseMs: 1400, windMs: 900, recoverMs: 500,
      reach: 85, cleave: 3, cleaveShare: 0.08, powerChance: 0.45, powerWindMs: 1600, powerReach: 100, powerMult: 2, powerStyle: 'fly' },
  },
  // The glowing lucky charm that slides from side to side. Harmless; break it for the damage bonus.
  charm: { speed: 70, lead: 110, souls: 15 },   // speed: px/s sideways; lead: how far in front of its gate row it appears
  // The saga boss stage's storm: every `everyMs` a wave of lightning sweeps down the lane the army stands in.
  storm: { everyMs: [4000, 5000], warnMs: 1100, sweepMs: 380, half: 52, cleave: 2, cleaveShare: 0.08 },
  // Futsu-no-mitama: extra lightning damage on top of each hit, as a share of the hit, doubled or halved by the target's element.
  thunderBlade: { bonus: 0.25, strong: ['water', 'metal', 'flying'], weak: ['earth', 'fire', 'thunder'], strongMult: 2, weakMult: 0.5 },
  levelPace: 0.10,         // each level in a saga runs this much faster than the one before (the army and the enemies)
};

// Levels are generated from a short spec so every one gets steadily harder as it goes.
//   rows     gate rows; each is followed by an enemy pack
//   pack     [size of the first pack, growth per row, extra growth that builds toward the end]
//   crowd    how much tighter each pack is bunched than the one before, so later packs arrive faster
//   hp       zombie health (demons have more, see CFG.enemy.demonHp); difficulty comes from numbers, not tougher enemies
//   charms   [rows where a lucky charm appears, its health, health growth per charm]
//   bosses   big fights: `after` a given row, or at the 'end'
const LEVEL_SPECS = [
  { name: 'Restless Dead', demons: false, rows: 10, seg: 370, pack: [3, 1.2, 0.20], crowd: 0.05, hp: 3,
    bosses: [{ type: 'giant', after: 'end', hp: 400 }] },
  { name: 'The Tengu', demons: true, rows: 13, seg: 370, pack: [5, 2.4, 0.27], crowd: 0.16, hp: 5, charms: [[4, 10], 8, 3],
    bosses: [{ type: 'giant', after: 6, hp: 700 }, { type: 'tengu', after: 'end', hp: 1400 }] },
  { name: 'The Fat Demon', demons: true, rows: 18, seg: 370, pack: [6, 2.4, 0.16], crowd: 0.14, hp: 8, charms: [[5, 11, 15], 11, 4],
    bosses: [{ type: 'giant', after: 8, hp: 1800 }, { type: 'demon', after: 'end', hp: 3000 }] },
  // The saga boss stage: a short run to build an army, then the fight.
  { name: 'Takemikazuchi', demons: true, storm: true, rows: 8, seg: 370, pack: [5, 2.4, 0.30], crowd: 0.15, hp: 8, pace: 1.2, charms: [[4], 11, 0],
    bosses: [{ type: 'thunder', after: 'end', hp: 2600 }] },
];
// Armor and weapons, chosen on a level's start screen. `boss: true` items are won by beating the saga boss.
const GEAR = {
  armor: [
    { id: '', name: 'Clan Armor', effect: 'Standard issue.' },
    { id: 'thunder', name: 'Thunder Armor', boss: true, effect: 'Halves lightning damage.',
      lore: "Armor forged in the image of Takemikazuchi's own war gear. It does not fully stop lightning, but it turns the worst of it aside, the same way he endured the storms he commanded. Those who wear it carry a trace of the force that once pinned the earthquake catfish and forced the land to yield. It is heavy with the memory of conquest, not protection freely given." },
  ],
  weapon: [
    { id: '', name: 'Clan Katana', effect: 'A trusty blade.' },
    { id: 'thunder', name: 'Futsu-no-mitama', boss: true, effect: '+25% lightning damage. Strong against water, metal and flying foes; weak against earth, fire and thunder.',
      lore: "A sword once carried by Takemikazuchi. In the old stories, when the first emperor's forces were stalled, Takemikazuchi did not descend himself. Instead he sent this blade down from the heavens so the campaign could continue. It is said the sword carries a fragment of his thunder, striking with the same force he used when he crushed those who opposed the heavenly order. Those who wield it now do so with his reluctant respect, not his blessing." },
  ],
};
// What each kind of enemy is made of, for weapons that favour or struggle against certain foes.
// Kinds not listed are neutral. Future enemies (water, metal, earth, fire...) get their entry here.
const ELEMENT = { tenguBoss: 'flying', thunder: 'thunder' };
const SAGA_LEVELS = 3;                                        // ordinary levels per saga; the stage after them is the saga boss
const GOOD_GATES = ['+3', '+3', 'x2', '+4', '+5', '+6', 'x2', '+8', '+10', '+12', '+14', '+16', '+18', '+20', '+22', '+25', '+28', '+30'];
// Turns a spec into positions measured in distance along the path (px).
function layoutLevel(spec, index) {
  const L = { name: spec.name, demons: spec.demons, charms: spec.charms || [[], 0, 0], gates: [], packs: [], spikes: [], bosses: [] };
  L.storm = !!spec.storm;                                    // dark sky, broken ground and lightning waves
  L.pace = spec.pace || 1 + CFG.levelPace * (index % 3);                 // level 1, 2, 3 of each saga
  let d = 300;
  const hp = spec.hp;
  for (let i = 0; i < spec.rows; i++) {
    const good = GOOD_GATES[i];
    L.gates.push({ d, bad: { op: '-', n: Math.round(2 + i * 1.5) }, good: { op: good[0], n: +good.slice(1) } });
    // The first pack hangs back so a lone samurai gets through the first gate before anything reaches it.
    L.packs.push({ d: d + (i ? 150 : 420), n: Math.round(spec.pack[0] + spec.pack[1] * i + spec.pack[2] * i * i), gap: 14 / (1 + spec.crowd * i), hp });
    if (i % 2 === 1 || i > spec.rows * 0.6) L.spikes.push(d + spec.seg / 2);      // midway between gate rows; more of them late on
    d += spec.seg;
    const mid = spec.bosses.find(b => b.after === i);
    if (mid) { L.bosses.push({ type: mid.type, hp: mid.hp, at: d + 200, trickleHp: hp }); d += 630; }   // gap keeps gates off screen during the fight
  }
  const end = spec.bosses.find(b => b.after === 'end');
  if (end) { L.bosses.push({ type: end.type, hp: end.hp, at: d + 200, trickleHp: hp }); d += 200; }
  L.length = d + 100;
  return L;
}
const LEVELS = LEVEL_SPECS.map(layoutLevel);
// Only the first saga is playable; the rest are shown locked.
const SAGAS = ['Bamboo Road', 'Crimson Marsh', 'Frozen Pass', 'Ember Fortress', 'Demon Gate'];

/* ============================================================
   SAVE — same localStorage keys as the prototype
   ============================================================ */
const Save = {
  souls: 0, fire: 1, damage: 1, revenue: 1,
  level: 1,                      // highest level unlocked (4 = saga 1 cleared)
  music: true, sfx: true, shake: true,
  armor: '', weapon: '',         // equipped gear ids
  load() {
    const num = (k, def) => {
      try { const v = parseInt(localStorage.getItem(k), 10); return Number.isFinite(v) ? v : def; }
      catch (e) { return def; }
    };
    this.souls = num('samurai_souls', 0);
    this.fire = num('samurai_fire', 1);
    this.damage = num('samurai_damage', 1);
    this.revenue = num('samurai_revenue', 1);
    this.level = num('samurai_level', 1);
    this.music = num('samurai_music', 1) === 1;
    this.sfx = num('samurai_sfx', 1) === 1;
    this.shake = num('samurai_shake', 1) === 1;
    try { this.armor = localStorage.getItem('samurai_armor') || ''; this.weapon = localStorage.getItem('samurai_weapon') || ''; } catch (e) {}
  },
  save() {
    try {
      localStorage.setItem('samurai_souls', this.souls);
      localStorage.setItem('samurai_fire', this.fire);
      localStorage.setItem('samurai_damage', this.damage);
      localStorage.setItem('samurai_revenue', this.revenue);
      localStorage.setItem('samurai_level', this.level);
      localStorage.setItem('samurai_music', this.music ? 1 : 0);
      localStorage.setItem('samurai_sfx', this.sfx ? 1 : 0);
      localStorage.setItem('samurai_shake', this.shake ? 1 : 0);
      localStorage.setItem('samurai_armor', this.armor);
      localStorage.setItem('samurai_weapon', this.weapon);
    } catch (e) {}
  },
  resetProgress() { this.souls = 0; this.fire = this.damage = this.revenue = this.level = 1; this.armor = this.weapon = ''; this.save(); },
};
Save.load();
window.addEventListener('pagehide', () => Save.save());
document.addEventListener('visibilitychange', () => { if (document.hidden) Save.save(); });

const Stats = {
  cost: lvl => Math.floor(40 * Math.pow(1.55, lvl - 1)),
  attackMs: () => Math.max(180, 400 - Save.fire * 25),
  damage: () => 1 + (Save.damage - 1) * 0.5,
  soulsPerKill: () => 1.5 * Save.revenue,
};
const fmt = n => Number.isInteger(n) ? String(n) : n.toFixed(2).replace(/0$/, '');
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const damp = (rate, dt) => 1 - Math.exp(-rate * dt);   // frame-rate independent lerp factor

/* ============================================================
   SOUND — effects and music are synthesised with Web Audio, so
   there are no audio files to load
   ============================================================ */
const Sound = {
  ctx: null, last: {},
  muted: (() => { try { return localStorage.getItem('samurai_muted') === '1'; } catch (e) { return false; } })(),
  // Browsers only allow audio after a touch, so this runs on the first one.
  unlock() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    const c = this.ctx = new AC();
    this.master = c.createGain(); this.master.gain.value = this.muted ? 0 : 1; this.master.connect(c.destination);
    this.sfx = c.createGain(); this.sfx.connect(this.master);
    this.mus = c.createGain(); this.mus.connect(this.master);
    this.applyOptions();
    this.noiseBuf = c.createBuffer(1, c.sampleRate, c.sampleRate);
    const d = this.noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    setInterval(() => Music.tick(), 50);
  },
  applyOptions() {                 // music / effects switches from Settings
    if (!this.ctx) return;
    this.sfx.gain.value = Save.sfx ? 0.5 : 0;
    this.mus.gain.value = Save.music ? 0.32 : 0;
  },
  setMuted(m) {
    this.muted = m;
    try { localStorage.setItem('samurai_muted', m ? '1' : '0'); } catch (e) {}
    if (this.ctx) this.master.gain.value = m ? 0 : 1;
  },
  env(g, t, vol, dur, attack) {
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + (attack || 0.005));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  },
  // One oscillator with a pitch slide and a fade-out.
  tone(o) {
    const c = this.ctx, t = o.at || c.currentTime, osc = c.createOscillator(), g = c.createGain();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(o.f, t);
    if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t + o.dur);
    this.env(g, t, o.vol, o.dur, o.attack);
    osc.connect(g); g.connect(o.out || this.sfx);
    osc.start(t); osc.stop(t + o.dur + 0.03);
  },
  // A burst of filtered noise.
  noise(o) {
    const c = this.ctx, t = o.at || c.currentTime, src = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    src.buffer = this.noiseBuf;
    f.type = o.type || 'bandpass'; f.Q.value = o.q || 1;
    f.frequency.setValueAtTime(o.f, t);
    if (o.to) f.frequency.exponentialRampToValueAtTime(o.to, t + o.dur);
    this.env(g, t, o.vol, o.dur, o.attack);
    src.connect(f); f.connect(g); g.connect(o.out || this.sfx);
    src.start(t, Math.random() * 0.5, o.dur + 0.05);
  },
  gaps: { slash: 45, soul: 60, claw: 70, kill: 40, lose: 60 },   // minimum ms between repeats, so a big army isn't a wall of noise
  play(name) {
    if (!this.ctx || this.muted || this.ctx.state !== 'running') return;
    const now = performance.now();
    if (now - (this.last[name] || 0) < (this.gaps[name] || 0)) return;
    this.last[name] = now;
    this.bank[name](this, 0.9 + Math.random() * 0.2, this.ctx.currentTime);
  },
  bank: {
    click: (S) => S.tone({ type: 'triangle', f: 660, to: 880, dur: 0.07, vol: 0.3 }),
    deny: (S) => S.tone({ type: 'square', f: 160, to: 110, dur: 0.16, vol: 0.18 }),
    buy: (S, r, t) => [523, 659, 784, 1047].forEach((f, i) => S.tone({ type: 'triangle', f, dur: 0.16, vol: 0.3, at: t + i * 0.06 })),
    slash: (S, r) => S.noise({ f: 3800 * r, to: 900, dur: 0.09, vol: 0.2, q: 1.4 }),
    claw: (S, r) => S.noise({ type: 'highpass', f: 1800 * r, dur: 0.06, vol: 0.14 }),
    swing: (S) => S.noise({ f: 900, to: 250, dur: 0.2, vol: 0.4, q: 0.8 }),
    kill: (S, r) => { S.tone({ f: 190 * r, to: 60, dur: 0.14, vol: 0.4 }); S.noise({ type: 'lowpass', f: 900, dur: 0.08, vol: 0.2 }); },
    lose: (S, r) => S.tone({ type: 'sawtooth', f: 330 * r, to: 110, dur: 0.18, vol: 0.2 }),
    soul: (S, r) => S.tone({ f: 1250 * r, to: 1900, dur: 0.08, vol: 0.12 }),
    gateGood: (S, r, t) => { S.tone({ type: 'triangle', f: 587, dur: 0.14, vol: 0.4 }); S.tone({ type: 'triangle', f: 880, dur: 0.24, vol: 0.4, at: t + 0.09 }); },
    gateBad: (S, r, t) => { S.tone({ type: 'square', f: 233, dur: 0.14, vol: 0.2 }); S.tone({ type: 'square', f: 156, to: 110, dur: 0.3, vol: 0.2, at: t + 0.1 }); },
    spike: (S) => { S.tone({ type: 'square', f: 1100, to: 300, dur: 0.1, vol: 0.16 }); S.noise({ type: 'highpass', f: 3000, dur: 0.1, vol: 0.2 }); },
    special: (S) => { S.tone({ f: 900, to: 90, dur: 0.7, vol: 0.4 }); S.noise({ f: 2500, to: 200, dur: 0.7, vol: 0.2, q: 0.6 }); },
    gong: (S) => [[98, 0.5], [147, 0.3], [233, 0.2], [311, 0.12]].forEach(([f, v]) => S.tone({ f, dur: 1.8, vol: v, attack: 0.01 })),
    warn: (S) => S.tone({ type: 'square', f: 220, to: 440, dur: 0.3, vol: 0.14 }),
    warnPower: (S) => S.tone({ type: 'sawtooth', f: 130, to: 620, dur: 0.7, vol: 0.18, attack: 0.3 }),
    slam: (S) => { S.tone({ f: 130, to: 32, dur: 0.45, vol: 0.9 }); S.noise({ type: 'lowpass', f: 700, to: 120, dur: 0.35, vol: 0.5 }); },
    thunder: (S, r) => { S.noise({ type: 'lowpass', f: 320 * r, to: 60, dur: 1.3, vol: 0.45, attack: 0.03 }); S.tone({ f: 70, to: 32, dur: 1.1, vol: 0.4 }); },
    dodge: (S, r, t) => { S.tone({ type: 'triangle', f: 988, dur: 0.07, vol: 0.25 }); S.tone({ type: 'triangle', f: 1319, dur: 0.12, vol: 0.25, at: t + 0.06 }); },
    win: (S, r, t) => [294, 349, 440, 587, 698, 880].forEach((f, i) => S.tone({ type: 'triangle', f, dur: 0.5, vol: 0.35, at: t + i * 0.11 })),
    defeat: (S, r, t) => [440, 349, 294, 233, 147].forEach((f, i) => S.tone({ type: 'triangle', f, dur: 0.6, vol: 0.3, at: t + i * 0.2 })),
  },
};
['pointerdown', 'touchend', 'keydown'].forEach(ev => window.addEventListener(ev, () => Sound.unlock(), true));
document.addEventListener('visibilitychange', () => {
  if (!Sound.ctx) return;
  if (document.hidden) Sound.ctx.suspend(); else Sound.ctx.resume();
});

// A looping tune in a Japanese hirajoshi scale: plucked melody, bass and taiko-style drums.
const Music = {
  mode: 'off', rate: 1, step: 0, next: 0,
  scale: [293.66, 329.63, 349.23, 440, 466.16, 587.33, 659.25, 698.46, 880],
  tuneA: [5,-1,-1,4, 3,-1,2,-1, 3,-1,-1,-1, 0,-1,2,3,  5,-1,-1,6, 7,-1,6,-1, 5,-1,4,-1, 3,-1,-1,-1],
  tuneB: [3,-1,4,-1, 5,-1,-1,-1, 7,-1,6,5, 4,-1,-1,-1,  3,-1,2,-1, 0,-1,2,-1, 3,-1,4,3, 2,-1,-1,-1],
  bass: { 0: 73.42, 6: 73.42, 8: 110, 12: 87.31 },
  drums: { run: { kick: [0, 4, 10, 12], rim: [6, 14] }, boss: { kick: [0, 2, 4, 8, 10, 12], rim: [6, 14, 15] } },
  bpm: { menu: 66, run: 112, boss: 134, storm: 92, stormBoss: 118 },
  // The storm stage: low, sparse and heavy. A drone, a slow melody an octave down, and war drums.
  stormScale: [146.83, 164.81, 174.61, 220, 233.08, 293.66, 329.63, 349.23],
  stormA: [0,-1,-1,-1, -1,-1,2,-1, 1,-1,-1,-1, 0,-1,-1,-1,  4,-1,-1,3, -1,-1,2,-1, 1,-1,0,-1, -1,-1,-1,-1],
  stormB: [5,-1,-1,-1, 4,-1,-1,-1, 3,-1,2,-1, 1,-1,-1,-1,  2,-1,-1,-1, 1,-1,-1,0, -1,-1,-1,-1, 0,-1,-1,-1],
  stormNote(i, t) {
    const s = i % 32, q = s % 16, out = Sound.mus, boss = this.mode === 'stormBoss';
    const m = (Math.floor(i / 32) % 4 === 3 ? this.stormB : this.stormA)[s];
    if (m >= 0) {
      const f = this.stormScale[m];
      Sound.tone({ type: 'triangle', f, dur: 0.9, vol: 0.34, attack: 0.02, at: t, out });
      Sound.tone({ type: 'square', f: f / 2, dur: 0.6, vol: 0.07, at: t, out });
    }
    if (q === 0) [73.42, 110].forEach(f => Sound.tone({ f, dur: 2.6, vol: 0.2, attack: 0.3, at: t, out }));         // drone
    if (q % 4 === 0 || (boss && q % 2 === 0)) Sound.tone({ type: 'triangle', f: 73.42, dur: 0.22, vol: 0.3, at: t, out });   // pulse
    if ((boss ? [0, 3, 6, 8, 11, 14] : [0, 6, 8, 14]).includes(q)) Sound.tone({ f: 90, to: 34, dur: 0.34, vol: 0.9, at: t, out });   // war drum
    if (boss && (q === 4 || q === 12)) Sound.noise({ type: 'highpass', f: 2200, dur: 0.05, vol: 0.2, at: t, out });
  },
  // The menu has its own calm theme: a slow flute-like line over a soft drone, in a brighter scale.

/* ============================================================
   SHARED SCENE HELPERS
   ============================================================ */
class BaseScene extends Phaser.Scene {
  setupCamera() { this.cameras.main.setOrigin(0, 0).setZoom(R); }
  img(x, y, key) { return this.add.image(x, y, key).setScale(S); }
  sword(x, y) { return this.img(x, y, 'katana').setOrigin(0.52, 0.97); }
  txt(x, y, str, size, color = '#fff', extra = {}) {
    return this.add.text(x, y, str, Object.assign({
      fontFamily: FONT, fontSize: size + 'px', color, fontStyle: 'bold', resolution: R,
    }, extra)).setOrigin(0.5);
  }
  muteButton(x, y) {
    const t = this.txt(x, y, '♪', 22, '#fff', { stroke: '#000', strokeThickness: 4 }).setDepth(5100);
    const show = () => t.setAlpha(Sound.muted ? 0.3 : 1);
    show();
    this.add.zone(x, y, 44, 44).setDepth(5100).setInteractive({ useHandCursor: true })
      .on('pointerdown', () => { Sound.unlock(); Sound.setMuted(!Sound.muted); show(); });
  }
  button(x, y, w, h, color, label, size, onTap) {
    const g = this.add.graphics();
    const draw = (pressed) => {
      g.clear();
      g.fillStyle(0x000000, 0.35).fillRoundedRect(x - w / 2, y - h / 2 + 4, w, h, 10);
      g.fillStyle(color, 1).fillRoundedRect(x - w / 2, y - h / 2 + (pressed ? 3 : 0), w, h, 10);
      g.fillStyle(0xffffff, 0.16).fillRoundedRect(x - w / 2 + 3, y - h / 2 + 3 + (pressed ? 3 : 0), w - 6, h * 0.4, 8);
    };
    draw(false);
    const t = this.txt(x, y, label, size);
    const z = this.add.zone(x, y, w, h).setInteractive({ useHandCursor: true });
    let held = false;
    const set = on => { held = on; draw(on); t.y = y + (on ? 3 : 0); };
    z.on('pointerdown', () => set(true));
    z.on('pointerout', () => set(false));
    z.on('pointerup', () => { if (!held) return; set(false); Sound.play('click'); onTap(); });
    return { g, t, z };
  }
}

    this.panel(W / 2, 214, 368, 264);

    LEVELS.slice(0, SAGA_LEVELS).forEach((L, i) => {
      const n = i + 1, x = 82 + i * 118, open = n <= Save.level, done = n < Save.level;
      const b = this.button(x, 206, 104, 96, open ? (done ? 0x2e7d32 : 0xc62828) : 0x3a3444, open ? String(n) : '—', 34, () => {

        this.scene.start('Game', { level: n });
      });
      b.t.y -= 12; if (!open) b.t.setColor('#8a8094');
      this.txt(x, 232, open ? L.name : 'LOCKED', 10, open ? '#fff' : '#8a8094', { align: 'center', wordWrap: { width: 96 } });
      if (done) this.txt(x + 38, 172, '✓', 16, '#fff59d');
    });
    // The saga's major boss, fought after level 3.
    const bossOpen = Save.level > SAGA_LEVELS, bossDone = Save.level > SAGA_LEVELS + 1;
    const boss = this.button(W / 2, 304, 340, 46, bossDone ? 0x2e7d32 : bossOpen ? 0x6a1b9a : 0x3a3444,
      bossOpen ? 'SAGA BOSS · ' + LEVELS[SAGA_LEVELS].name.toUpperCase() + (bossDone ? '  ✓' : '') : 'SAGA BOSS · LOCKED', 14, () => {
        if (!bossOpen) { Sound.play('deny'); return; }
        this.scene.start('Game', { level: SAGA_LEVELS + 1 });
      });
    if (!bossOpen) boss.t.setColor('#8a8094');
    // Sagas 2-5: locked.
    for (let i = 1; i < SAGAS.length; i++) {
      const y = 322 + i * 80;
      this.panel(W / 2, y, 368, 68, 0.7);
      this.txt(34, y - 10, numerals[i] + ' · ' + SAGAS[i].toUpperCase(), 16, '#8a8094').setOrigin(0, 0.5);
      this.txt(34, y + 12, '3 levels · coming soon', 12, '#6f6678', { fontStyle: 'normal' }).setOrigin(0, 0.5);
      this.txt(338, y, 'LOCKED', 12, '#8a8094');
    }
  }
}

class SettingsScene extends MenuBase {

  create() {

}

/* ============================================================
   GAME — the run
   ============================================================ */
class GameScene extends BaseScene {
  constructor() { super('Game'); }
  init(data) {
    this.levelNo = clamp((data && data.level) || 1, 1, LEVELS.length);
    this.L = LEVELS[this.levelNo - 1];
  }

  create() {
    this.setupCamera();
    this.dist = 0;                 // distance travelled; drives layout and the progress bar
    this.speedMod = 1;
    this.dmgMod = 1;               // grows with each lucky charm broken
    this.timeScale = 1;            // 1 normally, eases to CFG.slowScale during the special
    this.slowLeft = 0;
    this.charge = 0;
    this.count = CFG.startArmy;
    this.earned = 0;
    this.wound = 0;                // enemy strikes add up here; each full point costs one samurai
    this.over = false;
    this.gearOpen = null;          // 'armor' or 'weapon' while that menu is showing
    this.bolts = [];               // lightning streaks being drawn
    this.hazards = [];             // lightning left on the ground
    this.started = false;          // false while the level waits on its start screen
    this.fight = false;            // true while the scroll is stopped for a big fight
    this.boss = null;              // the next (or current) big fight; set in buildLevel
    this.finaleDone = false;       // true once every big fight is won
    this.targetX = W / 2;
    this.armyX = W / 2;
    this.formY = 440;
    this.soldiers = [];
    this.enemies = [];
    this.gates = [];
    this.spikes = [];
    this.decor = [];

    Music.set(this.L.storm ? 'storm' : 'run');
    this.applyGear();
    this.buildGround();
    this.buildLevel();
    this.buildFx();
    this.buildHud();
    this.syncArmy(true);
    this.stageName = this.levelNo > SAGA_LEVELS ? 'SAGA BOSS' : 'LEVEL ' + this.levelNo;
    this.banner(this.stageName, this.L.name);
    this.showStartUi();
    this.input.on('pointerdown', p => {
      if (this.started || this.gearOpen || p.worldY < 120 || p.worldY > 505 || (p.worldX < 104 && p.worldY < 200)) return;
      this.beginRun();
    });

    const steer = p => {
      if (!this.started) return;
      if (p.worldY > 636 && p.worldX > 280) return;        // special button area
      if (p.worldY < 80 && p.worldX > 345) return;         // mute button area
      this.targetX = clamp(p.worldX, CFG.steerMin, CFG.steerMax);
    };
    this.input.on('pointerdown', steer);
    this.input.on('pointermove', steer);
  }

  /* ---------- gear ---------- */
  // The extra lightning damage Futsu-no-mitama adds to a hit on enemy `e`.
  lightningBonus(e, dmg) {
    if (!this.thunderBlade) return 0;
    const T = CFG.thunderBlade, el = ELEMENT[e.kind];
    return dmg * T.bonus * (T.strong.includes(el) ? T.strongMult : T.weak.includes(el) ? T.weakMult : 1);
  }

  // Reads the equipped armor and weapon and restyles any samurai already on the field.
  applyGear() {
    this.thunderArmor = Save.armor === 'thunder';
    this.thunderBlade = Save.weapon === 'thunder';
    this.armorTint = this.thunderArmor ? 0xc9bcff : 0xffffff;
    this.bladeTint = this.thunderBlade ? 0xd9a8ff : 0xffffff;
    (this.soldiers || []).forEach(s => { s.img.setTint(this.armorTint); s.blade.setTint(this.bladeTint); });
  }

  /* ---------- start screen ---------- */
  // The level waits with the army standing ready and the upgrade cards along the bottom.
  showStartUi() {
    if (this.startUi) this.startUi.forEach(o => o.destroy());
    const before = new Set(this.children.list);
    this.add.rectangle(W / 2, 618, W, 204, 0x0a0610, 0.6);
    const cards = [
      ['fire', 'ATTACK SPEED', 0x2e7d32, (Stats.attackMs() / 1000).toFixed(2) + 's swing'],
      ['damage', 'BLADE DAMAGE', 0x1565c0, fmt(Stats.damage()) + ' per hit'],
      ['revenue', 'SOUL REWARD', 0x6a1b9a, fmt(Stats.soulsPerKill()) + ' per kill'],
    ];
    cards.forEach(([key, title, color, stat], i) => {
      const x = 72 + i * 128, y = 616, w = 116, h = 150, cost = Stats.cost(Save[key]), can = Save.souls >= cost;
      const g = this.add.graphics();
      g.fillStyle(0x1c1220, 0.96).fillRoundedRect(x - w / 2, y - h / 2, w, h, 12);
      g.fillStyle(color, 1).fillRoundedRect(x - w / 2, y - h / 2, w, 30, { tl: 12, tr: 12, bl: 0, br: 0 });
      g.lineStyle(2, 0xffffff, 0.25).strokeRoundedRect(x - w / 2, y - h / 2, w, h, 12);
      this.txt(x, y - h / 2 + 15, title, 11);
      this.txt(x, y - 28, 'Lv ' + Save[key], 22);
      this.txt(x, y - 4, stat, 11, '#cfc3d6', { fontStyle: 'normal' });
      const b = this.button(x, y + 42, 96, 40, can ? color : 0x4a4250, cost + '', 16, () => {
        if (Save.souls < cost) { Sound.play('deny'); return; }
        Save.souls -= cost; Save[key]++; Save.save(); Sound.play('buy');
        this.time.delayedCall(0, () => { if (!this.started) this.showStartUi(); });
      });
      if (!can) b.t.setColor('#9a90a0');
    });
    const hint = this.txt(W / 2, 372, 'touch the path to start', 15, '#fff', { stroke: '#000', strokeThickness: 4 });
    this.tweens.add({ targets: hint, alpha: 0.35, duration: 600, yoyo: true, repeat: -1 });
    this.button(54, 96, 84, 34, 0x3a3050, '‹ SAGAS', 13, () => this.scene.start('Sagas'));
    const reopen = kind => this.time.delayedCall(0, () => { if (!this.started) { this.gearOpen = kind; this.showStartUi(); } });
    this.button(54, 138, 84, 32, 0x4a3f63, 'ARMOR', 12, () => reopen('armor'));
    this.button(54, 178, 84, 32, 0x4a3f63, 'WEAPON', 12, () => reopen('weapon'));
    if (this.gearOpen) {                                     // the armor or weapon menu
      const kind = this.gearOpen, won = Save.level > SAGA_LEVELS + 1;
      this.add.rectangle(W / 2, H / 2, W, H, 0x05020c, 0.6);
      const g = this.add.graphics();
      g.fillStyle(0x1c1220, 0.97).fillRoundedRect(24, 104, 352, 408, 14);
      g.lineStyle(2, 0xffffff, 0.25).strokeRoundedRect(24, 104, 352, 408, 14);
      this.txt(W / 2, 130, kind === 'armor' ? 'ARMOR' : 'WEAPON', 20, '#ffd54f');
      let y = 172;
      GEAR[kind].forEach(item => {
        const have = !item.boss || won, on = Save[kind] === item.id;
        this.txt(40, y, item.name, 16, have ? '#fff' : '#8a8094').setOrigin(0, 0.5);
        const b = this.button(312, y + 6, 100, 38, on ? 0x2e7d32 : have ? 0x1565c0 : 0x3a3444, on ? 'EQUIPPED' : have ? 'EQUIP' : 'LOCKED', 13, () => {
          if (!have) { Sound.play('deny'); return; }
          Save[kind] = item.id; Save.save(); Sound.play('buy');
          this.applyGear();
          reopen(kind);
        });
        if (!have) b.t.setColor('#8a8094');
        const effect = this.txt(40, y + 14, have ? item.effect : 'Defeat the saga boss to unlock.', 11, '#ffe082', { fontStyle: 'normal', wordWrap: { width: 212 } }).setOrigin(0, 0);
        y += 22 + effect.height;
        if (have && item.lore) {
          const lore = this.txt(40, y, item.lore, 10.5, '#cfc3d6', { fontStyle: 'italic', wordWrap: { width: 320 }, lineSpacing: 2 }).setOrigin(0, 0);
          y += lore.height + 6;
        }
        y += 22;
      });
      this.button(W / 2, 482, 140, 38, 0x4a3f63, 'CLOSE', 14, () => reopen(null));
    }
    this.startUi = this.children.list.filter(o => !before.has(o));
    this.startUi.forEach((o, i) => o.setDepth(5400 + i));
  }

  beginRun() {
    if (this.started) return;
    this.gearOpen = null;
    this.started = true;
    this.startUi.forEach(o => o.destroy());
    this.startUi = null;
    this.specialText.setVisible(true); this.specialHint.setVisible(true);
  }

  /* ---------- construction ---------- */
  buildGround() {
    this.grass = this.add.tileSprite(W / 2, H / 2, W, H, 'grass').setTileScale(S).setDepth(-20);
    const pw = CFG.pathRight - CFG.pathLeft;
    this.path = this.add.tileSprite(W / 2, H / 2, pw, H, 'path').setTileScale(S).setDepth(-19);
    const fog = this.add.graphics().setDepth(-18);           // distance haze at the top
    fog.fillGradientStyle(0x1a1030, 0x1a1030, 0x1a1030, 0x1a1030, 0.75, 0.75, 0, 0).fillRect(0, 0, W, 200);
    for (let d = 100; d < this.L.length + 600; d += 150) {
      const left = (d / 150) % 2 < 1;
      const key = this.L.storm ? (Math.random() < 0.6 ? 'deadTree' : 'rubble') : Math.random() < 0.55 ? 'tree' : 'lantern';
      this.decor.push({ d, x: left ? 24 + Math.random() * 12 : W - 24 - Math.random() * 12, obj: this.img(0, -200, key), flat: true });
    }
    if (!this.L.storm) return;
    // The storm stage: scorched colours, cracked ground, a dark sky that flickers.
    this.grass.setTint(0x7c8792); this.path.setTint(0xa9a0b3);
    fog.fillGradientStyle(0x05020c, 0x05020c, 0x05020c, 0x05020c, 0.5, 0.5, 0, 0).fillRect(0, 0, W, 300);
    for (let d = 160; d < this.L.length + 500; d += 110 + Math.random() * 120) {
      this.decor.push({ d, x: 90 + Math.random() * 220, obj: this.img(0, -200, 'crack').setRotation(Math.random() * 3), flat: true });
    }
    this.stormDark = this.add.rectangle(W / 2, H / 2, W, H, 0x05020c, 0.15).setDepth(-7);   // deepens when the boss awakens
    this.skyFlash = this.add.rectangle(W / 2, H / 2, W, H, 0xc9b8ff, 1).setAlpha(0).setDepth(-6);
    this.skyT = 1500;
    this.stormT = CFG.storm.everyMs[0];
    this.wave = null;
    this.waveImg = this.img(0, -200, 'slash').setTint(0xd1c4e9).setBlendMode(Phaser.BlendModes.ADD).setDepth(2955).setVisible(false);
  }

  buildLevel() {
    this.L.gates.forEach(g => {
      const goodLeft = Math.random() < 0.5;
      this.gates.push({
        d: g.d, used: false,
        left: this.makeGate(130, goodLeft ? g.good : g.bad, goodLeft),
        right: this.makeGate(270, goodLeft ? g.bad : g.good, !goodLeft),
      });
    });
    this.L.packs.forEach(pk => {
      for (let i = 0; i < pk.n; i++) {
        const demon = this.L.demons && Math.random() < CFG.enemy.demonShare;
        this.addEnemy(demon ? 'demon' : 'zombie', 85 + Math.random() * 230, pk.d + i * pk.gap, Math.round(pk.hp * (demon ? CFG.enemy.demonHp : 1)));
      }
    });
    const [charmRows, charmHp, charmGrow] = this.L.charms;
    charmRows.forEach((row, idx) => {
      const e = this.addEnemy('charm', 100 + Math.random() * 200, this.gates[row].d - CFG.charm.lead, charmHp + charmGrow * idx);
      const glow = this.img(0, 0, 'glow').setBlendMode(Phaser.BlendModes.ADD);
      e.sprite = e.obj;                                      // the cat itself, for hit flashes
      e.obj = this.add.container(e.x, -200, [glow, e.sprite.setPosition(0, 0)]);
      Object.assign(e, { glow, r: 8, souls: CFG.charm.souls, vx: (Math.random() < 0.5 ? -1 : 1) * CFG.charm.speed });
    });
    this.L.spikes.forEach(d => {
      this.addSpike(Math.random() < 0.5 ? 130 : 270, d);
    });
    this.bosses = this.L.bosses.map(b => {
      const P = CFG.bosses[b.type];
      return Object.assign(this.addEnemy(P.key, W / 2, b.at, b.hp),
        { prof: P, r: P.r, souls: P.souls, state: 'chase', t: P.chaseMs + 500, swings: 0, power: false, air: false, trickleHp: b.trickleHp, trickleT: P.trickleMs });
    });
    this.specialMax = Math.max(CFG.specialMax, Math.round(this.enemies.length / CFG.specialsPerLevel));
    this.boss = this.bosses[0] || null;
    this.finaleDone = !this.boss;
  }

  makeGate(x, op, good) {
    const col = good ? 0x1e88e5 : 0xe53935, dark = good ? 0x0d47a1 : 0x8e0000;
    const g = this.add.graphics();
    g.fillStyle(col, 0.5).fillRoundedRect(-62, -24, 124, 48, 6);
    g.lineStyle(3, 0xffffff, 0.9).strokeRoundedRect(-62, -24, 124, 48, 6);
    g.fillStyle(dark, 1).fillRect(-66, -30, 8, 60).fillRect(58, -30, 8, 60);     // posts
    g.fillStyle(dark, 1).fillRoundedRect(-72, -38, 144, 10, 3);                    // torii beam
    g.fillStyle(col, 1).fillRoundedRect(-68, -42, 136, 5, 2);
    const label = (op.op === 'x' ? '×' : op.op === '-' ? '−' : '+') + op.n;
    const t = this.txt(0, 0, label, 28, '#fff', { stroke: good ? '#0d2a5c' : '#5c0d0d', strokeThickness: 5 });
    return { x, op, good, obj: this.add.container(x, -200, [g, t]) };
  }

  addEnemy(kind, x, d, hp) {
    const e = { kind, x, d, hp, maxHp: hp, r: 0, strike: 400, seed: Math.random() * 6, obj: this.img(x, -200, kind) };
    this.enemies.push(e);
    return e;
  }

  addSpike(x, d) { this.spikes.push({ x, d, hit: false, obj: this.img(x, -200, 'spike'), flat: true }); }

  buildFx() {
    this.burst = this.add.particles(0, 0, 'dot', {
      speed: { min: 40, max: 150 }, lifespan: { min: 250, max: 480 }, scale: { start: S, end: 0 }, emitting: false,
    }).setDepth(3000);
    if (this.L.storm) this.add.particles(0, 0, 'dot', {      // rain
      x: { min: 0, max: W + 80 }, y: -10, lifespan: 900, speedY: { min: 760, max: 900 }, speedX: -90,
      scaleX: S * 0.25, scaleY: S * 2.6, frequency: 28, alpha: 0.28, tint: 0xb0bec5,
    }).setDepth(3500);
    else this.add.particles(0, 0, 'petal', {
      x: { min: 0, max: W }, y: -10, lifespan: 8000, speedY: { min: 35, max: 80 }, speedX: { min: -25, max: 10 },
      scale: S, rotate: { start: 0, end: 360 }, frequency: 500, alpha: 0.8,
    }).setDepth(3500);
    this.danger = this.add.graphics().setDepth(-10);        // red warning zone under a boss attack
    this.boltG = this.add.graphics().setDepth(2960);        // lightning
    this.shade = this.add.rectangle(W / 2, H / 2, W, H, 0x05020c, 1).setAlpha(0).setDepth(-5);   // darkens the ground during a power-up
    this.slowTint = this.add.rectangle(W / 2, H / 2, W, H, 0x5e35b1, 1).setAlpha(0).setDepth(3600);
  }

  buildHud() {
    const D = 5000;
    this.hud = this.add.graphics().setDepth(D);
    this.soulIcon = this.img(22, 56, 'soul').setScale(S * 1.2).setDepth(D);
    this.soulText = this.txt(34, 56, '', 16, '#e1bee7', { stroke: '#1a0a20', strokeThickness: 3 }).setOrigin(0, 0.5).setDepth(D);
    this.countText = this.txt(0, 0, '', 15, '#fff', { stroke: '#0d1642', strokeThickness: 4 }).setDepth(D);
    this.specialText = this.txt(336, 676, 'SLOW', 13).setDepth(D + 1).setVisible(false);
    this.specialHint = this.txt(130, 662, 'SPECIAL', 10, '#b39ddb').setDepth(D).setVisible(false);
    this.add.zone(336, 676, 84, 76).setInteractive().on('pointerdown', () => this.activateSpecial());
    this.muteButton(376, 58);
  }

  /* ---------- main loop ---------- */
  update(time, delta) {
    if (this.over) return;
    if (!this.started) {                                   // start screen: the world is drawn but frozen
      this.updateScroll(0);
      this.updateArmy(time, Math.min(delta, 50) / 1000);
      this.updateHud(0);
      return;
    }
    const dt = Math.min(delta, 50) / 1000;                 // real time: steering, samurai attacks
    const slowing = this.slowLeft > 0;
    this.timeScale += ((slowing ? CFG.slowScale : 1) - this.timeScale) * damp(10, dt);
    const wdt = dt * this.timeScale;                       // world time: scroll, enemy attacks
    Music.rate = this.timeScale;

    if (slowing) this.slowLeft = Math.max(0, this.slowLeft - delta);
    this.slowTint.setAlpha((1 - this.timeScale) / (1 - CFG.slowScale) * 0.2);

    this.updateEnemies(wdt);
    this.updateScroll(wdt);
    this.updateArmy(time, dt);
    this.updateGates();
    this.updateCombat(dt);
    this.updateHazards(wdt);
    if (this.L.storm) this.updateStorm(wdt);
    this.drawBolts(wdt);
    this.updateHud(dt);

    if (this.count <= 0) this.finish(false);
    else if (this.finaleDone && this.dist >= this.L.length) this.finish(true);
  }

  updateScroll(wdt) {
    if (!this.fight) {
      const speed = CFG.baseSpeed * this.L.pace * (1 + CFG.speedRamp * this.dist / this.L.length) * this.speedMod;
      const step = speed * wdt;
      this.dist += step;
      this.grass.tilePositionY -= step * R;
      this.path.tilePositionY -= step * R;
      this.enemies.forEach(e => { if (e.hold) e.d += step; });
    }
    const place = o => {
      const y = CFG.armyY - (o.d - this.dist);
      o.y = y;
      if (y > H + 80) { o.obj.destroy(); o.gone = true; return; }
      if (y < -120) { if (o.obj.visible) o.obj.setVisible(false); return; }      // far ahead: nothing to draw yet
      const p = this.persp(y);
      const bob = o.seed !== undefined && !o.r && !o.hold && o !== this.boss ? Math.sin(this.time.now * 0.02 + o.seed) * 1.5 : 0;
      o.obj.setVisible(y > -90).setPosition(o.x, y + bob).setScale((o.obj.type === 'Container' ? 1 : S) * p * (o.size || 1)).setDepth(o.flat ? y - 30 : y);
    };
    const alive = o => !o.gone;
    this.decor.forEach(place); this.spikes.forEach(place); this.enemies.forEach(place);
    this.gates.forEach(g => {
      [g.left, g.right].forEach(s => { s.d = g.d; place(s); });
      g.y = g.left.y; g.gone = g.left.gone;
    });
    this.decor = this.decor.filter(alive); this.spikes = this.spikes.filter(alive);
    this.enemies = this.enemies.filter(alive); this.gates = this.gates.filter(alive);
    if (!this.fight && this.boss && this.boss.y >= 330) this.startFight();
  }

  // Far things are drawn smaller.
  persp(y) { return 0.7 + 0.3 * clamp((y - 60) / 500, 0, 1); }

  updateArmy(time, dt) {
    this.armyX += (this.targetX - this.armyX) * damp(12, dt);
    const wantForm = !this.started ? 440 : this.fight ? this.boss.y + 92 : CFG.armyY;   // stands above the upgrade cards until the run begins
    this.formY += (wantForm - this.formY) * damp(5, dt);
    const n = this.soldiers.length, cols = Math.min(5, Math.ceil(Math.sqrt(n || 1)));
    this.soldiers.forEach((s, i) => {
      const col = i % cols, row = Math.floor(i / cols);
      const inRow = Math.min(cols, n - row * cols);
      const wx = this.armyX + (col - (inRow - 1) / 2) * 21;
      const wy = this.formY + row * 18;
      const k = damp(16 - row * 2.5, dt);                 // back rows trail a little
      const lean = clamp((wx - s.x) * 0.02, -0.25, 0.25);
      s.x += (wx - s.x) * k; s.y += (wy - s.y) * k;
      s.lunge *= 1 - damp(14, dt);
      s.pop += (1 - s.pop) * damp(14, dt);
      const bob = Math.sin(time * 0.018 + i * 1.7) * 1.6;
      s.swing = Math.max(0, s.swing - dt / 0.17);
      const p = this.persp(s.y) * s.pop, y = s.y + bob - s.lunge;
      s.img.setPosition(s.x, y).setRotation(lean).setScale(S * p).setDepth(s.y);
      s.blade.setPosition(s.x + 9.5 * p, y + 5.5 * p).setScale(S * p).setDepth(s.y + 0.5)
        .setRotation(0.45 + lean - Math.sin(s.swing * Math.PI) * 2.4);
    });
  }

  updateGates() {
    this.gates.forEach(g => {
      if (g.used || g.y < this.formY - 14) return;
      g.used = true;
      const side = this.armyX < W / 2 ? g.left : g.right;
      const other = side === g.left ? g.right : g.left;
      const before = this.count;
      if (side.op.op === '+') this.count += side.op.n;
      if (side.op.op === '-') this.count = Math.max(1, this.count - side.op.n);   // a red gate never takes the last samurai
      if (side.op.op === 'x') this.count *= side.op.n;
      const diff = this.count - before;
      this.float(this.armyX, this.formY - 40, (diff >= 0 ? '+' : '−') + Math.abs(diff), side.good ? '#64b5f6' : '#ff5252', 30);
      if (side.good) this.cameras.main.flash(120, 30, 110, 220); else this.cameras.main.flash(120, 120, 20, 20);
      Sound.play(side.good ? 'gateGood' : 'gateBad');
      if (!side.good) this.shake(140, 0.006);
      this.tweens.add({ targets: side.obj, alpha: 0, duration: 220 });
      this.tweens.add({ targets: other.obj, alpha: 0.25, duration: 220 });
      this.syncArmy();
    });
  }

  updateCombat(dt) {
    const cd = Stats.attackMs(), dmg = Stats.damage() * this.dmgMod;
    const near = this.enemies.filter(e => e.y > 250 && e.y < H);
    this.soldiers.forEach(s => {
      s.cd -= dt * 1000;
      if (s.cd > 0) return;
      let best = null, bestD = CFG.attackRange;
      near.forEach(e => {
        if (e.hp <= 0) return;
        const d = e === this.boss && this.fight ? (Math.abs(s.x - e.x) < e.prof.reach + 10 ? 0 : Infinity) : Math.hypot(e.x - s.x, e.y - s.y) - e.r;
        if (d < bestD) { bestD = d; best = e; }
      });
      if (!best) return;
      s.cd = cd * (0.9 + Math.random() * 0.2);
      s.lunge = 7; s.swing = 1;
      this.strike(best, dmg + this.lightningBonus(best, dmg), s);
      if (this.thunderBlade && Math.random() < 0.6) this.zap(s.x + 9, s.y - 12, best.x, best.y, 90);   // Futsu-no-mitama's trail
    });
  }

  strike(e, dmg, s) {
    if (e.powering) return;        // mid power-up: nothing can hurt him
    if (e.air) {                   // airborne: the swing finds nothing
      if (Math.random() < 0.4) this.float(e.x + (Math.random() - 0.5) * 70, e.y - 10 - Math.random() * 30, 'MISS', '#cfd8dc', 13);
      return;
    }
    e.hp -= dmg;
    Sound.play('slash');
    const spread = e.r ? e.r * 0.6 : 4;
    const hx = e.x + (Math.random() - 0.5) * spread * 2, hy = e.y + (Math.random() - 0.5) * spread;
    const sl = this.img(hx, hy, 'slash').setDepth(2900).setRotation(Math.atan2(e.y - s.y, e.x - s.x) + (Math.random() - 0.5))
      .setScale(S * (e.r ? 1.1 : 0.75));
    this.tweens.add({ targets: sl, alpha: 0, scaleX: sl.scaleX * 1.5, scaleY: sl.scaleY * 1.5, duration: 140, onComplete: () => sl.destroy() });
    if (!e.prof) {                 // small enemies flash white
      const sp = e.sprite || e.obj;
      sp.setTintFill(0xffffff);
      this.time.delayedCall(55, () => { if (sp.active) sp.clearTint(); });
    } else if (!e.flash) {         // big ones take a short red tint now and then, so the art stays visible
      e.flash = true;
      e.obj.setTint(0xff9a9a);
      this.time.delayedCall(60, () => { if (e.obj.active) e.obj.clearTint(); });
      this.time.delayedCall(260, () => { e.flash = false; });
    }
    if (e.r || Math.random() < 0.5) this.float(hx, hy - 12, fmt(dmg), this.thunderBlade ? '#d9a8ff' : '#ffeb3b', 13);
    if (e.hp <= 0) this.kill(e);
  }

  kill(e) {
    const raw = e.souls || Stats.soulsPerKill();
    const gain = Math.floor(raw) + (Math.random() < raw % 1 ? 1 : 0);      // a half soul pays out every other kill
    this.earned += gain; Save.souls += gain;
    Sound.play('kill');
    this.charge = Math.min(this.specialMax, this.charge + (e.r ? this.specialMax / 4 : 1));
    const tint = { demon: 0xab47bc, zombie: 0x9ccc65, giant: 0x9ccc65, thunder: 0xb388ff, charm: 0xffd54f, tenguBoss: 0xef5350, boss: 0xab47bc }[e.kind];
    this.burst.setParticleTint(tint);
    this.burst.explode(e.r ? 40 : 10, e.x, e.y);
    const orb = this.img(e.x, e.y, 'soul').setDepth(5001).setScale(S * (e.r ? 2 : 1.2));
    this.tweens.add({ targets: orb, x: 22, y: 56, duration: 520, ease: 'Cubic.in', onComplete: () => {
      orb.destroy(); Sound.play('soul');
      this.tweens.add({ targets: this.soulIcon, scale: S * 1.8, duration: 80, yoyo: true });
    } });
    if (e.kind === 'charm') {
      this.dmgMod *= CFG.charmDamageUp;
      this.banner('LUCKY CHARM', 'blade damage +10%'); Sound.play('buy');
      this.shake(180, 0.008);
      Save.save();
    }
    e.obj.destroy(); e.gone = true;
    if (e === this.boss) this.endFight();
  }

  // Demons and zombies run at the nearest samurai, stop in reach, and strike on a timer.
  updateEnemies(wdt) {
    const E = CFG.enemy;
    const pack = this.enemies.filter(e => !e.r && !e.gone && e.y > -20);
    const backRow = this.soldiers.reduce((m, s) => Math.max(m, s.y), 0);
    pack.forEach(e => {
      const k = E[e.kind], run = k.speed * this.L.pace + (this.fight ? E.fightRush : 0);
      // Once past the back row an enemy gives up and keeps running off the bottom.
      if (e.passed || e.y > backRow + 12) { e.passed = true; e.hold = false; e.d -= run * wdt; e.obj.setRotation(0); return; }
      let near = null, L = Infinity;
      this.soldiers.forEach(s => { const d = Math.hypot(s.x - e.x, s.y - e.y); if (d < L) { L = d; near = s; } });
      if (!near) { e.hold = false; return; }
      e.hold = L <= E.reach;
      if (!e.hold) {
        const v = run * wdt / L;
        e.x = clamp(e.x + (near.x - e.x) * v, CFG.pathLeft + 12, CFG.pathRight - 12);
        e.d -= (near.y - e.y) * v;
        e.obj.setRotation(clamp((near.x - e.x) * 0.006, -0.2, 0.2));
        return;
      }
      e.obj.setRotation(0);
      e.strike -= wdt * 1000;
      if (e.strike > 0) return;
      e.strike = k.strikeMs;
      Sound.play('claw');
      this.enemySlash(near.x, near.y, 0.55, e.kind === 'demon' ? 0xea80fc : 0xc5e1a5);
      near.img.setTint(0xff8a80);
      this.time.delayedCall(90, () => { if (near.img.active) near.img.setTint(this.armorTint); });
      this.wound += k.hit;
      if (this.wound >= 1) { this.wound -= 1; this.lose(1, near); }
    });
    // keep the pack from stacking on one spot
    for (let a = 0; a < pack.length; a++) for (let b = a + 1; b < pack.length; b++) {
      const p = pack[a], q = pack[b], dx = p.x - q.x, dy = q.d - p.d, d = Math.hypot(dx, dy);
      if (d >= 13 || d === 0) continue;
      const push = (13 - d) / 2 / d;
      p.x += dx * push; q.x -= dx * push; p.d -= dy * push; q.d += dy * push;
    }
  }

  updateHazards(wdt) {
    // Lucky charms slide from side to side and glow.
    this.enemies.forEach(e => {
      if (e.kind !== 'charm' || e.gone) return;
      e.x += e.vx * wdt;
      if (e.x < 85 || e.x > 315) { e.x = clamp(e.x, 85, 315); e.vx = -e.vx; }
      const pulse = Math.sin(this.time.now * 0.008 + e.seed);
      e.glow.setScale(S * (1.5 + pulse * 0.2)).setAlpha(0.8 + pulse * 0.2);
      e.sprite.setRotation(Math.sin(this.time.now * 0.012 + e.seed) * 0.12);
    });
    // Spikes.
    this.spikes.forEach(o => {
      if (o.hit || o.y < this.formY - 20) return;
      const s = this.soldiers.find(s => Math.abs(s.x - o.x) < 17 && Math.abs(s.y - o.y) < 13);
      if (!s) return;
      o.hit = true;
      o.obj.setTint(0xff8a80); Sound.play('spike');
      this.lose(1, s);
    });
    this.updateBoss(wdt);
  }

  // Boss cycle: shuffle after the army -> wind up (red zone shows where it lands) -> strike -> pause.
  updateBoss(wdt) {
    this.danger.clear();
    this.boltG.clear();
    const b = this.boss;
    if (!b || !this.fight || b.gone) return;
    const B = b.prof;
    if (B.trickle) {                                         // regular enemies keep arriving
      b.trickleT -= wdt * 1000;
      if (b.trickleT <= 0) {
        b.trickleT = B.trickleMs;
        const demon = this.L.demons && Math.random() < CFG.enemy.demonShare;
        this.addEnemy(demon ? 'demon' : 'zombie', 85 + Math.random() * 230, this.dist + CFG.armyY + 10, Math.round(b.trickleHp * (demon ? CFG.enemy.demonHp : 1)));
      }
    }
    if (B.phase2 && !b.phase2 && !b.powering && b.hp <= b.maxHp * B.phase2) {          // second phase: he powers up first
      Object.assign(b, { powering: true, state: 'powerup', t: B.powerUpMs, style: null, air: false, comboLeft: 0 });
      this.hazards = [];
      b.obj.setRotation(0);
      Sound.play('warnPower');
    }
    if (b.state === 'powerup') { this.powerUp(b, wdt); return; }
    const haste = b.phase2 ? B.phase2Haste || 1 : 1;
    this.updateLightning(b, wdt);
    b.t -= wdt * 1000 * haste;
    if (b.state === 'chase') {
      b.obj.setRotation(0);
      const step = B.speed * haste * wdt;
      b.x = clamp(b.x + clamp(this.armyX - b.x, -step, step), 120, 280);
      if (b.t > 0) return;
      const chance = B.powerChance * (b.phase2 ? 1.6 : 1);
      b.power = chance > 0 && b.swings > 0 && !b.power && Math.random() < chance;
      b.comboLeft = b.power ? 0 : ((b.phase2 && B.phase2Combo) || B.combo || 1) - 1;
      this.startWind(b, b.power ? this.pickPower(b) : null);
    } else if (b.state === 'wind') {
      const k = clamp(1 - b.t / b.windFull, 0, 1), style = b.style;
      const reach = style === 'bolt' ? B.boltHalf : style ? B.powerReach : B.reach;
      if (style === 'jump' || style === 'fly') {             // leap toward where the army stood
        const h = Math.sin(k * Math.PI);
        b.x = b.fromX + (b.aimX - b.fromX) * k;
        b.obj.y -= h * (b.air ? 130 : 80);
        b.obj.setScale(b.obj.scaleX * (1 + h * 0.25)).setRotation(b.air ? Math.sin(this.time.now * 0.02) * 0.08 : -0.35 * h);
        if (b.air) this.danger.fillStyle(0x000000, 0.28).fillEllipse(b.x, b.y + 50, 70 - h * 30, 22 - h * 9);   // his shadow
      } else b.obj.setRotation((style === 'dash' ? 0.3 : -0.25) * k);
      if (style === 'bolt') {                                // a lane of lightning, from him to the bottom of the screen
        this.danger.fillStyle(0xb388ff, 0.14 + 0.3 * k).fillRect(b.aimX - reach, b.y + 30, reach * 2, H);
        this.danger.lineStyle(2, 0xede7f6, 0.4 + 0.6 * k).strokeRect(b.aimX - reach, b.y + 30, reach * 2, H);
        if (Math.random() < 0.3) this.zap(b.aimX + (Math.random() - 0.5) * reach, b.y + 40 + Math.random() * 300, b.aimX + (Math.random() - 0.5) * reach, b.y + 120 + Math.random() * 300, 90);
      } else {
        this.danger.fillStyle(style === 'dash' ? 0x7c4dff : style ? 0xff6d00 : 0xff1744, 0.16 + 0.24 * k).fillEllipse(b.aimX, b.y + 118, reach * 2, 124);
        this.danger.lineStyle(2, 0xff8a80, 0.5 + 0.5 * k).strokeEllipse(b.aimX, b.y + 118, reach * 2, 124);
        if (style === 'dash') this.danger.lineStyle(4, 0xb388ff, 0.3 + 0.6 * k).lineBetween(b.x, b.y + 50, b.aimX, b.y + 110);
      }
      if (b.t > 0) return;
      if (style === 'dash') this.zap(b.x, b.y + 40, b.aimX, b.y + 40, 220);
      if (style !== 'bolt') b.x = b.aimX;
      b.air = false;
      b.obj.setRotation(0);
      if (style === 'bolt') {
        for (let i = 0; i < 4; i++) this.zap(b.aimX + (Math.random() - 0.5) * 30, b.y - 60, b.aimX + (Math.random() - 0.5) * reach * 1.6, H, 260);
        this.cameras.main.flash(120, 200, 170, 255);
      } else this.enemySlash(b.x, b.y + 75, style ? 4.4 : 3.2, B.linger ? 0xd1c4e9 : style ? 0xffab91 : 0xffffff);
      Sound.play(style ? 'slam' : 'swing');
      this.shake(style ? 320 : 200, style ? 0.03 : 0.012);
      if (style && style !== 'bolt') { this.burst.setParticleTint(B.linger ? 0xb388ff : 0xffab91); this.burst.explode(36, b.x, b.y + 95); }
      if (Math.abs(this.armyX - b.aimX) < reach) {
        this.lose(Math.max(B.cleave, Math.ceil(this.count * B.cleaveShare)) * (style ? B.powerMult : 1), null, !!B.linger && (!!style || b.phase2));
      } else { Sound.play('dodge'); this.float(this.armyX, this.formY - 46, 'DODGED', '#80d8ff', 18); }
      if (b.phase2 && B.linger && style !== 'bolt') this.hazards.push({ x: b.aimX, y: b.y + 118, rx: reach, ry: 62, t: B.linger, tick: B.lingerTick });
      b.swings++;
      if (!style && b.comboLeft > 0) {                       // next swing of the combo: a step toward the army, a shorter wind-up
        b.comboLeft--;
        b.x = clamp(b.x + clamp(this.armyX - b.x, -B.comboStep, B.comboStep), 120, 280);
        this.startWind(b, null, B.comboWindMs);
        return;
      }
      b.state = 'recover';
      b.t = B.recoverMs;
    } else if (b.t <= 0) { b.state = 'chase'; b.t = B.chaseMs; }
  }

  // The cutscene between phases: the arena darkens, lightning pours into him, he rises, heals a little and cannot be hurt.
  powerUp(b, wdt) {
    const B = b.prof, ms = wdt * 1000;
    b.t -= ms;
    const k = clamp(1 - b.t / B.powerUpMs, 0, 1);
    b.hp = Math.min(b.maxHp, b.hp + b.maxHp * B.powerUpHeal * ms / B.powerUpMs);
    this.shade.setAlpha(0.6 * Math.min(1, k * 5));
    b.obj.y -= k * 28;
    b.obj.setScale(b.obj.scaleX * (1 + 0.22 * k)).setTint(k > 0.25 ? 0xd9c2ff : 0xffffff);
    if (Math.random() < 0.25 + k * 0.6) this.zap(b.x + (Math.random() - 0.5) * 320, -10, b.x + (Math.random() - 0.5) * 40, b.obj.y - 20, 200);
    if (Math.random() < 0.6) { const a = Math.random() * 6.28, r = 40 + k * 40; this.zap(b.x + Math.cos(a) * r, b.obj.y + Math.sin(a) * r, b.x + Math.cos(a + 1.2) * r, b.obj.y + Math.sin(a + 1.2) * r, 120); }
    this.shake(120, 0.004 + 0.02 * k);
    this.updateLightning(b, wdt);
    if (b.t > 0) return;
    Object.assign(b, { powering: false, phase2: true, state: 'chase', t: B.chaseMs });
    b.obj.clearTint();
    this.tweens.add({ targets: this.shade, alpha: 0, duration: 500 });
    if (this.stormDark) this.tweens.add({ targets: this.stormDark, alpha: 0.5, duration: 500 });      // the storm closes in for phase 2
    for (let i = 0; i < 8; i++) this.zap(b.x, b.y, b.x + Math.cos(i * 0.785) * 190, b.y + Math.sin(i * 0.785) * 190, 320);
    this.burst.setParticleTint(0xb388ff); this.burst.explode(50, b.x, b.y);
    this.banner(B.phase2Name, '');
    Sound.play('gong'); Sound.play('slam');
    this.cameras.main.flash(350, 200, 170, 255);
    this.shake(450, 0.03);
  }

  // Begins a wind-up. `style` is null for a plain swing, or the kind of power attack.
  startWind(b, style, ms) {
    const B = b.prof;
    b.style = style;
    b.state = 'wind';
    b.t = b.windFull = ms || (style ? (B.powerWind && B.powerWind[style]) || B.powerWindMs : B.windMs);
    b.fromX = b.x;
    b.aimX = style ? clamp(this.armyX, 100, 300) : b.x;
    b.air = style === 'fly';                                 // in the air he cannot be hit
    Sound.play(style ? 'warnPower' : 'warn');
  }

  pickPower(b) {
    const B = b.prof;
    if (!B.powers) return B.powerStyle;
    const list = B.powers[b.phase2 ? 1 : 0];
    return list[Math.floor(Math.random() * list.length)];
  }

  // The storm stage: lightning flickers in the sky, and on the run to the boss a wave of it sweeps down a marked lane.
  updateStorm(wdt) {
    const ms = wdt * 1000, C = CFG.storm;
    this.skyT -= ms;
    if (this.skyT <= 0) {                                    // distant lightning
      this.skyT = 1800 + Math.random() * 3200;
      this.skyFlash.setAlpha(0.35);
      this.tweens.add({ targets: this.skyFlash, alpha: 0, duration: 260 });
      const x = Math.random() * W;
      this.zap(x, -10, x + (Math.random() - 0.5) * 160, 120 + Math.random() * 120, 240);
      Sound.play('thunder');
    }
    const w = this.wave;
    if (!w) {
      if (this.fight || this.finaleDone) return;             // the waves stop once the boss fight begins
      this.stormT -= ms;
      if (this.stormT > 0) return;
      this.stormT = C.everyMs[0] + Math.random() * (C.everyMs[1] - C.everyMs[0]);
      this.wave = { x: clamp(this.armyX, CFG.steerMin + 20, CFG.steerMax - 20), t: C.warnMs, y: null, done: false };
      Sound.play('warn');
      return;
    }
    w.t -= ms;
    if (w.y === null) {                                      // warning: red lines mark the lane
      const k = clamp(1 - w.t / C.warnMs, 0, 1), blink = 0.55 + 0.45 * Math.sin(this.time.now * 0.03);
      this.danger.fillStyle(0xff1744, 0.08 + 0.14 * k).fillRect(w.x - C.half, 0, C.half * 2, H);
      this.danger.lineStyle(3, 0xff1744, (0.5 + 0.5 * k) * blink).lineBetween(w.x - C.half, 0, w.x - C.half, H).lineBetween(w.x + C.half, 0, w.x + C.half, H);
      if (w.t > 0) return;
      w.y = -40; w.t = C.sweepMs;
      Sound.play('slam'); Sound.play('thunder');
      this.skyFlash.setAlpha(0.5); this.tweens.add({ targets: this.skyFlash, alpha: 0, duration: 300 });
      return;
    }
    w.y = -40 + (H + 80) * clamp(1 - w.t / C.sweepMs, 0, 1); // the wave itself, sweeping top to bottom
    this.waveImg.setVisible(true).setPosition(w.x, w.y).setRotation(Math.PI / 2).setScale(S * 3, S * 2.9);
    this.zap(w.x - C.half, w.y - 30, w.x + C.half, w.y - 30, 140);
    if (Math.random() < 0.6) this.zap(w.x + (Math.random() - 0.5) * C.half * 2, w.y - 120, w.x + (Math.random() - 0.5) * C.half * 2, w.y, 160);
    if (!w.done && w.y >= this.formY) {
      w.done = true;
      this.shake(220, 0.016);
      if (Math.abs(this.armyX - w.x) < C.half + 14) this.lose(Math.max(C.cleave, Math.ceil(this.count * C.cleaveShare)), null, true);
      else { Sound.play('dodge'); this.float(this.armyX, this.formY - 46, 'DODGED', '#80d8ff', 18); }
    }
    if (w.t <= 0) { this.wave = null; this.waveImg.setVisible(false); }
  }

  // A jagged streak of lightning that fades over `life` ms.
  zap(x1, y1, x2, y2, life = 160) {
    const pts = [[x1, y1]], n = Math.max(3, Math.round(Math.hypot(x2 - x1, y2 - y1) / 28));
    for (let i = 1; i < n; i++) {
      const t = i / n;
      pts.push([x1 + (x2 - x1) * t + (Math.random() - 0.5) * 26, y1 + (y2 - y1) * t + (Math.random() - 0.5) * 14]);
    }
    pts.push([x2, y2]);
    this.bolts.push({ pts, t: life, life });
  }

  // Draws lightning, the storm around a second-phase boss, and the lightning left on the ground.
  updateLightning(b, wdt) {
    const ms = wdt * 1000;
    if (b.phase2 && Math.random() < 0.5) {                   // storm crackling around him
      const a = Math.random() * 6.28, r = 46 + Math.random() * 16;
      this.zap(b.x + Math.cos(a) * r, b.obj.y + Math.sin(a) * r, b.x + Math.cos(a + 1) * r, b.obj.y + Math.sin(a + 1) * r, 110);
    }
    this.hazards = this.hazards.filter(h => (h.t -= ms) > 0);
    this.hazards.forEach(h => {
      this.danger.fillStyle(0x7c4dff, 0.22 + Math.random() * 0.12).fillEllipse(h.x, h.y, h.rx * 2, h.ry * 2);
      this.danger.lineStyle(2, 0xede7f6, 0.7).strokeEllipse(h.x, h.y, h.rx * 2, h.ry * 2);
      if (Math.random() < 0.35) this.zap(h.x + (Math.random() - 0.5) * h.rx * 1.6, h.y + (Math.random() - 0.5) * h.ry, h.x + (Math.random() - 0.5) * h.rx * 1.6, h.y + (Math.random() - 0.5) * h.ry, 100);
      h.tick -= ms;
      if (h.tick <= 0 && Math.abs(this.armyX - h.x) < h.rx) {
        h.tick = b.prof.lingerTick;
        this.lose(Math.max(1, Math.ceil(this.count * b.prof.lingerShare)), null, true);
      }
    });
  }

  drawBolts(wdt) {
    const g = this.boltG, ms = wdt * 1000;
    this.bolts = this.bolts.filter(z => (z.t -= ms) > 0);
    this.bolts.forEach(z => {
      const a = z.t / z.life;
      [[5, 0x7c4dff, a * 0.6], [2, 0xffffff, a]].forEach(([w, col, al]) => {
        g.lineStyle(w, col, al).beginPath().moveTo(z.pts[0][0], z.pts[0][1]);
        for (let i = 1; i < z.pts.length; i++) g.lineTo(z.pts[i][0], z.pts[i][1]);
        g.strokePath();
      });
    });
  }

  /* ---------- army bookkeeping ---------- */
  syncArmy(instant) {
    const want = Math.min(this.count, CFG.maxDrawn);
    while (this.soldiers.length < want) {
      this.soldiers.push({ x: this.armyX + (Math.random() - 0.5) * 30, y: this.formY + 20 + Math.random() * 30,
        cd: Math.random() * 200, lunge: 0, swing: 0, pop: instant ? 1 : 0,
        img: this.img(0, -200, 'samurai').setTint(this.armorTint), blade: this.sword(0, -200).setTint(this.bladeTint) });
    }
    while (this.soldiers.length > want) this.dropSoldier(this.soldiers[this.soldiers.length - 1]);
  }

  dropSoldier(s) {
    const i = this.soldiers.indexOf(s);
    if (i < 0) return;
    this.soldiers.splice(i, 1);
    this.burst.setParticleTint(0x5c6bc0);
    this.burst.explode(8, s.x, s.y);
    s.img.destroy(); s.blade.destroy();
  }

  // `lightning` losses are halved by the Thunder Armor.
  lose(n, victim, lightning) {
    if (lightning && this.thunderArmor) n = Math.ceil(n / 2);
    if (this.count <= 0) return;
    this.count = Math.max(0, this.count - n);
    Sound.play('lose');
    const at = victim || this.soldiers[0] || { x: this.armyX, y: this.formY };
    this.float(at.x, at.y - 16, '−' + n, '#ff5252', n > 1 ? 26 : 20);
    if (victim && this.count < CFG.maxDrawn) this.dropSoldier(victim);
    this.syncArmy();
  }

  /* ---------- special ---------- */
  activateSpecial() {
    if (!this.started || this.over || this.slowLeft > 0 || this.charge < this.specialMax) return;
    this.charge = 0;
    this.slowLeft = CFG.slowMs;
    Sound.play('special');
    this.cameras.main.flash(180, 150, 110, 255);
    this.banner('SLOW MOTION', '');
  }

  /* ---------- boss ---------- */
  startFight() {
    const P = this.boss.prof;
    this.fight = true;
    Music.set(this.L.storm ? 'stormBoss' : 'boss'); Sound.play('gong');
    if (!P.trickle) {                                        // final bosses fight alone
      const keep = this.bosses.filter(b => !b.gone);
      [...this.spikes, ...this.enemies.filter(e => !keep.includes(e))].forEach(o => { o.obj.destroy(); o.gone = true; });
      this.gates.forEach(g => { g.left.obj.destroy(); g.right.obj.destroy(); g.gone = true; });
      this.spikes = []; this.gates = []; this.enemies = keep;
    }
    if (this.bars) this.bars.forEach(o => o.destroy());
    this.bars = [this.add.rectangle(W / 2, -30, W, 60, 0x000000).setDepth(4500), this.add.rectangle(W / 2, H + 30, W, 60, 0x000000).setDepth(4500)];
    this.tweens.add({ targets: this.bars[0], y: 30, duration: 400, ease: 'Cubic.out' });
    this.tweens.add({ targets: this.bars[1], y: H - 30, duration: 400, ease: 'Cubic.out' });
    this.bossName = this.txt(W / 2, 88, P.name, 17, '#fff', { stroke: '#2a0038', strokeThickness: 4 }).setDepth(5001);
    this.bossGhost = 1;
    this.shake(300, 0.008);
  }

  // Called when the current big fight is won; the run resumes toward the next one, if any.
  endFight() {
    const P = this.boss.prof;
    this.fight = false;
    this.bolts = []; this.hazards = []; this.shade.setAlpha(0);
    this.boss = this.bosses.find(b => !b.gone) || null;
    this.finaleDone = !this.boss;
    Music.set(this.L.storm ? 'storm' : 'run'); Sound.play('gong');
    if (this.finaleDone) {                                   // nothing is left to fight on the way to the finish
      this.speedMod *= CFG.bossSlow;
      [...this.enemies, ...this.spikes].forEach(o => { if (!o.gone) { o.obj.destroy(); o.gone = true; } });
      this.enemies = []; this.spikes = [];
    }
    this.bossName.destroy();
    this.tweens.add({ targets: this.bars[0], y: -30, duration: 300 });
    this.tweens.add({ targets: this.bars[1], y: H + 30, duration: 300 });
    this.shake(350, 0.014);
    this.cameras.main.flash(250, 255, 240, 200);
    this.banner(P.slain, '+' + P.souls + ' souls');
    Save.save();
  }

  /* ---------- fx ---------- */
  shake(ms, amount) { if (Save.shake && CFG.shake > 0) this.cameras.main.shake(ms, amount * CFG.shake); }

  enemySlash(x, y, scale, tint) {
    const sl = this.img(x, y, 'slash').setDepth(2950).setRotation(Math.PI / 2 - 0.8).setScale(S * scale).setTint(tint);
    this.tweens.add({ targets: sl, rotation: Math.PI / 2 + 0.8, alpha: 0, duration: 200, onComplete: () => sl.destroy() });
  }

  float(x, y, str, color, size) {
    const t = this.txt(x, y, str, size, color, { stroke: '#000', strokeThickness: 3 }).setDepth(4000);
    this.tweens.add({ targets: t, y: y - 30, alpha: 0, duration: 550, ease: 'Cubic.out', onComplete: () => t.destroy() });
  }

  banner(title, sub) {
    const t = this.txt(W / 2, 250, title, 30, '#ffd54f', { stroke: '#2a0a14', strokeThickness: 6 }).setDepth(5200).setScale(0.4);
    const s = this.txt(W / 2, 282, sub, 14, '#fff', { stroke: '#2a0a14', strokeThickness: 4 }).setDepth(5200).setAlpha(0);
    this.tweens.add({ targets: t, scale: 1, duration: 220, ease: 'Back.out' });
    this.tweens.add({ targets: s, alpha: 1, duration: 220 });
    this.tweens.add({ targets: [t, s], alpha: 0, delay: 1300, duration: 400, onComplete: () => { t.destroy(); s.destroy(); } });
  }

  /* ---------- hud ---------- */
  updateHud(dt) {
    const g = this.hud; g.clear();
    // progress
    const px = 70, pw = 260, p = clamp(this.dist / this.L.length, 0, 1);
    g.fillStyle(0x000000, 0.5).fillRoundedRect(px - 3, 21, pw + 6, 16, 8);
    if (p > 0.004) g.fillStyle(0xff7043, 1).fillRoundedRect(px, 24, pw * p, 10, Math.min(5, pw * p / 2));
    this.L.bosses.forEach(b => g.fillStyle(0xab47bc, 1).fillCircle(px + pw * (b.at - 230) / this.L.length, 29, 6));       // big-fight markers
    g.fillStyle(0xffffff, 1).fillCircle(px + pw * p, 29, 4);
    // boss bar
    if (this.fight) {
      const r = clamp(this.boss.hp / this.boss.maxHp, 0, 1), bw = 240, bx = W / 2 - bw / 2;
      this.bossGhost += (r - this.bossGhost) * damp(4, dt);
      g.fillStyle(0x000000, 0.7).fillRoundedRect(bx - 3, 101, bw + 6, 18, 6);
      g.fillStyle(0xffffff, 0.8).fillRect(bx, 104, bw * this.bossGhost, 12);
      g.fillStyle(0xe53935, 1).fillRect(bx, 104, bw * r, 12);
    }
    this.soulText.setText(Save.souls + (this.earned ? '  +' + this.earned : ''));
    this.countText.setText(this.count).setPosition(this.armyX, this.formY - 30);
    if (!this.started) return;                             // the upgrade cards cover the bottom until the run begins
    // special bar + button
    const slowing = this.slowLeft > 0;
    const fill = slowing ? this.slowLeft / CFG.slowMs : this.charge / this.specialMax;
    const ready = !slowing && this.charge >= this.specialMax;
    g.fillStyle(0x000000, 0.5).fillRoundedRect(27, 673, 206, 16, 8);
    if (fill > 0.005) g.fillStyle(slowing ? 0xb388ff : 0x7c4dff, 1).fillRoundedRect(30, 676, 200 * fill, 10, Math.min(5, 100 * fill));
    const pulse = ready ? 1 + Math.sin(this.time.now * 0.008) * 0.07 : 1;
    g.fillStyle(0x000000, 0.4).fillCircle(336, 679, 33 * pulse);
    g.fillStyle(ready ? 0x7c4dff : slowing ? 0x311b92 : 0x3a3050, 1).fillCircle(336, 676, 32 * pulse);
    g.lineStyle(3, ready ? 0xffffff : 0x8c80a8, ready ? 1 : 0.5).strokeCircle(336, 676, 32 * pulse);
    this.specialText.setText(slowing ? (this.slowLeft / 1000).toFixed(1) : 'SLOW').setAlpha(ready || slowing ? 1 : 0.45);
    this.specialHint.setText(ready ? 'SPECIAL READY' : slowing ? 'SLOW MOTION' : 'SPECIAL');

  }

  /* ---------- end ---------- */
  finish(win) {
    this.over = true;
    const unlocked = win && this.levelNo === Save.level;
    if (unlocked) Save.level++;
    const gearWon = unlocked && this.levelNo > SAGA_LEVELS;   // first win over the saga boss: his armor and sword, equipped
    if (gearWon) Save.armor = Save.weapon = 'thunder';
    Save.save();
    Music.set('off'); Sound.play(win ? 'win' : 'defeat');
    this.countText.setVisible(false);
    const D = 6000;
    const shade = this.add.rectangle(W / 2, H / 2, W, H, 0x0a0610, 1).setAlpha(0).setDepth(D);
    this.tweens.add({ targets: shade, alpha: 0.78, duration: 350 });
    const title = this.txt(W / 2, 280, win ? this.stageName + (this.levelNo > SAGA_LEVELS ? ' SLAIN' : ' CLEARED') : 'CLAN WIPED', 38, win ? '#ffd54f' : '#ff5252', { stroke: '#000', strokeThickness: 6 }).setDepth(D + 1).setScale(0.3);
    this.tweens.add({ targets: title, scale: 1, duration: 350, ease: 'Back.out' });
    this.img(W / 2 - 62, 346, 'soul').setScale(S * 1.6).setDepth(D + 1);
    this.txt(W / 2 + 6, 346, '+' + this.earned + ' souls', 24, '#e1bee7').setDepth(D + 1);
    if (unlocked) this.txt(W / 2, 390, this.levelNo < SAGA_LEVELS ? 'LEVEL ' + (this.levelNo + 1) + ' UNLOCKED' : this.levelNo === SAGA_LEVELS ? 'SAGA BOSS UNLOCKED' : 'SAGA CLEARED', 16, '#fff59d').setDepth(D + 1);
    if (gearWon) this.txt(W / 2, 418, 'WON: THUNDER ARMOR  ·  FUTSU-NO-MITAMA', 13, '#d1c4e9').setDepth(D + 1);
    const tap = this.txt(W / 2, 452, 'tap to continue', 16, '#bbb', { fontStyle: 'normal' }).setDepth(D + 1).setAlpha(0);
    this.time.delayedCall(700, () => {
      this.tweens.add({ targets: tap, alpha: 1, duration: 500, yoyo: true, repeat: -1 });
      this.input.once('pointerdown', () => {
        if (win && this.levelNo >= SAGA_LEVELS) this.scene.start('Sagas');             // level 3 or the saga boss beaten: back to the map
        else this.scene.start('Game', { level: this.levelNo + (win ? 1 : 0) });         // on to the next level, or retry this one
      });
    });
  }
}

/* ============================================================
   BOOT
   ============================================================ */
window.samuraiGame = new Phaser.Game({
  type: Phaser.AUTO,
  parent: 'game',
  width: W * R,
  height: H * R,
  backgroundColor: '#120c14',
  scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
  scene: [BootScene, MenuScene, SagaScene, SettingsScene, GameScene],
});
</script>
