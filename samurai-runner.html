// Levels are generated from a short spec so every one gets steadily harder as it goes.

// What each kind of enemy is made of, for weapons that favour or struggle against certain foes.
// Kinds not listed are neutral. Future enemies (water, metal, earth, fire...) get their entry here.
const ELEMENT = { tenguBoss: 'flying', thunder: 'metal' };      // 'metal' means armoured
const SAGA_LEVELS = 3;                                        // ordinary levels per saga; the stage after them is the saga boss
const GOOD_GATES = ['+3', '+3', 'x2', '+4', '+5', '+6', 'x2', '+8', '+10', '+12', '+14', '+16', '+18', '+20', '+22', '+25', '+28', '+30'];
// Turns a spec into positions measured in distance along the path (px).
function layoutLevel(spec, index) {
  const L = { name: spec.name, demons: spec.demons, charms: spec.charms || [[], 0, 0], walls: spec.walls || [[], 0, 0], gates: [], packs: [], spikes: [], bosses: [] };
  L.theme = spec.theme || ''; L.foe = spec.foe || 'zombie'; L.mix = spec.mix || null;
  L.storm = !!spec.storm;                                    // dark sky, broken ground and lightning waves
  L.pace = spec.pace || 1 + CFG.levelPace * (index % (SAGA_LEVELS + 1));                 // level 1, 2, 3 of each saga
  // Weapon rows (see CFG.weapon): about a third and two thirds of the way in, never in the saga boss stage,
  // and moved along a row if that row already has a lucky charm or stone wall, or a big fight right after it.
  L.weapons = []; L.logs = [];
  L.saga = Math.floor(index / (SAGA_LEVELS + 1));
  if (!spec.storm && spec.rows >= 6 && index > 0) {              // not in the very first level (owner)
    const busy = i => (spec.charms && spec.charms[0].includes(i)) || (spec.walls && spec.walls[0].includes(i)) || spec.bosses.some(b => b.after === i) || L.weapons.includes(i);
    // Spread evenly and kept out of the crowded last quarter (owner). A busy row moves one back, else one or two on.
    const pick = (f, list) => { const r = Math.round(spec.rows * f), i = [r, r - 1, r + 1, r + 2].find(i => i > 0 && i < spec.rows - 2 && !busy(i) && !L.logs.includes(i)); if (i) list.push(i); };
    // Log rows put one or two obstacles in front of the blue gate. Saga 1 has one a level, later sagas two (owner: not too many early).
    if (L.saga === 0) { pick(0.3, L.weapons); pick(0.5, L.logs); pick(0.7, L.weapons); }
    else { pick(0.2, L.logs); pick(0.38, L.weapons); pick(0.58, L.logs); pick(0.8, L.weapons); }
    if (L.weapons.length > 1) L.split = L.weapons.pop();       // the later weapon row becomes the split path (CFG.split)
  }
  let d = 300;
  const hp = spec.hp;
  for (let i = 0; i < spec.rows; i++) {
    const good = GOOD_GATES[i];
    if (i === L.split) {                                     // no gates here: the road divides, and this row's pack keeps to one side
      L.gates.push({ d, split: true });
      L.packs.push({ d: d + 110, n: Math.round(CFG.split.pack * (spec.pack[0] + spec.pack[1] * i + spec.pack[2] * i * i)), gap: 14 / (1 + spec.crowd * i) / CFG.split.pack, hp, split: true });   // a smaller pack: there is no gate to make up the losses
      L.splitAt = d;
      d += spec.seg + CFG.split.extra;
      continue;
    }
    L.gates.push({ d, bad: { op: '-', n: Math.round(2 + i * 1.5) }, good: { op: good[0], n: +good.slice(1) } });
    // The first pack hangs back so a lone samurai gets through the first gate before anything reaches it.
    L.packs.push({ d: d + (i ? 150 : 420), n: Math.round(spec.pack[0] + spec.pack[1] * i + spec.pack[2] * i * i), gap: 14 / (1 + spec.crowd * i), hp });
    if (i % 2 === 1 || i > spec.rows * 0.6) L.spikes.push(d + spec.seg / 2);      // midway between gate rows; more of them late on
    d += spec.seg;
    const mid = spec.bosses.find(b => b.after === i);
    if (mid) { L.bosses.push({ type: mid.type, hp: mid.hp, at: d + 200, trickleHp: hp }); d += 630; }   // gap keeps gates off screen during the fight
  }
  const end = spec.bosses.find(b => b.after === 'end');
  if (end) { L.bosses.push({ type: end.type, hp: end.hp, at: d + 200, trickleHp: hp }); d += 200; }
  L.length = d + 100;
  return L;
}

const Save = {

  load() {
    const num = (k, def) => {
      try { const v = parseInt(localStorage.getItem(k), 10); return Number.isFinite(v) ? v : def; }

      localStorage.setItem('samurai_souls', this.souls);

};

    'None found yet.': ['Aún no has encontrado ninguno.', 'Aucun trouvé pour l’instant.', 'Nessuna trovata finora.', 'Пока не найдено.'],
    "Armor forged in the image of Takemikazuchi's own war gear. It does not fully stop lightning, but it turns the worst of it aside, the same way he endured the storms he commanded. Those who wear it carry a trace of the force that once pinned the earthquake catfish and forced the land to yield. It is heavy with the memory of conquest, not protection freely given.": [
      'Armadura forjada a imagen del equipo de guerra de Takemikazuchi. No detiene del todo el rayo, pero desvía lo peor, igual que él resistía las tormentas que dominaba. Quien la viste lleva un rastro de la fuerza que una vez inmovilizó al pez gato de los terremotos y obligó a la tierra a ceder. Pesa con el recuerdo de la conquista, no de una protección dada de buena gana.',
      'Armure forgée à l’image de l’équipement de guerre de Takemikazuchi. Elle n’arrête pas tout à fait la foudre, mais en détourne le pire, comme il endurait les tempêtes qu’il commandait. Qui la porte garde une trace de la force qui cloua jadis le poisson-chat des séismes et fit plier la terre. Elle pèse du souvenir de la conquête, non d’une protection offerte de bon cœur.',
      'Armatura forgiata a immagine dell’equipaggiamento da guerra di Takemikazuchi. Non ferma del tutto il fulmine, ma ne devia il peggio, come lui sopportava le tempeste che comandava. Chi la indossa porta una traccia della forza che un tempo inchiodò il pesce gatto dei terremoti e costrinse la terra a cedere. È carica del ricordo della conquista, non di una protezione data di buon grado.',
      'Доспех, выкованный по образу боевого облачения Такэмикадзути. Он не останавливает молнию полностью, но отводит её худшую часть — так же, как бог выдерживал бури, которыми повелевал. Тот, кто носит его, хранит след силы, что однажды пригвоздила сома землетрясений и заставила землю покориться. Он тяжёл памятью о завоевании, а не о защите, данной по доброй воле.'],
    "A sword once carried by Takemikazuchi. In the old stories, when the first emperor's forces were stalled, Takemikazuchi did not descend himself. Instead he sent this blade down from the heavens so the campaign could continue. It is said the sword carries a fragment of his thunder, striking with the same force he used when he crushed those who opposed the heavenly order. Those who wield it now do so with his reluctant respect, not his blessing.": [
      'Una espada que una vez llevó Takemikazuchi. En las viejas historias, cuando las tropas del primer emperador se detuvieron, Takemikazuchi no descendió él mismo: envió esta hoja desde los cielos para que la campaña siguiera. Se dice que guarda un fragmento de su trueno y golpea con la misma fuerza con que aplastó a quienes se oponían al orden celestial. Quien la empuña hoy lo hace con su respeto a regañadientes, no con su bendición.',
      'Une épée jadis portée par Takemikazuchi. Dans les vieux récits, quand les troupes du premier empereur étaient bloquées, Takemikazuchi ne descendit pas lui-même : il envoya cette lame du ciel pour que la campagne continue. On dit qu’elle porte un fragment de son tonnerre et frappe avec la force qui écrasa ceux qui s’opposaient à l’ordre céleste. Qui la manie aujourd’hui le fait avec son respect réticent, non sa bénédiction.',
      'Una spada un tempo portata da Takemikazuchi. Nelle antiche storie, quando le truppe del primo imperatore si fermarono, Takemikazuchi non scese di persona: mandò questa lama dal cielo perché la campagna continuasse. Si dice che porti un frammento del suo tuono e colpisca con la stessa forza con cui schiacciò chi si opponeva all’ordine celeste. Chi la impugna oggi lo fa con il suo rispetto riluttante, non con la sua benedizione.',
      'Меч, некогда принадлежавший Такэмикадзути. В древних сказаниях, когда войско первого императора застряло, Такэмикадзути не спустился сам, а послал этот клинок с небес, чтобы поход продолжился. Говорят, в мече живёт частица его грома, и бьёт он с той же силой, с какой бог сокрушал противников небесного порядка. Кто владеет им сейчас, владеет с его неохотным уважением, а не с благословением.'],

  idx: { es: 0, fr: 1, it: 2, ru: 3 },
  // Starts in the phone's language when it is one of ours, English otherwise.
  detect() {
    const list = (navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || 'en']);
    for (const l of list) { const c = String(l).slice(0, 2).toLowerCase(); if (LANGS.some(L => L[0] === c)) return c; }
    return 'en';
  },
  set(lang) {
    this.lang = LANGS.some(L => L[0] === lang) ? lang : 'en';
    this.cache = new Map();
    const i = this.idx[this.lang];
    this.exact = new Map(); this.upper = new Map(); this.pats = [];
    if (i === undefined) return;
    for (const [en, tr] of Object.entries(this.T)) {
      const to = tr[i];
      if (!en.includes('{')) { this.exact.set(en, to); if (!this.upper.has(en.toUpperCase())) this.upper.set(en.toUpperCase(), to.toUpperCase()); continue; }
      const re = new RegExp('^' + en.replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/\\\{(\d)\\\}/g, '(.+?)') + '$');
      const order = (en.match(/\{\d\}/g) || []).map(m => +m[1]);
      this.pats.push({ re, to, order, wrap: !/[A-Za-z]/.test(en), weight: en.replace(/\{\d\}/g, '').length });
    }
    this.pats.sort((a, b) => b.weight - a.weight);
    try { document.documentElement.lang = this.lang; } catch (e) {}
  },
  tr(s) {
    if (this.lang === 'en' || typeof s !== 'string' || !/[A-Za-z]/.test(s)) return s;
    let r = this.cache.get(s);
    if (r === undefined) {
      r = this.look(s);
      if (this.cache.size > 4000) this.cache.clear();
      this.cache.set(s, r);
    }
    return r;
  },
  look(s) {
    if (!/[A-Za-z]/.test(s)) return s;
    let r = this.exact.get(s);
    if (r !== undefined) return r;
    if (s === s.toUpperCase() && (r = this.upper.get(s)) !== undefined) return r;
    if (s.includes('\n')) return s.split('\n').map(l => this.look(l)).join('\n');
    for (const p of this.pats) {
      const m = s.match(p.re);
      if (!m) continue;
      const parts = p.order.map((n, k) => [n, this.look(m[k + 1])]);
      if (p.wrap && parts.every(([n, v], k) => v === m[k + 1])) continue;      // '{0}!' only when the inside was translated
      let out = p.to;
      for (const [n, v] of parts) out = out.replace('{' + n + '}', v);
      return out;
    }
    for (const sep of ['  ·  ', ' · ']) if (s.includes(sep)) return s.split(sep).map(l => this.look(l)).join(sep);
    const t = s.match(/^(.*[A-Za-z].*?) (\d[\d.]*s?)$/);                       // 'RAPID FIRE 3s', 'GATE 900'
    if (t) return this.look(t[1]) + ' ' + t[2];
    return s;
  },
};

// Every Phaser text goes through here: translate, then shrink to fit if it was given a width (`_fit`, see BaseScene.txt).
(() => {
  const P = Phaser.GameObjects.Text.prototype, setText = P.setText;
  P.setText = function (v) {
    if (typeof v === 'string') v = I18N.tr(v);
    const changed = v !== this._text;
    setText.call(this, v);
    if (changed && this._fit) fitText(this);
    return this;
  };
})();
function fitText(t) {
  const base = t._fitSize;
  if (parseFloat(t.style.fontSize) !== base) t.setFontSize(base + 'px');
  if (t.width > t._fit) t.setFontSize(Math.max(6, Math.floor(base * t._fit / t.width * 10) / 10) + 'px');
}

const Sound = {
  ctx: null, last: {},
  muted: (() => { try { return localStorage.getItem('samurai_muted') === '1'; } catch (e) { return false; } })(),
  // Browsers only allow audio after a touch, so this runs on the first one.
  unlock() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    const c = this.ctx = new AC();
    this.master = c.createGain(); this.master.gain.value = this.muted ? 0 : 1; this.master.connect(c.destination);
    this.sfx = c.createGain(); this.sfx.connect(this.master);
    this.mus = c.createGain(); this.mus.connect(this.master);
    this.applyOptions();
    this.noiseBuf = c.createBuffer(1, c.sampleRate, c.sampleRate);
    const d = this.noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    setInterval(() => Music.tick(), 50);
  },
  applyOptions() {                 // music / effects switches from Settings
    if (!this.ctx) return;
    this.sfx.gain.value = Save.sfx ? 0.5 : 0;
    this.mus.gain.value = Save.music ? 0.32 : 0;
  },
  setMuted(m) {
    this.muted = m;
    try { localStorage.setItem('samurai_muted', m ? '1' : '0'); } catch (e) {}
    if (this.ctx) this.master.gain.value = m ? 0 : 1;
  },
  env(g, t, vol, dur, attack) {
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + (attack || 0.005));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  },
  // One oscillator with a pitch slide and a fade-out.
  tone(o) {
    const c = this.ctx, t = o.at || c.currentTime, osc = c.createOscillator(), g = c.createGain();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(o.f, t);
    if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t + o.dur);
    this.env(g, t, o.vol, o.dur, o.attack);
    osc.connect(g); g.connect(o.out || this.sfx);
    osc.start(t); osc.stop(t + o.dur + 0.03);
  },
  // A burst of filtered noise.
  noise(o) {
    const c = this.ctx, t = o.at || c.currentTime, src = c.createBufferSource(), f = c.createBiquadFilter(), g = c.createGain();
    src.buffer = this.noiseBuf;
    f.type = o.type || 'bandpass'; f.Q.value = o.q || 1;
    f.frequency.setValueAtTime(o.f, t);
    if (o.to) f.frequency.exponentialRampToValueAtTime(o.to, t + o.dur);
    this.env(g, t, o.vol, o.dur, o.attack);
    src.connect(f); f.connect(g); g.connect(o.out || this.sfx);
    src.start(t, Math.random() * 0.5, o.dur + 0.05);
  },
  gaps: { slash: 45, soul: 60, claw: 70, kill: 40, lose: 60 },   // minimum ms between repeats, so a big army isn't a wall of noise
  play(name) {
    if (!this.ctx || this.muted || this.ctx.state !== 'running') return;
    const now = performance.now();
    if (now - (this.last[name] || 0) < (this.gaps[name] || 0)) return;
    this.last[name] = now;
    this.bank[name](this, 0.9 + Math.random() * 0.2, this.ctx.currentTime);

    for (let y = -6; y < h + 30; y += 46) {

    c.fillStyle = '#e04a3a'; c.fillRect(tx - 33, ty - 22, 66, 5);
    // stone lantern
    const lx = 44, ly = 404;

    Art.rr(c, lx - 9, ly - 13, 18, 14, 2); c.fillStyle = '#9aa1a9'; c.fill();
    c.shadowColor = '#ffb300'; c.shadowBlur = 9; Art.rr(c, lx - 5, ly - 10, 10, 8, 1); c.fillStyle = '#ffd54f'; c.fill(); c.shadowBlur = 0;

  buildAll(scene) {

    m('kokeBoss', 130, 140); m('rockGround', 64, 64); m('stonePath', 280, 128); m('cliff', 72, 80); m('boulder', 30, 24);
    m('spike', 36, 28); m('wall', 132, 60); m('log', 132, 60); m('fence', 16, 36); m('civilian', 20, 28); m('cage', 96, 70); m('rock', 12, 12); m('slash', 48, 48); m('soul', 16, 16); m('dot', 8, 8); m('petal', 8, 6);
    m('archer', 36, 50); m('arrow', 8, 22); m('crate', 36, 32); m('box', 84, 34); m('recruit', 84, 48); m('mystery', 84, 34); m('barrel', 48, 46); m('doorHalf', 86, 40); m('chest', 84, 42); m('yard', 64, 64); m('divider', 10, 64); m('fort', W, 174); m('oni', 48, 54); m('warlord', 130, 150);
    m('grass', 64, 64); m('path', 280, 128); m('lantern', 24, 42); m('deadTree', 60, 58); m('rubble', 30, 24); m('crack', 60, 40); m('tree', 60, 58); m('menuBg', W, H);
    Art.make(scene, 'gateGood', 150, 90, (c, w, h) => Art.gate(c, w, h, true)); Art.make(scene, 'gateBad', 150, 90, (c, w, h) => Art.gate(c, w, h, false));
    Object.keys(RIGS).forEach(kind => {                       // boss limbs (right side, and mirrored for the left), and a whole picture
      RIGS[kind].parts.forEach(d => { if (!scene.textures.exists(d.key)) Art.make(scene, d.key, d.w, d.h, d.side < 0 ? c => { c.translate(d.w, 0); c.scale(-1, 1); Art[d.base](c, d.w, d.h); } : Art[d.base]); });
      const img = scene.textures.get(kind).getSourceImage();
      Art.make(scene, kind + 'Full', img.width / R + 60, img.height / R + 60, c => { c.translate(30, 30); Art.whole(c, img.width / R, img.height / R, kind); });
    });
  },
};

/* ============================================================
   SHARED SCENE HELPERS
   ============================================================ */
class BaseScene extends Phaser.Scene {
  setupCamera() { this.cameras.main.setOrigin(0, 0).setZoom(R); }
  img(x, y, key) { return this.add.image(x, y, key).setScale(S); }
  sword(x, y) { return this.img(x, y, 'katana').setOrigin(0.52, 0.97); }
  // `fit` (in extra) is the widest the text may be; a longer translation is drawn smaller. Wrapped text has no limit.
  txt(x, y, str, size, color = '#fff', extra = {}) {
    const { fit = extra.wordWrap ? 0 : W - 12, ...style } = extra;
    const t = this.add.text(x, y, '', Object.assign({
      fontFamily: FONT, fontSize: size + 'px', color, fontStyle: 'bold', resolution: R,
    }, style)).setOrigin(0.5);
    t._fit = fit; t._fitSize = size;
    return t.setText(str);
  }
  button(x, y, w, h, color, label, size, onTap) {
    const g = this.add.graphics();
    const draw = (pressed) => {
      const C = Phaser.Display.Color, dk = C.IntegerToColor(color).darken(28).color, lt = C.IntegerToColor(color).lighten(14).color;
      const rad = Math.min(10, h / 2 - 1), p = pressed ? 3 : 0, x0 = x - w / 2, y0 = y - h / 2;
      g.clear();
      g.fillStyle(0x000000, 0.38).fillRoundedRect(x0, y0 + 5, w, h, rad);
      g.fillStyle(dk, 1).fillRoundedRect(x0, y0 + p, w, h + (pressed ? 0 : 3) - p, rad);        // the rim along the bottom
      g.fillStyle(color, 1).fillRoundedRect(x0, y0 + p, w, h - 2, rad);
      g.fillStyle(lt, 1).fillRoundedRect(x0 + 2, y0 + 2 + p, w - 4, (h - 2) * 0.46, Math.max(2, rad - 2));
      g.fillStyle(0xffffff, 0.3).fillRoundedRect(x0 + rad, y0 + 3 + p, w - rad * 2, 2, 1);
      g.lineStyle(1.5, C.IntegerToColor(color).darken(40).color, 1).strokeRoundedRect(x0, y0 + p, w, h - 2, rad);
    };
    draw(false);
    const t = this.txt(x, y, label, size, '#fff', { fit: w - 12 });
    const z = this.add.zone(x, y, w, h).setInteractive({ useHandCursor: true });
    let held = false;
    const set = on => { held = on; draw(on); t.y = y + (on ? 3 : 0); };
    z.on('pointerdown', () => set(true));
    z.on('pointerout', () => set(false));
    z.on('pointerup', () => { if (!held) return; set(false); Sound.play('click'); onTap(); });
    return { g, t, z };
  }
}

// Shared look for every menu screen.
class MenuBase extends BaseScene {
  backdrop(title) {
    this.setupCamera();
    Music.set('menu');
    this.hasArt = this.textures.exists('menuArt');
    if (this.hasArt) this.add.image(W / 2, H / 2, 'menuArt').setDisplaySize(H * 784 / 1168, H);     // fills the height; a sliver is cropped off each side
    else this.img(W / 2, H / 2, 'menuBg');
    this.add.particles(0, 0, 'petal', {
      x: { min: 0, max: W }, y: -10, lifespan: 9000, speedY: { min: 30, max: 70 }, speedX: { min: -25, max: 10 },
      scale: S, rotate: { start: 0, end: 360 }, frequency: 450, alpha: 0.85,
    });
    if (!title) return;
    this.add.rectangle(W / 2, H / 2, W, H, 0x0a0610, this.hasArt ? 0.88 : 0.6);
    this.txt(W / 2 + 30, 42, title, 26, '#fff3e0', { stroke: '#2a0a14', strokeThickness: 5 });
    this.button(56, 42, 84, 38, 0x3a3050, '‹ BACK', 14, () => this.scene.start('Menu'));
  }
  panel(x, y, w, h, alpha = 0.92) {
    const g = this.add.graphics();
    g.fillStyle(0x000000, 0.4).fillRoundedRect(x - w / 2, y - h / 2 + 5, w, h, 12);
    g.fillStyle(0x1c1220, alpha).fillRoundedRect(x - w / 2, y - h / 2, w, h, 12);
    g.lineStyle(2, 0xffffff, 0.22).strokeRoundedRect(x - w / 2, y - h / 2, w, h, 12);
    return g;
  }
}

class BootScene extends BaseScene {
  constructor() { super('Boot'); }
  // The menu picture is the one image file (menu.jpg, beside this page). If it cannot be loaded the drawn backdrop is used.
  create() {
    Art.buildAll(this);
    const go = () => { if (!this.left) { this.left = true; this.scene.start('Menu'); } };
    const pic = new Image();
    pic.onload = () => { if (!this.left) this.textures.addImage('menuArt', pic); go(); };
    pic.onerror = go;
    if (location.protocol === 'file:') go(); else pic.src = 'menu.jpg';     // opened straight from disk (the bot test), the browser will not let the game use it
    this.time.delayedCall(4000, go);
  }
}

// The how-to-play pages. Shown before level 1 the first time, and from HOW TO PLAY on the sagas screen.
// Each page has a picture made from the game's own art, a title and a few lines. SKIP is always there.
class TutorialScene extends MenuBase {
  constructor() { super('Tutorial'); }
  init(data) { this.then = data && data.then; this.page = 0; }
  create() {
    this.backdrop('TUTORIAL');
    this.show();
  }
  done() {
    Save.tutorial = true; Save.save();
    if (this.then) this.scene.start('Game', { level: this.then, tips: true });
    else this.scene.start('Sagas');
  }
  show() {
    if (this.pageUi) { this.pageUi.forEach(o => o.destroy()); this.tweens.killAll(); }
    const before = new Set(this.children.list);
    const P = TutorialScene.PAGES[this.page], last = this.page === TutorialScene.PAGES.length - 1;
    this.panel(W / 2, 250, 368, 300);
    const art = this.add.container(0, 0);
    P.draw(this, art);
    this.txt(W / 2, 438, P.title, 22, '#ffd54f', { stroke: '#2a0a14', strokeThickness: 5, fit: 356 });
    this.txt(W / 2, 508, P.text, 15, '#fff3e0', { fontStyle: 'normal', align: 'center', fit: 360, lineSpacing: 5 });     // the lines break where the text says; a long translation shrinks
    TutorialScene.PAGES.forEach((_, i) => {                  // page dots
      this.add.circle(W / 2 + (i - (TutorialScene.PAGES.length - 1) / 2) * 16, 584, i === this.page ? 5 : 3.5, i === this.page ? 0xffd54f : 0x8a8094);
    });
    if (this.page > 0) this.button(104, 640, 130, 50, 0x4a3f63, '‹ BACK', 16, () => { this.page--; this.show(); });
    this.button(this.page > 0 ? 278 : W / 2, 640, this.page > 0 ? 210 : 260, 54, last ? 0x2e7d32 : 0xc62828,
      last ? (this.then ? 'START LEVEL 1' : 'DONE') : 'NEXT ›', 19, () => { if (last) this.done(); else { this.page++; this.show(); } });
    if (!last) this.button(346, 92, 76, 30, 0x3a3050, 'SKIP', 13, () => this.done());
    this.pageUi = this.children.list.filter(o => !before.has(o));
  }
  // Helpers for the pictures.
  pic(c, x, y, key, k = 1) { const o = this.img(x, y, key).setScale(S * k); c.add(o); return o; }
  army(c, x, y, n = 5) {
    const g = this.add.container(x, y); c.add(g);
    for (let i = 0; i < n; i++) {
      const sx = (i % 3 - 1) * 20, sy = Math.floor(i / 3) * 16;
      g.add(this.img(sx, sy, 'samurai')); g.add(this.sword(sx + 9, sy + 5));
    }
    g.add(this.txt(0, -28, String(n), 15, '#fff', { stroke: '#000', strokeThickness: 3 }));
    return g;
  }
  gate(c, x, y, label, good) {
    c.add(this.img(x, y, good ? 'gateGood' : 'gateBad').setScale(S * 0.93));
    c.add(this.txt(x, y, label, 24, '#fff', { stroke: '#000', strokeThickness: 4 }));
  }
  sway(target, dx, ms = 900) { this.tweens.add({ targets: target, x: target.x + dx, duration: ms, yoyo: true, repeat: -1, ease: 'Sine.inOut' }); }

  const left = p => Object.assign({}, p, { base: p.key, key: p.key + 'L', side: -1, x: -p.x, o: [p.w - p.o[0], p.o[1]], hand: p.hand && [-p.hand[0], p.hand[1]] });

// Kinds made of rock: hits on them throw stone chips.
const STONY = { rockOni: 1, iwagame: 1, rockBoss: 1, kokeBoss: 1, genbu: 1 };
// Common enemies that walk with four frames, and how quickly they step (frames per millisecond).
const WALKERS = { zombie: 0.0075, demon: 0.011, rockOni: 0.009, iwagame: 0.0085 };

class GameScene extends BaseScene {
  constructor() { super('Game'); }
  init(data) {
    this.levelNo = clamp((data && data.level) || 1, 1, LEVELS.length);
    this.L = LEVELS[this.levelNo - 1];
    this.tips = !!(data && data.tips);   // straight after the tutorial: short hints pause the first level at the right moments
    this.tipsShown = {};
  }

  create() {
    this.setupCamera();
    this.dist = 0;                 // distance travelled; drives layout and the progress bar
    this.speedMod = 1;
    this.dmgMod = 1;               // grows with each lucky charm broken
    this.timeScale = 1;            // 1 normally, eases to CFG.slowScale during the special
    this.slowLeft = 0;
    this.charge = 0;
    this.ultCharge = 0;            // the ultimate's bar
    this.ultWave = null;           // the wave while it is sweeping up the screen
    this.ultUsed = 0;
    this.count = CFG.startArmy;
    this.earned = 0;
    this.wound = 0;                // enemy strikes add up here; each full point costs one samurai
    this.over = false;
    this.gearOpen = null;          // the slot being viewed while the equipment menu is open
    this.bolts = [];               // lightning streaks being drawn
    this.hazards = [];             // lightning left on the ground
    this.started = false;          // false while the level waits on its start screen
    this.paused = false;           // true while the pause menu is open
    this.time.paused = false;
    this.crushed = false;          // true if a stone wall ended the run
    this.push = 0;                 // how far a stone wall has shoved the army down the screen
    this.upgraded = this.reminded = this.reminder = false;   // the saga 1 upgrade reminder
    this.blockedBy = null;         // the wall the army is pressed against, if any
    this.wallSeen = false;         // the first wall of a run gets a warning banner
    this.weaponSeen = this.logSeen = false;       // ...and the first weapon row
    this.split = null;             // this level's split path, if any (buildLevel)
    this.splitSide = 0;            // -1 or 1 while the army is beside the fence, on that side of it
    this.boost = { dmg: 0, speed: 0, range: 0 };   // weapons picked up this run (CFG.weapon)
    this.fight = false;            // true while the scroll is stopped for a big fight
    this.boss = null;              // the next (or current) big fight; set in buildLevel
    this.finaleDone = false;       // true once every big fight is won
    this.targetX = W / 2;
    this.armyX = W / 2;
    this.formY = 440;
    this.soldiers = [];
    this.enemies = [];
    this.gates = [];
    this.spikes = [];
    this.decor = [];

    Music.set(this.L.storm ? 'storm' : 'run');
    this.applyGear();
    this.buildGround();
    this.buildLevel();
    this.buildFx();
    this.buildHud();
    this.syncArmy(true);
    this.sagaPos = (this.levelNo - 1) % (SAGA_LEVELS + 1);                 // 0-2: levels 1-3 of the saga; 3: its boss
    this.isSagaBoss = this.sagaPos === SAGA_LEVELS;
    this.stageName = this.isSagaBoss ? 'SAGA BOSS' : 'LEVEL ' + (this.sagaPos + 1);
    this.banner(this.stageName, this.L.name);
    this.showStartUi();
    this.input.on('pointerdown', p => {
      if (this.started || this.paused || this.gearOpen || this.reminder || p.worldY < 120 || p.worldY > 505 || (p.worldX < 124 && p.worldY < 198)) return;
      // Saga 1: a player who bought nothing here but could have gets one reminder first.
      if (this.levelNo <= SAGA_LEVELS && !this.upgraded && !this.reminded && this.canUpgrade()) { this.remindUpgrade(); return; }
      this.beginRun();
    });

    // A quick upward flick anywhere looses the ultimate.
    let trail = [];
    const flick = p => {
      const now = performance.now();
      trail.push({ x: p.worldX, y: p.worldY, t: now });
      while (now - trail[0].t > CFG.ult.flickMs) trail.shift();
      const up = trail[0].y - p.worldY;
      if (up >= CFG.ult.flickPx && Math.abs(p.worldX - trail[0].x) < up * 0.6) { trail = []; this.activateUlt(); }
    };
    this.input.on('pointerdown', () => { trail = []; });
    this.input.on('pointermove', p => { if (this.started && !this.paused && p.isDown) flick(p); });
    const steer = p => {
      if (!this.started) return;
      if (p.worldY > 636 && p.worldX > 280) return;        // special button area
      if (this.paused || (p.worldY < 84 && p.worldX > 345)) return;         // pause button area
      this.targetX = clamp(p.worldX, CFG.steerMin, CFG.steerMax);
    };
    this.input.on('pointerdown', steer);
    this.input.on('pointermove', steer);
  }

  /* ---------- gear ---------- */
  // The extra lightning damage Futsu-no-mitama adds to a hit on enemy `e`.
  lightningBonus(e, dmg) {
    if (!this.thunderBlade) return 0;
    const T = CFG.thunderBlade, el = ELEMENT[e.kind];
    return dmg * (T.strong.includes(el) ? T.strongBonus : T.weak.includes(el) ? -T.weakPenalty : 0);
  }

  // Reads the equipped armor and weapon and restyles any samurai already on the field.
  applyGear() {
    this.thunderArmor = Save.armor === 'thunder';
    this.thunderBlade = Save.weapon === 'thunder';
    this.armorTint = this.thunderArmor ? 0xc9bcff : 0xffffff;
    this.bladeTint = this.thunderBlade ? 0xd9a8ff : 0xffffff;
    (this.soldiers || []).forEach(s => { s.img.setTint(this.armorTint); s.blade.setTint(this.bladeTint); });
  }

  /* ---------- start screen ---------- */
  // The level waits with the army standing ready and the upgrade cards along the bottom.
  showStartUi() {
    if (this.startUi) this.startUi.forEach(o => o.destroy());
    const before = new Set(this.children.list);
    this.add.rectangle(W / 2, 618, W, 204, 0x0a0610, 0.6);
    const cards = [
      ['fire', 'ATTACK\nSPEED', 0x2e7d32, (Stats.attackMs() / 1000).toFixed(2) + 's swing'],
      ['damage', 'BLADE\nDAMAGE', 0x1565c0, fmt(Stats.damage()) + ' per hit'],
      ['range', 'RANGE', 0xc62828, Save.range === 1 ? 'up close' : Math.min(Save.range, 1 + (CFG.rangeMax - CFG.attackRange) / CFG.rangeStep).toFixed(1) + 'm reach', Stats.rangeMaxed()],
      ['revenue', 'COIN\nREWARD', 0x6a1b9a, fmt(Stats.soulsPerKill()) + ' per kill'],
    ];
    cards.forEach(([key, title, color, stat, maxed], i) => {
      const x = 52 + i * 98.7, y = 616, w = 92, h = 150, cost = Stats.cost(Save[key], key), can = !maxed && Save.souls >= cost;
      const g = this.add.graphics();
      g.fillStyle(0x1c1220, 0.96).fillRoundedRect(x - w / 2, y - h / 2, w, h, 12);
      g.fillStyle(color, 1).fillRoundedRect(x - w / 2, y - h / 2, w, 34, { tl: 12, tr: 12, bl: 0, br: 0 });
      g.lineStyle(2, 0xffffff, 0.25).strokeRoundedRect(x - w / 2, y - h / 2, w, h, 12);
      this.txt(x, y - h / 2 + 17, title, 11, '#fff', { align: 'center', lineSpacing: -2, fit: 86 });
      this.txt(x, y - 24, 'Lv ' + Save[key], 20);
      this.txt(x, y - 2, stat, 10, '#cfc3d6', { fontStyle: 'normal', fit: 88 });
      const b = this.button(x, y + 42, 80, 40, can ? color : 0x4a4250, maxed ? 'MAX' : coins(cost), 15, () => {
        if (maxed || Save.souls < cost) { Sound.play('deny'); return; }
        Save.souls -= cost; Save[key]++; Save.save(); Sound.play('buy'); this.upgraded = true;
        this.time.delayedCall(0, () => { if (!this.started) this.showStartUi(); });
      });
      if (!can) b.t.setColor('#9a90a0');
    });
    const hint = this.txt(W / 2, 372, 'touch the path to start', 15, '#fff', { stroke: '#000', strokeThickness: 4 });
    this.tweens.add({ targets: hint, alpha: 0.35, duration: 600, yoyo: true, repeat: -1 });
    this.button(54, 96, 84, 34, 0x3a3050, '‹ SAGAS', 13, () => this.scene.start('Sagas'));
    const reopen = kind => this.time.delayedCall(0, () => { if (!this.started) { this.gearOpen = kind; this.showStartUi(); } });
    this.button(64, 138, 104, 32, 0x4a3f63, 'EQUIPMENT', 12, () => reopen('weapon'));
    this.button(64, 176, 104, 32, 0xb26a00, 'STORE', 12, () => reopen('store'));
    if (this.gearOpen === 'store') this.showStore(reopen);
    else if (this.gearOpen) this.showEquipment(reopen);
    this.startUi = this.children.list.filter(o => !before.has(o));
    this.startUi.forEach((o, i) => o.setDepth(5400 + i));
  }

  canUpgrade() {
    return ['fire', 'damage', 'range', 'revenue'].some(k => !(k === 'range' && Stats.rangeMaxed()) && Save.souls >= Stats.cost(Save[k], k));
  }

  // "Don't forget to upgrade": shown once per visit to a saga 1 level when coins are waiting to be spent.
  remindUpgrade() {
    this.reminded = true;
    const before = new Set(this.children.list);
    this.add.rectangle(W / 2, H / 2, W, H, 0x05020c, 0.6).setInteractive();
    const g = this.add.graphics();
    g.fillStyle(0x1c1220, 0.97).fillRoundedRect(30, 200, 340, 250, 14).lineStyle(3, 0xffd54f, 0.9).strokeRoundedRect(30, 200, 340, 250, 14);
    this.txt(W / 2, 236, "DON'T FORGET TO UPGRADE!", 19, '#ffd54f', { fit: 320 });
    this.img(W / 2 - 52, 282, 'soul').setScale(S * 1.6);
    this.txt(W / 2 + 10, 282, coins(Save.souls) + ' coins', 19, '#ffe082');
    this.txt(W / 2, 324, 'Spend them on the cards at the bottom\nto make your samurai stronger.', 14, '#fff3e0', { fontStyle: 'normal', align: 'center', lineSpacing: 4 });
    const close = () => { ui.forEach(o => o.destroy()); this.time.delayedCall(0, () => { this.reminder = false; }); };
    this.button(W / 2, 382, 220, 46, 0x2e7d32, 'UPGRADE', 18, close);
    this.button(W / 2, 428, 220, 30, 0x4a3f63, 'play anyway', 13, () => { close(); this.beginRun(); });
    const ui = this.children.list.filter(o => !before.has(o));
    ui.forEach((o, i) => o.setDepth(7000 + i));
    this.reminder = true;
  }

  // The store: nothing for sale yet.
  showStore(reopen) {
    this.add.rectangle(W / 2, H / 2, W, H, 0x05020c, 0.6);
    const g = this.add.graphics();
    g.fillStyle(0x1c1220, 0.97).fillRoundedRect(20, 92, 360, 436, 14);
    g.lineStyle(2, 0xffffff, 0.25).strokeRoundedRect(20, 92, 360, 436, 14);
    this.txt(W / 2, 114, 'STORE', 19, '#ffd54f');
    g.fillStyle(0x000000, 0.45).fillRoundedRect(W / 2 - 80, 140, 160, 36, 18);
    this.img(W / 2 - 58, 158, 'soul').setScale(S * 1.5);
    this.txt(W / 2 + 8, 158, coins(Save.souls) + ' coins', 18, '#ffe082');
    for (let i = 0; i < 3; i++) {                            // empty shelves
      const x = 86 + i * 114, y = 250;
      g.fillStyle(0x120b18, 1).fillRoundedRect(x - 52, y - 50, 104, 100, 10);
      g.lineStyle(2, 0xffffff, 0.2).strokeRoundedRect(x - 52, y - 50, 104, 100, 10);
      this.txt(x, y, '?', 40, '#4a4250');
    }
    this.txt(W / 2, 350, 'COMING SOON', 26, '#fff3e0', { stroke: '#2a0a14', strokeThickness: 5 });
    this.txt(W / 2, 384, 'The merchant is still on the road.\nSave your coins!', 13, '#cfc3d6', { fontStyle: 'normal', align: 'center' });
    this.button(W / 2, 490, 150, 44, 0x4a3f63, 'CLOSE', 16, () => reopen(null));
  }

  // The equipment menu: three slots across the top, and the items for the chosen slot below.
  showEquipment(reopen) {
    const kind = this.gearOpen, won = Save.level > SAGA_LEVELS + 1;
    const equipped = k => GEAR[k].find(it => it.id === Save[k]) || GEAR[k][0];
    this.add.rectangle(W / 2, H / 2, W, H, 0x05020c, 0.6);
    const g = this.add.graphics();
    g.fillStyle(0x1c1220, 0.97).fillRoundedRect(20, 92, 360, 436, 14);
    g.lineStyle(2, 0xffffff, 0.25).strokeRoundedRect(20, 92, 360, 436, 14);
    this.txt(W / 2, 114, 'EQUIPMENT', 19, '#ffd54f');
    GEAR_SLOTS.forEach(([k, label], i) => {                  // the three slots
      const x = 86 + i * 114, y = 172, on = k === kind, it = equipped(k);
      g.fillStyle(on ? 0x3a2a55 : 0x120b18, 1).fillRoundedRect(x - 52, y - 38, 104, 76, 10);
      g.lineStyle(2, on ? 0xffd54f : 0xffffff, on ? 1 : 0.2).strokeRoundedRect(x - 52, y - 38, 104, 76, 10);
      this.txt(x, y - 27, label, 10, on ? '#ffd54f' : '#b0a6ba', { fit: 98 });
      if (k === 'weapon') this.img(x, y + 2, 'katana').setScale(S * 1.05).setRotation(0.9).setTint(it.id ? 0xd9a8ff : 0xffffff);
      else if (k === 'armor') this.img(x, y - 1, 'samurai').setScale(S * 0.82).setTint(it.id ? 0xc9bcff : 0xffffff);
      else this.add.graphics().lineStyle(2.5, it.id ? 0xffd54f : 0x5a5064, 1).strokeCircle(x, y - 2, 11).fillStyle(it.id ? 0xffd54f : 0x5a5064, 1).fillCircle(x, y + 10, 3.5);
      this.txt(x, y + 27, it.name, 9.5, '#fff', { fontStyle: 'normal', fit: 100 });
      this.add.zone(x, y, 104, 76).setInteractive({ useHandCursor: true }).on('pointerup', () => { if (k !== kind) { Sound.play('click'); reopen(k); } });
    });
    let y = 240;
    GEAR[kind].forEach(item => {                             // items for the chosen slot
      const have = !item.boss || won, on = Save[kind] === item.id;
      this.txt(36, y, item.name, 15, have ? '#fff' : '#8a8094', { fit: 226 }).setOrigin(0, 0.5);
      if (GEAR[kind].length > 1) {
        const b = this.button(318, y + 4, 96, 34, on ? 0x2e7d32 : have ? 0x1565c0 : 0x3a3444, on ? 'EQUIPPED' : have ? 'EQUIP' : 'LOCKED', 12, () => {
          if (!have) { Sound.play('deny'); return; }
          Save[kind] = item.id; Save.save(); Sound.play('buy');
          this.applyGear();
          reopen(kind);
        });
        if (!have) b.t.setColor('#8a8094');
      }
      const effect = this.txt(36, y + 12, have ? item.effect : 'Defeat the saga boss to unlock.', 11, '#ffe082', { fontStyle: 'normal', wordWrap: { width: 222 } }).setOrigin(0, 0);
      y += 18 + effect.height;
      if (have && item.lore) {
        const lore = this.txt(36, y, item.lore, 10, '#cfc3d6', { fontStyle: 'italic', wordWrap: { width: 328 }, lineSpacing: 1.5 }).setOrigin(0, 0);
        y += lore.height + 4;
      }
      y += 20;
    });
    this.button(W / 2, 502, 130, 34, 0x4a3f63, 'CLOSE', 13, () => reopen(null));
  }

  beginRun() {
    if (this.started) return;
    this.gearOpen = null;
    this.started = true;
    this.startUi.forEach(o => o.destroy());
    this.startUi = null;
    this.specialText.setVisible(true); this.specialHint.setVisible(true); this.ultHint.setVisible(true);
  }

  /* ---------- construction ---------- */
  buildGround() {
    const mountain = this.L.theme === 'mountain';
    this.grass = this.add.tileSprite(W / 2, H / 2, W, H, mountain ? 'rockGround' : 'grass').setTileScale(S).setDepth(-20);
    const pw = CFG.pathRight - CFG.pathLeft;
    this.path = this.add.tileSprite(W / 2, H / 2, pw, H, mountain ? 'stonePath' : 'path').setTileScale(S).setDepth(-19);
    const fog = this.add.graphics().setDepth(-18);           // distance haze at the top
    const haze = mountain ? 0x9aa7b5 : 0x1a1030;
    fog.fillGradientStyle(haze, haze, haze, haze, 0.75, 0.75, 0, 0).fillRect(0, 0, W, 200);
    if (mountain) {                                          // cliffs wall in both sides of the pass, with loose boulders at their feet
      for (let d = 60; d < this.L.length + 700; d += 58) [0, 1].forEach(right => {
        const x = 18 + Math.random() * 10;
        this.decor.push({ d: d + Math.random() * 20, x: right ? W - x : x, size: 0.9 + Math.random() * 0.35, obj: this.img(0, -200, 'cliff').setFlipX(Math.random() < 0.5), flat: true });
        if (Math.random() < 0.3) this.decor.push({ d: d + 30, x: right ? W - 50 - Math.random() * 6 : 50 + Math.random() * 6, size: 0.7 + Math.random() * 0.5, obj: this.img(0, -200, 'boulder'), flat: true });
      });
      return;
    }
    for (let d = 100; d < this.L.length + 600; d += 150) {
      const left = (d / 150) % 2 < 1;
      const key = this.L.storm ? (Math.random() < 0.6 ? 'deadTree' : 'rubble') : Math.random() < 0.55 ? 'tree' : 'lantern';
      this.decor.push({ d, x: left ? 24 + Math.random() * 12 : W - 24 - Math.random() * 12, obj: this.img(0, -200, key), flat: true });
    }
    if (!this.L.storm) return;
    // The storm stage: scorched colours, cracked ground, a dark sky that flickers.
    this.grass.setTint(0x7c8792); this.path.setTint(0xa9a0b3);
    fog.fillGradientStyle(0x05020c, 0x05020c, 0x05020c, 0x05020c, 0.5, 0.5, 0, 0).fillRect(0, 0, W, 300);
    for (let d = 160; d < this.L.length + 500; d += 110 + Math.random() * 120) {
      this.decor.push({ d, x: 90 + Math.random() * 220, obj: this.img(0, -200, 'crack').setRotation(Math.random() * 3), flat: true });
    }
    this.stormDark = this.add.rectangle(W / 2, H / 2, W, H, 0x05020c, 0.15).setDepth(-7);   // deepens when the boss awakens
    this.skyFlash = this.add.rectangle(W / 2, H / 2, W, H, 0xc9b8ff, 1).setAlpha(0).setDepth(-6);
    this.skyT = 1500;
    this.stormT = CFG.storm.everyMs[0];
    this.wave = null;
    this.waveImg = this.img(0, -200, 'slash').setTint(0xd1c4e9).setBlendMode(Phaser.BlendModes.ADD).setDepth(2955).setVisible(false);
  }

  buildLevel() {
    this.L.gates.forEach((g, i) => {
      if (g.split) return;
      const goodLeft = Math.random() < 0.5;
      this.gates.push({
        d: g.d, used: false, weaponRow: this.L.weapons.includes(i), logRow: this.L.logs.includes(i),
        left: this.makeGate(130, goodLeft ? g.good : g.bad, goodLeft),
        right: this.makeGate(270, goodLeft ? g.bad : g.good, !goodLeft),
      });
    });
    if (this.L.splitAt) this.buildSplit();
    this.L.packs.forEach(pk => {
      for (let i = 0; i < pk.n; i++) {
        const [kind, mul] = this.pickFoe();
        const x = pk.split ? W / 2 + this.split.foeSide * (22 + Math.random() * 100) : 85 + Math.random() * 230;       // the split's pack keeps to its side
        const e = this.addEnemy(kind, x, pk.d + i * pk.gap, Math.round(pk.hp * mul));
        if (pk.split) e.splitSide = this.split.foeSide;
      }
    });
    const [charmRows, charmHp, charmGrow] = this.L.charms;
    charmRows.forEach((row, idx) => {
      const e = this.addEnemy('charm', 100 + Math.random() * 200, this.L.gates[row].d - CFG.charm.lead, charmHp + charmGrow * idx);
      const glow = this.img(0, 0, 'glow').setBlendMode(Phaser.BlendModes.ADD);
      e.sprite = e.obj;                                      // the cat itself, for hit flashes
      e.obj = this.add.container(e.x, -200, [glow, e.sprite.setPosition(0, 0)]);
      Object.assign(e, { glow, r: 8, souls: CFG.charm.souls, vx: (Math.random() < 0.5 ? -1 : 1) * CFG.charm.speed });
    });
    const [wallRows, wallHp, wallGrow] = this.L.walls;
    wallRows.forEach((row, idx) => {
      const gate = this.gates.find(g => g.d === this.L.gates[row].d), side = gate.left.good ? gate.left : gate.right;
      const e = this.addEnemy('wall', side.x, gate.d - CFG.wall.lead, wallHp + wallGrow * idx);
      e.sprite = e.obj.setOrigin(0.5, 0.62);
      e.label = this.txt(0, -40, '', 26, '#fff', { stroke: '#3a0d14', strokeThickness: 6 });
      e.obj = this.add.container(e.x, -200, [e.sprite.setPosition(0, 0), e.label]);
      Object.assign(e, { r: 20, souls: CFG.wall.souls });
      this.wallLabel(e);
    });
    this.L.spikes.forEach(d => {
      this.addSpike(Math.random() < 0.5 ? 130 : 270, d);
    });
    this.bosses = this.L.bosses.map(b => {
      const P = CFG.bosses[b.type];
      return Object.assign(this.addEnemy(P.key, W / 2, b.at, b.hp),
        { prof: P, r: P.r, souls: P.souls, state: 'chase', t: P.chaseMs + 500, swings: 0, power: false, air: false, trickleHp: b.trickleHp, trickleT: P.trickleMs });
    });
    this.specialMax = Math.max(CFG.specialMax, Math.round(this.enemies.length / CFG.specialsPerLevel));
    this.ultMax = Math.max(CFG.ult.min, Math.round(this.enemies.length / CFG.ult.perLevel));
    this.boss = this.bosses[0] || null;
    this.finaleDone = !this.boss;
  }

  // The split path: a fence down the middle, logs and a cage on one side, this row's enemies on the other.
  buildSplit() {
    const C = CFG.split, d0 = this.L.splitAt, logSide = Math.random() < 0.5 ? -1 : 1, x = W / 2 + logSide * 70;
    const sp = this.split = { dA: d0 - C.before, dB: d0 - C.before + C.length, logSide, foeSide: -logSide, walls: [], gap: 0, margin: C.margin };
    for (let d = sp.dA; d <= sp.dB; d += 15) this.decor.push({ d, x: W / 2, obj: this.img(0, -200, 'fence') });
    sp.mat = this.L.saga > 0 && Save.range >= CFG.weapon.stoneRange ? 'stone' : 'log';
    const n = C.logs[Math.floor(Math.random() * C.logs.length)];
    sp.gap = C.span / (n - 1);
    for (let i = 0; i < n; i++) sp.walls.push(this.addObstacle(x, d0 + C.first + i * sp.gap, sp.mat, false));
    sp.cage = { d: d0 + C.cage, x, obj: this.img(0, -200, 'cage').setOrigin(0.5, 0.7) };
    this.decor.push(sp.cage);
  }

  // A log pile or stone wall whose health follows the army (updateWeapons).
  addObstacle(x, d, mat, forWeapon) {
    const e = this.addEnemy('wall', x, d, CFG.weapon.minHp);
    if (mat === 'log') e.obj.setTexture('log');
    e.sprite = e.obj.setOrigin(0.5, 0.62);
    e.label = this.txt(0, -40, '', 26, '#fff', { stroke: '#3a0d14', strokeThickness: 6 });
    e.obj = this.add.container(e.x, -200, [e.sprite.setPosition(0, 0), e.label]);
    Object.assign(e, { r: 20, souls: CFG.wall.souls, mat, weaponWall: true, forWeapon, y: CFG.armyY - (e.d - this.dist) });   // y set now: it is checked before the next draw
    this.wallLabel(e);
    return e;
  }

  makeGate(x, op, good) {
    const g = this.img(0, 0, good ? 'gateGood' : 'gateBad');                         // a lacquered torii (Art.gate)
    const label = (op.op === 'x' ? '×' : op.op === '-' ? '−' : '+') + op.n;
    const t = this.txt(0, 0, label, 28, '#fff', { stroke: good ? '#0d2a5c' : '#5c0d0d', strokeThickness: 5 });
    return { x, op, good, obj: this.add.container(x, -200, [g, t]) };
  }

  // A common enemy for this level and its health multiplier: a demon (saga 1), the level's mixed-in foe, or its usual one.
  pickFoe() {
    if (this.L.demons && Math.random() < CFG.enemy.demonShare) return ['demon', CFG.enemy.demonHp];
    if (this.L.mix && Math.random() < this.L.mix[1]) return [this.L.mix[0], this.L.mix[2]];
    return [this.L.foe, 1];
  }
  addEnemy(kind, x, d, hp) {
    const e = { kind, x, d, hp, maxHp: hp, r: 0, strike: 400, seed: Math.random() * 6, obj: this.img(x, -200, kind) };
    this.enemies.push(e);
    return e;
  }

  wallLabel(e) { e.label.setText('♥\uFE0E ' + Math.max(1, Math.ceil(e.hp))); }

  addSpike(x, d) { this.spikes.push({ x, d, hit: false, obj: this.img(x, -200, 'spike'), flat: true }); }

  buildFx() {
    this.burst = this.add.particles(0, 0, 'dot', {
      speed: { min: 40, max: 150 }, lifespan: { min: 250, max: 480 }, scale: { start: S, end: 0 }, emitting: false,
    }).setDepth(3000);
    // Effects (`fxHit`, `fxDust`): glowing sparks where blades land, stone chips that fly up and fall, soft dust and smoke.
    this.sparks = this.add.particles(0, 0, 'dot', {
      speed: { min: 90, max: 240 }, lifespan: { min: 140, max: 300 }, scale: { start: S * 0.55, end: 0 }, blendMode: 'ADD', emitting: false,
    }).setDepth(3001);
    this.chips = this.add.particles(0, 0, 'rock', {
      speed: { min: 60, max: 170 }, angle: { min: 200, max: 340 }, gravityY: 520, lifespan: { min: 380, max: 620 },
      scale: { start: S * 0.7, end: S * 0.4 }, rotate: { min: 0, max: 360 }, alpha: { start: 1, end: 0.5 }, emitting: false,
    }).setDepth(2995);
    this.smoke = this.add.particles(0, 0, 'puff', {
      speed: { min: 8, max: 42 }, lifespan: { min: 500, max: 950 }, scale: { start: S * 0.5, end: S * 1.7 }, alpha: { start: 0.5, end: 0 }, emitting: false,
    }).setDepth(2990);
    this.dustTint = this.L.theme === 'mountain' ? 0xa7abad : 0xb89f80;
    if (this.L.storm) this.add.particles(0, 0, 'dot', {      // rain
      x: { min: 0, max: W + 80 }, y: -10, lifespan: 900, speedY: { min: 760, max: 900 }, speedX: -90,
      scaleX: S * 0.25, scaleY: S * 2.6, frequency: 28, alpha: 0.28, tint: 0xb0bec5,
    }).setDepth(3500);
    else this.add.particles(0, 0, 'petal', {
      x: { min: 0, max: W }, y: -10, lifespan: 8000, speedY: { min: 35, max: 80 }, speedX: { min: -25, max: 10 },
      scale: S, rotate: { start: 0, end: 360 }, frequency: 500, alpha: 0.8,
    }).setDepth(3500);
    this.danger = this.add.graphics().setDepth(-10);        // red warning zone under a boss attack
    this.boltG = this.add.graphics().setDepth(2960);        // lightning
    this.shade = this.add.rectangle(W / 2, H / 2, W, H, 0x05020c, 1).setAlpha(0).setDepth(-5);   // darkens the ground during a power-up
    this.slowTint = this.add.rectangle(W / 2, H / 2, W, H, 0x5e35b1, 1).setAlpha(0).setDepth(3600);
    this.crushG = this.add.graphics().setDepth(4400);       // the red line an obstacle pushes the army toward
    this.crushText = this.txt(W / 2, 0, '', 20, '#ff5252', { stroke: '#000', strokeThickness: 5 }).setDepth(4401).setVisible(false);
    this.ultG = this.add.graphics().setDepth(2970).setBlendMode(Phaser.BlendModes.ADD);       // the ultimate's wave
  }

  buildHud() {
    const D = 5000;
    this.hud = this.add.graphics().setDepth(D);
    this.soulIcon = this.img(22, 56, 'soul').setScale(S * 1.2).setDepth(D);
    this.soulText = this.txt(34, 56, '', 16, '#ffe082', { stroke: '#1a0a20', strokeThickness: 3 }).setOrigin(0, 0.5).setDepth(D);
    this.countText = this.txt(0, 0, '', 15, '#fff', { stroke: '#0d1642', strokeThickness: 4 }).setDepth(D);
    this.specialText = this.txt(336, 676, 'SLOW', 13, '#fff', { fit: 62 }).setDepth(D + 1).setVisible(false);
    this.specialHint = this.txt(130, 662, 'SPECIAL', 10, '#b39ddb').setDepth(D).setVisible(false);
    this.ultHint = this.txt(130, 634, 'ULTIMATE', 10, '#ffe082', { fit: 240 }).setDepth(D).setVisible(false);
    this.add.zone(336, 676, 84, 76).setInteractive().on('pointerdown', () => this.activateSpecial());
    this.earnedText = this.txt(0, 57, '', 11, '#ffe082', { stroke: '#1a0a20', strokeThickness: 3 }).setOrigin(0, 0.5).setDepth(D).setAlpha(0.9);
    // pause button
    const pg = this.add.graphics().setDepth(5100);
    pg.fillStyle(0x000000, 0.45).fillCircle(372, 58, 17).fillStyle(0xffffff, 1).fillRoundedRect(365, 50, 5, 16, 1.5).fillRoundedRect(374, 50, 5, 16, 1.5);
    this.add.zone(372, 58, 48, 48).setDepth(5100).setInteractive({ useHandCursor: true }).on('pointerdown', () => { Sound.unlock(); this.setPaused(true); });
  }

  /* ---------- main loop ---------- */
  update(time, delta) {
    if (this.over || this.paused) return;
    if (!this.started) {                                   // start screen: the world is drawn but frozen
      this.updateScroll(0);
      this.updateArmy(time, Math.min(delta, 50) / 1000);
      this.updateHud(0);
      return;
    }
    const dt = Math.min(delta, 50) / 1000;                 // real time: steering, samurai attacks
    const slowing = this.slowLeft > 0;
    this.timeScale += ((slowing ? CFG.slowScale : 1) - this.timeScale) * damp(10, dt);
    const wdt = dt * this.timeScale;                       // world time: scroll, enemy attacks
    Music.rate = this.timeScale;

    if (slowing) this.slowLeft = Math.max(0, this.slowLeft - delta);
    this.slowTint.setAlpha((1 - this.timeScale) / (1 - CFG.slowScale) * 0.2);

    this.updateEnemies(wdt);
    this.updateScroll(wdt);
    this.updateArmy(time, dt);
    this.updateGates();
    this.updateCombat(dt);
    this.updateUlt(dt);
    this.updateHazards(wdt);
    this.updateRigs(wdt);
    if (this.L.storm) this.updateStorm(wdt);
    this.drawBolts(wdt);
    this.updateHud(dt);
    if (this.tips) this.updateTips();

    if (this.count <= 0) this.finish(false);
    else if (this.finaleDone && this.dist >= this.L.length) this.finish(true);
  }

  updateScroll(wdt) {
    if (!this.fight) {
      const speed = CFG.baseSpeed * this.L.pace * (1 + CFG.speedRamp * this.dist / this.L.length) * this.speedMod * (this.blockedBy ? CFG.wall.pushSlow : 1);
      const step = speed * wdt;
      this.dist += step;
      this.grass.tilePositionY -= step * R;
      this.path.tilePositionY -= step * R;
      this.enemies.forEach(e => { if (e.hold) e.d += step; });
    }
    const place = o => {
      const y = CFG.armyY - (o.d - this.dist);
      o.y = y;
      if (y > H + 80) { o.obj.destroy(); o.gone = true; return; }
      if (y < -120) { if (o.obj.visible) o.obj.setVisible(false); return; }      // far ahead: nothing to draw yet
      const p = this.persp(y);
      const bob = o.seed !== undefined && !o.r && !o.hold && o !== this.boss ? Math.sin(this.time.now * 0.02 + o.seed) * 1.5 : 0;
      if (WALKERS[o.kind] && !o.rolling && !o.wind && o.obj.active) {         // walking frames, faster for quicker kinds
        const key = o.kind + '_' + (Math.floor(this.time.now * WALKERS[o.kind] + o.seed * 7) % 4);
        if (o.obj.texture.key !== key && o.obj.texture.key !== o.kind + 'Ball') o.obj.setTexture(key);
      }
      o.obj.setVisible(y > -90).setPosition(o.x, y + bob).setScale((o.obj.type === 'Container' ? 1 : S) * p * (o.size || 1)).setDepth(o.flat ? y - 30 : y);
    };
    const alive = o => !o.gone;
    this.decor.forEach(place); this.spikes.forEach(place); this.enemies.forEach(place);
    this.gates.forEach(g => {
      [g.left, g.right].forEach(s => { s.d = g.d; place(s); });
      g.y = g.left.y; g.gone = g.left.gone;
    });
    this.decor = this.decor.filter(alive); this.spikes = this.spikes.filter(alive);
    this.enemies = this.enemies.filter(alive); this.gates = this.gates.filter(alive);
    if (!this.fight && this.boss && this.boss.y >= 330) this.startFight();
  }

  // Far things are drawn smaller.
  persp(y) { return 0.7 + 0.3 * clamp((y - 60) / 500, 0, 1); }

  updateArmy(time, dt) {
    this.targetX = this.steerClamp(this.targetX);
    this.armyX += (this.targetX - this.armyX) * damp(12, dt);
    const wantForm = !this.started ? 440 : this.fight ? this.boss.y + 92 : CFG.armyY + this.push;   // stands above the upgrade cards until the run begins
    this.formY += (wantForm - this.formY) * damp(5, dt);
    if (this.blockedBy) this.formY = Math.max(this.formY, this.blockedBy.y + 26);          // pressed against a stone wall
    const n = this.soldiers.length, cols = Math.min(5, Math.ceil(Math.sqrt(n || 1)));
    const running = this.started && !this.fight && !this.over;
    this.soldiers.forEach((s, i) => {
      const col = i % cols, row = Math.floor(i / cols);
      const inRow = Math.min(cols, n - row * cols);
      const wx = this.armyX + (col - (inRow - 1) / 2) * 21;
      const wy = this.formY + row * 18;
      const k = damp(16 - row * 2.5, dt);                 // back rows trail a little
      const lean = clamp((wx - s.x) * 0.02, -0.25, 0.25);
      s.x += (wx - s.x) * k; s.y += (wy - s.y) * k;
      s.lunge *= 1 - damp(14, dt);
      s.pop += (1 - s.pop) * damp(14, dt);
      const bob = Math.sin(time * 0.018 + i * 1.7) * 1.6;
      s.swing = Math.max(0, s.swing - dt / 0.17);
      const p = this.persp(s.y) * s.pop, y = s.y + bob - s.lunge;
      const tex = running ? 'samurai_' + (Math.floor(time * 0.011 + i * 0.37) % 4) : 'samurai';      // the run cycle
      if (s.img.texture.key !== tex) s.img.setTexture(tex);
      s.img.setPosition(s.x, y).setRotation(lean).setScale(S * p).setDepth(s.y);
      s.blade.setPosition(s.x + 9.5 * p, y + 5.5 * p).setScale(S * p).setDepth(s.y + 0.5)
        .setRotation(0.45 + lean - Math.sin(s.swing * Math.PI) * 2.4);
    });
  }

  updateGates() {
    this.gates.forEach(g => {
      if (g.used || g.y < this.formY - 14) return;
      g.used = true;
      const side = this.armyX < W / 2 ? g.left : g.right;
      const other = side === g.left ? g.right : g.left;
      if (side.weapon) { this.pickWeapon(side, other); return; }
      const before = this.count;
      if (side.op.op === '+') this.count += side.op.n;
      if (side.op.op === '-') this.count = Math.max(1, this.count - side.op.n);   // a red gate never takes the last samurai
      if (side.op.op === 'x') this.count *= side.op.n;
      const diff = this.count - before;
      this.float(this.armyX, this.formY - 40, (diff >= 0 ? '+' : '−') + Math.abs(diff), side.good ? '#64b5f6' : '#ff5252', 30);
      if (side.good) this.cameras.main.flash(120, 30, 110, 220); else this.cameras.main.flash(120, 120, 20, 20);
      Sound.play(side.good ? 'gateGood' : 'gateBad');
      if (!side.good) this.shake(140, 0.006);
      this.tweens.add({ targets: side.obj, alpha: 0, duration: 220 });
      this.tweens.add({ targets: other.obj, alpha: 0.25, duration: 220 });
      this.syncArmy();
    });
  }

  updateCombat(dt) {
    const cd = this.swingMs(), dmg = this.bladeDmg();
    const reach = this.reachNow(), extra = reach - CFG.attackRange;
    const near = this.enemies.filter(e => e.y > 250 - extra && e.y < H);
    this.soldiers.forEach(s => {
      s.cd -= dt * 1000;
      if (s.cd > 0) return;
      let best = null, bestD = reach, wall = null;
      near.forEach(e => {
        if (e.hp <= 0 || e.incoming >= e.hp) return;      // already finished off by a slash in flight
        if (e.splitSide && this.splitSide === -e.splitSide && !this.split.done) return;      // across the fence
        if (e.kind === 'wall') {       // cut at from a distance, but anything closer comes first
          if (e.y > this.formY - Math.max(CFG.wall.range, reach) && e.y < this.formY && Math.abs(this.armyX - e.x) < CFG.wall.half && (!wall || e.y > wall.y)) wall = e;
          return;
        }
        // Big fights: the army stands below the boss, so reach is measured sideways (half the Range bonus counts).
        const d = e === this.boss && this.fight ? (Math.abs(s.x - e.x) < e.prof.reach + 10 + extra / 2 ? 0 : Infinity) : Math.hypot(e.x - s.x, e.y - s.y) - e.r;
        if (d < bestD) { bestD = d; best = e; }
      });
      if (wall && (!best || bestD > CFG.attackRange && this.formY - wall.y < bestD)) best = wall;
      if (!best) return;
      s.cd = cd * (0.9 + Math.random() * 0.2);
      s.lunge = 7; s.swing = 1;
      if (best.kind === 'wall') this.airSlash(s, best);
      else if (best !== this.boss && bestD > CFG.attackRange) {     // out of sword reach: a wind slash flies to it
        this.windSlash(s, best, dmg);
        s.cd *= CFG.rangedSwing;
        return;
      }
      this.strike(best, dmg + this.lightningBonus(best, dmg), s);
      if (this.thunderBlade && Math.random() < 0.6) this.zap(s.x + 9, s.y - 12, best.x, best.y, 90);   // Futsu-no-mitama's trail
    });
  }

  // Swing time, damage and reach, with this run's weapon boosts.
  swingMs() { return Stats.attackMs() / (1 + CFG.weapon.speed * this.boost.speed); }
  bladeDmg() { return Stats.damage() * this.dmgMod * (1 + CFG.weapon.dmg * this.boost.dmg); }
  reachNow() { return Math.min(CFG.rangeMax, Stats.reach() + this.boost.range * CFG.weapon.rangeLevels * CFG.rangeStep); }

  strike(e, dmg, s) {
    if (e.powering) return;        // mid power-up: nothing can hurt him
    if (e.air) {                   // airborne: the swing finds nothing
      if (Math.random() < 0.4) this.float(e.x + (Math.random() - 0.5) * 70, e.y - 10 - Math.random() * 30, 'MISS', '#cfd8dc', 13);
      return;
    }
    e.hp -= dmg;
    Sound.play('slash');
    const spread = e.r ? e.r * 0.6 : 4;
    const hx = e.x + (Math.random() - 0.5) * spread * 2, hy = e.y + (Math.random() - 0.5) * spread;
    const sl = this.img(hx, hy, 'slash').setDepth(2900).setRotation(Math.atan2(e.y - s.y, e.x - s.x) + (Math.random() - 0.5))
      .setScale(S * (e.r ? 1.1 : 0.75));
    this.tweens.add({ targets: sl, alpha: 0, scaleX: sl.scaleX * 1.5, scaleY: sl.scaleY * 1.5, duration: 140, onComplete: () => sl.destroy() });
    this.fxHit(hx, hy, e, e.r ? 5 : 3);
    if (!e.prof) {                 // small enemies flash white
      const sp = e.sprite || e.obj;
      sp.setTintFill(0xffffff);
      this.time.delayedCall(55, () => { if (sp.active) sp.clearTint(); });
    } else if (!e.flash) {         // big ones take a short red tint now and then, so the art stays visible
      e.flash = true;
      e.obj.setTint(0xff9a9a);
      this.time.delayedCall(60, () => { if (e.obj.active) e.obj.clearTint(); });
      this.time.delayedCall(260, () => { e.flash = false; });
    }
    if (e.r || Math.random() < 0.5) this.float(hx, hy - 12, fmt(dmg), this.thunderBlade && ELEMENT[e.kind] ? '#d9a8ff' : '#ffeb3b', 13);
    if (e.label) this.wallLabel(e);
    if (e.hp <= 0) this.kill(e);
  }

  kill(e) {
    const raw = e.souls || Stats.soulsPerKill();
    const gain = Math.floor(raw) + (Math.random() < raw % 1 ? 1 : 0);      // a half coin pays out every other kill
    this.earned += gain; Save.souls += gain;
    Sound.play('kill');
    this.charge = Math.min(this.specialMax, this.charge + (e.r && e.kind !== 'wall' ? this.specialMax / 4 : 1));
    if (!this.ultWave) {           // its own kills do not refill it
      const was = this.ultCharge;
      this.ultCharge = Math.min(this.ultMax, was + (e.prof ? this.ultMax / 5 : 1));
      if (was < this.ultMax && this.ultCharge >= this.ultMax) { Sound.play('ultReady'); this.float(130, 628, 'ULTIMATE READY!', '#ffe082', 15); }
    }
    const tint = { demon: 0xab47bc, zombie: 0x9ccc65, giant: 0x9ccc65, thunder: 0xb388ff, charm: 0xffd54f, wall: 0x9aa1a9, rockOni: 0x9aa1a9, iwagame: 0x8d6e63, rockBoss: 0x9aa1a9, genbu: 0xff9100, kokeBoss: 0x8fa07c, tenguBoss: 0xef5350, boss: 0xab47bc }[e.kind];
    this.fxDust(e.x, e.y + 6, e.prof ? 22 : e.r ? 8 : 2);
    if (STONY[e.kind] || e.kind === 'wall') this.chips.explode(e.prof ? 16 : e.r ? 8 : 3, e.x, e.y);
    this.burst.setParticleTint(e.mat === 'log' ? 0x8d6e63 : tint);
    this.burst.explode(e.r ? 40 : 10, e.x, e.y);
    const orb = this.img(e.x, e.y, 'soul').setDepth(5001).setScale(S * (e.r ? 2 : 1.2));
    this.tweens.add({ targets: orb, x: 22, y: 56, duration: 520, ease: 'Cubic.in', onComplete: () => {
      orb.destroy(); Sound.play('soul');
      this.tweens.add({ targets: this.soulIcon, scale: S * 1.8, duration: 80, yoyo: true });
    } });
    if (e.kind === 'wall') {
      Sound.play('wallBreak'); this.shake(200, 0.01);
      for (let i = 0; i < 9; i++) {                          // the stones tumble apart
        const rk = this.img(e.x + (Math.random() - 0.5) * 100, e.y - Math.random() * 24, 'rock').setDepth(2900).setScale(S * (0.8 + Math.random() * 0.9));
        if (e.mat === 'log') rk.setTint(0xa1887f);           // splinters
        this.tweens.add({ targets: rk, x: rk.x + (Math.random() - 0.5) * 120, y: rk.y + 30 + Math.random() * 50, rotation: (Math.random() - 0.5) * 8, alpha: 0, duration: 520, ease: 'Cubic.out', onComplete: () => rk.destroy() });
      }
    }
    if (e.kind === 'charm') {
      this.dmgMod *= CFG.charmDamageUp;
      this.banner('LUCKY CHARM', 'blade damage +10%'); Sound.play('buy');
      this.shake(180, 0.008);
      Save.save();
    }
    e.obj.destroy(); e.gone = true;
    if (e === this.boss) this.endFight();
  }

  // Demons and zombies run at the nearest samurai, stop in reach, and strike on a timer.
  updateEnemies(wdt) {
    const E = CFG.enemy;
    const pack = this.enemies.filter(e => !e.r && !e.gone && e.y > -20);
    const backRow = this.soldiers.reduce((m, s) => Math.max(m, s.y), 0);
    if (!this.rollG) this.rollG = this.add.graphics().setDepth(-9);
    this.rollG.clear();
    pack.forEach(e => {
      const k = E[e.kind], run = k.speed * this.L.pace + (this.fight ? E.fightRush : 0);
      // The split path's pack keeps to its side of the fence, and runs straight on if the army took the other side.
      const fenced = e.splitSide && this.split && !this.split.done && e.d > this.split.dA;
      if (fenced && this.splitSide === -e.splitSide) { e.hold = false; e.d -= run * wdt; e.obj.setRotation(0); return; }
      // Once past the back row an enemy gives up and keeps running off the bottom.
      if (e.passed || e.y > backRow + 12) { e.passed = true; e.hold = false; e.d -= run * wdt; e.obj.setRotation(0); return; }
      let near = null, L = Infinity;
      this.soldiers.forEach(s => { const d = Math.hypot(s.x - e.x, s.y - e.y); if (d < L) { L = d; near = s; } });
      if (!near) { e.hold = false; return; }
      if (k.roll && this.shellRoll(e, k.roll, wdt, backRow)) return;
      e.hold = L <= E.reach;
      if (!e.hold) {
        const v = run * wdt / L;
        e.x = clamp(e.x + (near.x - e.x) * v, CFG.pathLeft + 12, CFG.pathRight - 12);
        if (fenced) e.x = e.splitSide < 0 ? Math.min(e.x, W / 2 - 16) : Math.max(e.x, W / 2 + 16);
        e.d -= (near.y - e.y) * v;
        e.obj.setRotation(clamp((near.x - e.x) * 0.006, -0.2, 0.2));
        return;
      }
      e.obj.setRotation(0);
      e.strike -= wdt * 1000;
      if (e.strike > 0) return;
      e.strike = k.strikeMs;
      Sound.play('claw');
      this.enemySlash(near.x, near.y, 0.55, e.kind === 'demon' ? 0xea80fc : e.kind === 'rockOni' ? 0xcfd8dc : e.kind === 'iwagame' ? 0xffab40 : 0xc5e1a5);
      near.img.setTint(0xff8a80);
      this.time.delayedCall(90, () => { if (near.img.active) near.img.setTint(this.armorTint); });
      this.wound += k.hit;
      if (this.wound >= 1) { this.wound -= 1; this.lose(1, near); }
    });
    // keep the pack from stacking on one spot
    for (let a = 0; a < pack.length; a++) for (let b = a + 1; b < pack.length; b++) {
      const p = pack[a], q = pack[b], dx = p.x - q.x, dy = q.d - p.d, d = Math.hypot(dx, dy);
      if (d >= 13 || d === 0) continue;
      const push = (13 - d) / 2 / d;
      p.x += dx * push; q.x -= dx * push; p.d -= dy * push; q.d += dy * push;
    }
  }

  // The Iwagame's roll: count down, wind up in its shell (aim shown), roll; true while it is busy with that.
  shellRoll(e, R, wdt, backRow) {
    const ms = wdt * 1000;
    if (e.rolling || e.wind) {                               // the ball has no shadow of its own (it spins)
      const p = e.obj.scaleX / S;
      this.rollG.fillStyle(0x000000, 0.3).fillEllipse(e.x, e.y + 13 * p, 24 * p, 6 * p);
      if (e.rolling && Math.random() < 0.35) this.fxDust(e.x, e.y + 10 * p, 1);
    }
    if (e.rolling) {
      e.rolling -= ms; e.spin = (e.spin || 0) + wdt * 14;
      e.x = clamp(e.x + e.rvx * wdt, CFG.pathLeft + 12, CFG.pathRight - 12); e.d -= e.rvy * wdt;
      e.obj.setRotation(e.spin);
      if (Math.random() < 0.5) { this.burst.setParticleTint(0x8d6e63); this.burst.explode(1, e.x, e.y + 8); }
      const hit = this.soldiers.find(s => Math.hypot(s.x - e.x, s.y - e.y) < 15);
      if (hit) {
        Sound.play('slam'); this.shake(160, 0.008);
        hit.img.setTint(0xff8a80); this.time.delayedCall(90, () => { if (hit.img.active) hit.img.setTint(this.armorTint); });
        this.lose(R.hit, hit);
      }
      if (hit || e.rolling <= 0 || e.y > backRow + 12) this.endRoll(e, R);
      return true;
    }
    if (e.wind) {
      e.wind -= ms;
      const f = 1 - e.wind / R.windMs, dx = e.tx - e.x, dy = e.ty - e.y, len = Math.hypot(dx, dy) || 1;
      e.obj.setRotation(Math.sin(this.time.now * 0.06) * 0.25);
      e.obj.setTint(Phaser.Display.Color.GetColor(255, 255 - 110 * f, 255 - 200 * f));
      const reach = Math.min(len + 40, R.speed * R.ms / 1000), ex = e.x + dx / len * reach, ey = e.y + dy / len * reach;
      this.rollG.lineStyle(22, 0xff6d00, 0.12 + 0.2 * f).lineBetween(e.x, e.y, ex, ey).lineStyle(3, 0xffab40, 0.5 + 0.4 * f).lineBetween(e.x, e.y, ex, ey);
      if (e.wind <= 0) {
        e.wind = 0; e.rolling = R.ms; e.obj.clearTint();
        e.rvx = dx / len * R.speed; e.rvy = dy / len * R.speed;
        Sound.play('roll');
      }
      return true;
    }
    if (e.rollT === undefined) e.rollT = R.every[0] + Math.random() * (R.every[1] - R.every[0]);
    if (e.hold || e.splitSide) return false;
    e.rollT -= ms;
    if (e.rollT > 0 || e.y < 40 || e.y > backRow - 70) return false;
    e.wind = R.windMs; e.tx = this.armyX; e.ty = this.formY;       // aimed at where the army is now
    e.obj.setTexture('iwagameBall');
    this.fxDust(e.x, e.y + 8, 2);
    return true;
  }
  endRoll(e, R) {
    e.rolling = 0; e.rollT = R.every[0] + Math.random() * (R.every[1] - R.every[0]);
    e.strike = CFG.enemy[e.kind].strikeMs;
    if (e.obj.active) e.obj.setTexture(e.kind).setRotation(0);
  }

  // Weapon rows: decided as the row nears (the Range card must be high enough by then); the red gate is swapped for a
  // weapon behind two logs or stone walls. Their health is reset every frame until the army can reach them, so it matches
  // the army as it is when the obstacles arrive.
  updateWeapons() {
    const C = CFG.weapon;
    this.gates.forEach(g => {
      if (!(g.weaponRow || g.logRow) || g.weaponDone || g.y < -330) return;
      g.weaponDone = true;
      if (Save.range < C.minRange) return;
      const bad = g.left.good ? g.right : g.left, side = g.weaponRow ? bad : g.left.good ? g.left : g.right, mat = this.L.saga > 0 && Save.range >= C.stoneRange ? 'stone' : 'log';     // saga 1 is always logs (owner)
      side.walls = []; side.mat = mat; g.blocked = side;
      const leads = g.weaponRow || Math.random() < 0.5 ? [CFG.wall.lead + C.gap, CFG.wall.lead] : [CFG.wall.lead];     // nearest the army first
      if (g.weaponRow) {
      side.obj.destroy();
      const glow = this.img(0, -4, 'glow').setBlendMode(Phaser.BlendModes.ADD).setTint(0xffd54f);
      const blade = this.img(0, 0, 'katana').setOrigin(0.5, 0.6).setRotation(0.5);
      const tag = this.txt(0, -58, 'WEAPON', 15, '#ffd54f', { stroke: '#3a2400', strokeThickness: 4 });
      side.obj = this.add.container(side.x, -200, [glow, blade, tag]);
      Object.assign(side, { weapon: true, glow, blade });
      }
      leads.forEach(lead => side.walls.push(this.addObstacle(side.x, g.d - lead, mat, g.weaponRow)));
    });
    // Health tracks the army until they can cut at it.
    const n = Math.min(this.count, CFG.maxDrawn), dps = n * this.bladeDmg() * 1000 / this.swingMs();
    const speed = CFG.baseSpeed * this.L.pace * (1 + CFG.speedRamp * this.dist / this.L.length) * this.speedMod;
    const cutFrom = Math.max(CFG.wall.range, this.reachNow()) - 26;          // distance over which the first one can be cut before it blocks
    const groups = this.gates.filter(g => g.blocked && !g.used).map(g => g.blocked);
    if (this.split && !this.split.done) groups.push(this.split);
    groups.forEach(side => {
      if (side.weapon) {
        const pulse = Math.sin(this.time.now * 0.008);
        side.glow.setScale(S * (1.6 + pulse * 0.2)).setAlpha(0.75 + pulse * 0.2);
        side.blade.setScale(S * 2).setY(Math.sin(this.time.now * 0.005) * 3);
      }
      if (side.locked) return;
      const first = side.walls[0];
      if (first.y > this.formY - cutFrom - 50 || side.walls.some(e => e.hp < e.maxHp)) { side.locked = true; return; }
      // Time the army has, less the time it will spend cutting down the enemies that arrive in the meantime.
      const foes = this.enemies.reduce((sum, e) => sum + (!e.r && !e.gone && !e.splitSide && e.y > first.y - CFG.weapon.gap - 150 ? Math.max(0, e.hp) : 0), 0);
      const time = (cutFrom + (side.gap || CFG.weapon.gap) * (side.walls.length - 1)) / speed;
      const total = (side.margin || CFG.weapon.margin[side.mat]) * dps * Math.max(0.3 * time, time - foes / Math.max(1, dps));
      side.walls.forEach(e => { e.hp = e.maxHp = Math.max(CFG.weapon.minHp, Math.round(total / side.walls.length)); this.wallLabel(e); });
    });
  }

  // The army reached a weapon: one random boost for the rest of the run, unless an obstacle in front of it still stands.
  pickWeapon(side, other) {
    this.tweens.add({ targets: other.obj, alpha: 0.25, duration: 220 });
    if (side.walls.some(e => e.hp > 0 && !e.gone)) { this.float(this.armyX, this.formY - 40, 'MISSED', '#cfd8dc', 22); return; }
    this.grantBoost();
    this.tweens.add({ targets: side.obj, alpha: 0, duration: 260 });
  }

  grantBoost(note) {
    const C = CFG.weapon;
    const kinds = [['dmg', 'SHARP BLADE', 'damage +' + Math.round(C.dmg * 100) + '% for this run'],
      ['speed', 'SWIFT BLADE', 'swings ' + Math.round(C.speed * 100) + '% faster for this run'],
      ['range', 'LONG REACH', 'Range +' + C.rangeLevels + ' for this run']].filter(k => k[0] !== 'range' || this.reachNow() < CFG.rangeMax);
    const [key, title, sub] = kinds[Math.floor(Math.random() * kinds.length)];
    this.boost[key]++;
    this.lastWeapon = key;
    this.banner(title, note || sub);
    this.float(this.armyX, this.formY - 40, title, '#ffd54f', 24);
    this.cameras.main.flash(160, 255, 200, 60);
    Sound.play('buy'); this.shake(160, 0.006);
  }

  // The cage's reward: the run pauses and the player takes one free, permanent level of any upgrade card.
  offerUpgrade() {
    if (this.over || this.paused) { if (!this.over) this.time.delayedCall(300, () => this.offerUpgrade()); return; }
    this.paused = true; this.time.paused = true; this.tweens.pauseAll();
    const before = new Set(this.children.list);
    this.add.rectangle(W / 2, H / 2, W, H, 0x05020c, 0.55).setInteractive();
    const g = this.add.graphics();
    g.fillStyle(0x1c1220, 0.97).fillRoundedRect(10, 196, 380, 290, 14).lineStyle(3, 0xffd54f, 0.9).strokeRoundedRect(10, 196, 380, 290, 14);
    this.txt(W / 2, 226, 'CIVILIANS FREED!', 24, '#ffd54f', { stroke: '#2a0a14', strokeThickness: 5 });
    this.txt(W / 2, 256, 'They thank you. Choose one FREE upgrade:', 13, '#fff3e0', { fontStyle: 'normal', fit: 336 });
    this.freePick = key => {
      if (key === 'range' && Stats.rangeMaxed()) { Sound.play('deny'); return; }
      Save[key]++; Save.save(); Sound.play('buy');
      ui.forEach(o => o.destroy());
      this.freePick = null;
      this.paused = false; this.time.paused = false; this.tweens.resumeAll();
      this.banner({ fire: 'ATTACK SPEED', damage: 'BLADE DAMAGE', range: 'RANGE', revenue: 'COIN REWARD' }[key] + ' UP!', 'now level ' + Save[key] + ', for good');
      this.cameras.main.flash(200, 255, 214, 110);
    };
    [['fire', 'ATTACK\nSPEED', 0x2e7d32], ['damage', 'BLADE\nDAMAGE', 0x1565c0], ['range', 'RANGE', 0xc62828], ['revenue', 'COIN\nREWARD', 0x6a1b9a]].forEach(([key, title, color], i) => {
      const x = 59 + i * 94, y = 372, w = 86, h = 170, maxed = key === 'range' && Stats.rangeMaxed();
      g.fillStyle(0x120b18, 1).fillRoundedRect(x - w / 2, y - h / 2, w, h, 12);
      g.fillStyle(color, 1).fillRoundedRect(x - w / 2, y - h / 2, w, 36, { tl: 12, tr: 12, bl: 0, br: 0 });
      g.lineStyle(2, 0xffffff, 0.25).strokeRoundedRect(x - w / 2, y - h / 2, w, h, 12);
      this.txt(x, y - h / 2 + 18, title, 11, '#fff', { align: 'center', lineSpacing: -2, fit: 72 });
      this.txt(x, y - 22, 'Lv ' + Save[key], 15, '#cfc3d6');
      this.txt(x, y + 4, maxed ? 'MAX' : '▼\nLv ' + (Save[key] + 1), 18, '#ffe082', { align: 'center', lineSpacing: -4 });
      const b = this.button(x, y + 56, 76, 40, maxed ? 0x4a4250 : color, maxed ? 'MAX' : 'FREE', 15, () => this.freePick(key));
      if (maxed) b.t.setColor('#9a90a0');
    });
    const ui = this.children.list.filter(o => !before.has(o));
    ui.forEach((o, i) => o.setDepth(7000 + i));
  }

  // The split path: keeps the army and that row's enemies on their own sides of the fence, and opens the cage.
  updateSplit() {
    const sp = this.split, C = CFG.split;
    if (!sp || sp.done) return;
    const nearY = CFG.armyY - (sp.dA - this.dist), farY = CFG.armyY - (sp.dB - this.dist);        // the fence's two ends on screen
    if (!sp.seen && nearY > 60) { sp.seen = true; this.banner('THE ROAD SPLITS', (sp.mat === 'log' ? 'logs' : 'stone') + ' and a rescue, or the enemies'); }
    if (farY > this.formY + 40) { sp.done = true; this.splitSide = 0; return; }                // behind the army now
    const beside = nearY >= this.formY - 36;
    if (beside && !this.splitSide) this.splitSide = this.armyX < W / 2 ? -1 : 1;
    if (!beside) return;
    const cg = sp.cage;
    if (!sp.freed && this.splitSide === sp.logSide && cg.y >= this.formY - 44 && !sp.walls.some(e => e.hp > 0 && !e.gone)) {
      sp.freed = true;
      Save.civilians += C.civilians; Save.save();
      this.banner('CIVILIANS FREED', 'the lock snaps: ' + C.civilians + ' saved!');
      this.cameras.main.flash(160, 255, 200, 60); this.shake(160, 0.006);
      this.time.delayedCall(650, () => this.offerUpgrade());
      this.float(cg.x, cg.y - 46, '+' + C.civilians + ' SAVED', '#a5d6a7', 22);
      Sound.play('wallBreak');
      this.tweens.add({ targets: cg.obj, alpha: 0.35, duration: 300 });
      for (let i = 0; i < C.civilians; i++) {                // they run back the way the army came
        const v = this.img(cg.x + (Math.random() - 0.5) * 70, cg.y - 6 + Math.random() * 14, 'civilian').setScale(S).setDepth(2800).setTint([0xffffff, 0xcfe8ff, 0xffe0b2, 0xd7ffd9][i % 4]);
        this.tweens.add({ targets: v, x: clamp(v.x + (Math.random() - 0.5) * 60, 80, 320), y: H + 40, delay: i * 70, duration: 1500 + Math.random() * 500, ease: 'Sine.in', onComplete: () => v.destroy() });
      }
    }
  }
  // While an obstacle is shoving the army: a red line where the clan dies, the screen reddening as they near it, and an alarm.
  drawCrush(blocked) {
    const g = this.crushG; g.clear();
    this.crushShow = (this.crushShow || 0) + ((blocked ? 1 : 0) - (this.crushShow || 0)) * 0.15;
    const a = this.crushShow;
    if (a < 0.02) { this.crushText.setVisible(false); return; }
    const C = CFG.wall, near = clamp((this.formY - CFG.armyY) / (C.crushY - CFG.armyY), 0, 1);       // 0: just blocked, 1: at the line
    const beat = 0.5 + 0.5 * Math.sin(this.time.now * (0.008 + near * 0.022)), ly = C.crushY + 14;
    g.fillStyle(0xff1744, a * (0.12 + near * 0.3) * (0.6 + beat * 0.4)).fillRect(0, 0, W, H);          // the whole screen reddens
    for (let i = 0; i < 6; i++) g.fillStyle(0xd50000, a * (0.5 - i * 0.07)).fillRect(0, ly + i * 8, W, 8);
    g.lineStyle(4, 0xff5252, a * (0.6 + beat * 0.4)).lineBetween(0, ly, W, ly);
    for (let x = 8; x < W; x += 24) g.fillStyle(0xffffff, a * 0.9).fillTriangle(x, ly, x + 8, ly - 12 - beat * 4, x + 16, ly);   // teeth along it
    this.crushText.setVisible(true).setAlpha(a * (0.5 + beat * 0.5)).setPosition(W / 2, CFG.armyY - 150).setText(near > 0.55 ? 'BREAK IT NOW!' : 'BREAK IT OR BE CRUSHED!').setScale(1 + near * 0.25 * beat);
    if (blocked) {
      this.crushBeep = (this.crushBeep || 0) - 1;
      if (this.crushBeep <= 0) { this.crushBeep = 34 - near * 24; Sound.play('warn'); }
    }
  }

  // Steering limits: the army keeps to its side of the fence.
  steerClamp(x) {
    const e = CFG.split.edge;
    return this.splitSide < 0 ? Math.min(x, e) : this.splitSide > 0 ? Math.max(x, W - e) : x;
  }

  updateHazards(wdt) {
    this.updateSplit();
    this.updateWeapons();
    // Lucky charms slide from side to side and glow.
    this.enemies.forEach(e => {
      if (e.kind !== 'charm' || e.gone) return;
      e.x += e.vx * wdt;
      if (e.x < 85 || e.x > 315) { e.x = clamp(e.x, 85, 315); e.vx = -e.vx; }
      const pulse = Math.sin(this.time.now * 0.008 + e.seed);
      e.glow.setScale(S * (1.5 + pulse * 0.2)).setAlpha(0.8 + pulse * 0.2);
      e.sprite.setRotation(Math.sin(this.time.now * 0.012 + e.seed) * 0.12);
    });
    // Stone walls: a warning as one comes into view, a red pulse as it closes in, then it blocks and pushes.
    let blocked = null;
    this.enemies.forEach(e => {
      if (e.kind !== 'wall' || e.gone || e.hp <= 0 || e.passed) return;
      if (e.forWeapon) { if (!this.weaponSeen && e.y > 120) { this.weaponSeen = true; this.banner('WEAPON AHEAD', 'cut through for a boost, or take the blue gate'); } }
      else if (e.weaponWall) { if (!this.logSeen && e.y > 120) { this.logSeen = true; this.banner(e.mat === 'log' ? 'LOGS AHEAD' : 'STONE AHEAD', 'break through or go around'); } }
      else if (!this.wallSeen && e.y > 120) { this.wallSeen = true; this.banner('STONE WALL', 'break it or go around'); }
      const close = e.y > this.formY - 110;
      e.label.setColor(close && Math.sin(this.time.now * 0.025) > 0 ? '#ff5252' : '#fff');
      if (e.y < this.formY - 26) return;
      if (Math.abs(this.armyX - e.x) >= CFG.wall.half || e.y > this.formY + 10) { if (e.y > this.formY + 10) e.passed = true; return; }   // around it
