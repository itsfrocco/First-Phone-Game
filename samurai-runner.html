<script>
'use strict';

/* ============================================================
   CONFIG — every tuning number lives here
   ============================================================ */
const W = 400, H = 720;
const R = Math.min(3, Math.max(1, Math.round(window.devicePixelRatio || 1)));
const S = 1 / R;
const FONT = '"Trebuchet MS", "Avenir Next", "Segoe UI", system-ui, sans-serif';

const CFG = {

  maxDrawn: 20,
  armyY: 560,
  pathLeft: 60, pathRight: 340,
  steerMin: 78, steerMax: 322,
  baseSpeed: 90,

  attackRange: 38,
  slowScale: 0.30,
  slowMs: 4000,
  specialMax: 36,
  specialsPerLevel: 2.7,
  charmDamageUp: 1.10,
  bossSlow: 0.97,
  shake: 0.4,
  enemy: {
    reach: 16,
    demonShare: 0.25,

    zombie: { speed: 38, hit: 0.22, strikeMs: 1100 },
    demon:  { speed: 55, hit: 0.42, strikeMs: 900 },
    rockOni: { speed: 44, hit: 0.30, strikeMs: 1000 },
  },
  bosses: {
    demon: { key: 'boss', name: 'FAT DEMON', slain: 'DEMON SLAIN', r: 50, souls: 40, speed: 60, chaseMs: 930, windMs: 600, recoverMs: 330,
      reach: 85, cleave: 4, cleaveShare: 0.10, powerChance: 0.35, powerWindMs: 1070, powerReach: 100, powerMult: 2, powerStyle: 'jump' },
    giant: { key: 'giant', name: 'GIANT ZOMBIE', slain: 'GIANT SLAIN', r: 44, souls: 20, speed: 40, chaseMs: 1400, windMs: 900, recoverMs: 500,
      reach: 85, cleave: 2, cleaveShare: 0.05, powerChance: 0, trickle: true, trickleMs: 1500 },
    thunder: { key: 'thunder', name: 'TAKEMIKAZUCHI', slain: 'THE THUNDER GOD FALLS', r: 48, souls: 150, speed: 68, chaseMs: 1070, windMs: 690, recoverMs: 470,
      reach: 85, cleave: 3, cleaveShare: 0.06, combo: 2, phase2Combo: 3, comboWindMs: 510, comboStep: 45,
      powerChance: 0.25, powers: [['bolt'], ['bolt', 'dash']], powerWind: { bolt: 1200, dash: 640 }, powerReach: 85, boltHalf: 48, powerMult: 2,
      phase2: 0.5, phase2Haste: 1.33, phase2Name: 'THE STORM AWAKENS', powerUpMs: 2400, powerUpHeal: 0.2, linger: 1000, lingerTick: 500, lingerShare: 0.03 },
    rock: { key: 'rockBoss', name: 'ROCK ONI', slain: 'ROCK ONI SLAIN', r: 50, souls: 60, speed: 46, chaseMs: 1300, windMs: 950, recoverMs: 600,
      reach: 90, cleave: 5, cleaveShare: 0.12, powerChance: 0.3, powerWindMs: 1300, powerReach: 120, powerMult: 2, powerStyle: 'jump' },
    tengu: { key: 'tenguBoss', name: 'TENGU', slain: 'TENGU SLAIN', r: 46, souls: 35, speed: 40, chaseMs: 1400, windMs: 900, recoverMs: 500,
      reach: 85, cleave: 3, cleaveShare: 0.08, powerChance: 0.45, powerWindMs: 1600, powerReach: 100, powerMult: 2, powerStyle: 'fly' },
  },
  charm: { speed: 70, lead: 110, souls: 15 },
  wall: { lead: 64, range: 200, half: 66, souls: 5 },
  storm: { everyMs: [4000, 5000], warnMs: 1100, sweepMs: 380, half: 52, cleave: 2, cleaveShare: 0.08 },
  thunderBlade: { strong: ['water', 'metal', 'flying'], strongBonus: 0.15, weak: ['earth', 'fire', 'thunder'], weakPenalty: 0.15 },
  levelPace: 0.10,
};

const LEVEL_SPECS = [
  { name: 'Restless Dead', demons: false, rows: 10, seg: 370, pack: [3, 1.2, 0.20], crowd: 0.05, hp: 3, walls: [[6], 22, 0],
    bosses: [{ type: 'giant', after: 'end', hp: 400 }] },
  { name: 'The Tengu', demons: true, rows: 13, seg: 370, pack: [5, 2.4, 0.27], crowd: 0.16, hp: 5, charms: [[4, 10], 8, 3], walls: [[3, 8, 11], 38, 16],
    bosses: [{ type: 'giant', after: 6, hp: 700 }, { type: 'tengu', after: 'end', hp: 1400 }] },
  { name: 'The Fat Demon', demons: true, rows: 18, seg: 370, pack: [6, 2.4, 0.16], crowd: 0.14, hp: 8, charms: [[5, 11, 15], 11, 4], walls: [[3, 7, 10], 48, 24],
    bosses: [{ type: 'giant', after: 8, hp: 1800 }, { type: 'demon', after: 'end', hp: 3000 }] },
  { name: 'Takemikazuchi', demons: true, storm: true, rows: 8, seg: 370, pack: [5, 2.4, 0.30], crowd: 0.15, hp: 8, pace: 1.2, charms: [[4], 11, 0], walls: [[3, 6], 38, 20],
    bosses: [{ type: 'thunder', after: 'end', hp: 2600 }] },
  { name: 'The Rock Oni', theme: 'mountain', foe: 'rockOni', demons: false, rows: 14, seg: 370, pack: [7, 3.0, 0.26], crowd: 0.15, hp: 13, charms: [[5, 10], 14, 4], walls: [[3, 7, 10], 70, 30],
    bosses: [{ type: 'rock', after: 'end', hp: 6000 }] },
];

const GEAR = {
  armor: [
    { id: '', name: 'Clan Armor', effect: 'Standard issue.' },
    { id: 'thunder', name: 'Thunder Armor', boss: true, effect: 'Halves lightning damage.' },
  ],
  weapon: [
    { id: '', name: 'Clan Katana', effect: 'A trusty blade.' },
    { id: 'thunder', name: 'Futsu-no-mitama', boss: true, effect: '+15% damage to flying, armoured and water foes.' },
  ],
  necklace: [
    { id: '', name: 'No Necklace', effect: 'None found yet.' },
  ],
};
const GEAR_SLOTS = [['weapon', 'WEAPON'], ['armor', 'ARMOR'], ['necklace', 'NECKLACE']];
const ELEMENT = { tenguBoss: 'flying', thunder: 'metal' };
const SAGA_LEVELS = 3;
const GOOD_GATES = ['+3', '+3', 'x2', '+4', '+5', '+6', 'x2', '+8', '+10', '+12', '+14', '+16', '+18', '+20', '+22', '+25', '+28', '+30'];

function layoutLevel(spec, index) {
  const L = { name: spec.name, demons: spec.demons, charms: spec.charms || [[], 0, 0], walls: spec.walls || [[], 0, 0], gates: [], packs: [], spikes: [], bosses: [] };
  L.theme = spec.theme || ''; L.foe = spec.foe || 'zombie';
  L.storm = !!spec.storm;
  L.pace = spec.pace || 1 + CFG.levelPace * (index % (SAGA_LEVELS + 1));
  let d = 300;
  const hp = spec.hp;
  for (let i = 0; i < spec.rows; i++) {
    const good = GOOD_GATES[i];
    L.gates.push({ d, bad: { op: '-', n: Math.round(2 + i * 1.5) }, good: { op: good[0], n: +good.slice(1) } });
    L.packs.push({ d: d + (i ? 150 : 420), n: Math.round(spec.pack[0] + spec.pack[1] * i + spec.pack[2] * i * i), gap: 14 / (1 + spec.crowd * i), hp });
    if (i % 2 === 1 || i > spec.rows * 0.6) L.spikes.push(d + spec.seg / 2);
    d += spec.seg;
    const mid = spec.bosses.find(b => b.after === i);
    if (mid) { L.bosses.push({ type: mid.type, hp: mid.hp, at: d + 200, trickleHp: hp }); d += 630; }
  }
  const end = spec.bosses.find(b => b.after === 'end');
  if (end) { L.bosses.push({ type: end.type, hp: end.hp, at: d + 200, trickleHp: hp }); d += 200; }
  L.length = d + 100;
  return L;
}
const LEVELS = LEVEL_SPECS.map(layoutLevel);
const SAGAS = ['Bamboo Road', 'Mountain Pass', 'Frozen Pass', 'Ember Fortress', 'Demon Gate'];

const Save = {
  souls: 0, fire: 1, damage: 1, revenue: 1,
  level: 1,
  music: true, sfx: true, shake: true,
  armor: '', weapon: '', necklace: '',
  load() {
    const num = (k, def) => {
      try { const v = parseInt(localStorage.getItem(k), 10); return Number.isFinite(v) ? v : def; }
      catch (e) { return def; }
    };
    this.souls = num('samurai_souls', 0);
    this.fire = num('samurai_fire', 1);
    this.damage = num('samurai_damage', 1);
    this.revenue = num('samurai_revenue', 1);
    this.level = num('samurai_level', 1);
    this.music = num('samurai_music', 1) === 1;
    this.sfx = num('samurai_sfx', 1) === 1;
    this.shake = num('samurai_shake', 1) === 1;
    try { this.armor = localStorage.getItem('samurai_armor') || ''; this.weapon = localStorage.getItem('samurai_weapon') || ''; this.necklace = localStorage.getItem('samurai_necklace') || ''; } catch (e) {}
  },
  save() {
    try {
      localStorage.setItem('samurai_souls', this.souls);
      localStorage.setItem('samurai_fire', this.fire);
      localStorage.setItem('samurai_damage', this.damage);
      localStorage.setItem('samurai_revenue', this.revenue);
      localStorage.setItem('samurai_level', this.level);
      localStorage.setItem('samurai_music', this.music ? 1 : 0);
      localStorage.setItem('samurai_sfx', this.sfx ? 1 : 0);
      localStorage.setItem('samurai_shake', this.shake ? 1 : 0);
      localStorage.setItem('samurai_armor', this.armor);
      localStorage.setItem('samurai_weapon', this.weapon);
      localStorage.setItem('samurai_necklace', this.necklace);
    } catch (e) {}
  },
  resetProgress() { this.souls = 0; this.fire = this.damage = this.revenue = this.level = 1; this.armor = this.weapon = this.necklace = ''; this.save(); },
};
Save.load();
window.addEventListener('pagehide', () => Save.save());
document.addEventListener('visibilitychange', () => { if (document.hidden) Save.save(); });

const Stats = {
  cost: lvl => Math.floor(40 * Math.pow(1.55, lvl - 1)),
  attackMs: () => Math.max(180, 400 - Save.fire * 25),
  damage: () => 1 + (Save.damage - 1) * 0.5,
  soulsPerKill: () => 1.5 * Save.revenue,
};
const coins = n => n >= 1e6 ? (Math.floor(n / 1e5) / 10) + 'M' : n >= 1000 ? (Math.floor(n / 100) / 10) + 'K' : String(n);
const fmt = n => Number.isInteger(n) ? String(n) : n.toFixed(2).replace(/0$/, '');
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const damp = (rate, dt) => 1 - Math.exp(-rate * dt);

const Sound = {
  ctx: null, last: {},
  muted: (() => { try { return localStorage.getItem('samurai_muted') === '1'; } catch (e) { return false; } })(),
  unlock() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    const c = this.ctx = new AC();
    this.master = c.createGain(); this.master.gain.value = this.muted ? 0 : 1; this.master.connect(c.destination);
    this.sfx = c.createGain(); this.sfx.connect(this.master);
    this.mus = c.createGain(); this.mus.connect(this.master);
    this.applyOptions();
    this.noiseBuf = c.createBuffer(1, c.sampleRate, c.sampleRate);
    const d = this.noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    setInterval(() => Music.tick(), 50);
  },
  applyOptions() {
    if (!this.ctx) return;
    this.sfx.gain.value = Save.sfx ? 0.5 : 0;
    this.mus.gain.value = Save.music ? 0.32 : 0;
  },
  setMuted(m) {
    this.muted = m;
    try { localStorage.setItem('samurai_muted', m ? '1' : '0'); } catch (e) {}
    if (this.ctx) this.master.gain.value = m ? 0 : 1;
  },
  env(g, t, vol, dur, attack) {
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(vol, t + (attack || 0.005));
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  },
  tone(o) {
    const c = this.ctx, t = o.at || c.currentTime;
    const osc = c.createOscillator(), g = c.createGain();
    osc.type = o.type || 'sine';
    osc.frequency.setValueAtTime(o.f, t);
    if (o.to) osc.frequency.exponentialRampToValueAtTime(o.to, t + o.dur);
    this.env(g, t, o.vol || 0.2, o.dur, o.attack);
    osc.connect(g); g.connect(this.sfx);
    osc.start(t); osc.stop(t + o.dur + 0.05);
  },
  noise(o) {
    const c = this.ctx, t = o.at || c.currentTime;
    const src = c.createBufferSource(), g = c.createGain(), f = c.createBiquadFilter();
    src.buffer = this.noiseBuf;
    f.type = o.type || 'lowpass';
    f.frequency.setValueAtTime(o.f || 1000, t);
    if (o.to) f.frequency.exponentialRampToValueAtTime(o.to, t + o.dur);
    this.env(g, t, o.vol || 0.2, o.dur);
    src.connect(f); f.connect(g); g.connect(this.sfx);
    src.start(t); src.stop(t + o.dur + 0.05);
  },
  play(name) {
    if (!this.ctx || this.muted || !Save.sfx) return;
    const now = this.ctx.currentTime * 1000;
    if (this.last[name] && now - this.last[name] < (this.gaps[name] || 40)) return;
    this.last[name] = now;
    (this.sounds[name] || this.sounds.slash)(this, Math.random() * 0.3 + 0.85);
  },
  gaps: { slash: 45, soul: 60, claw: 70, kill: 40, lose: 60 },
  sounds: {
    slash: (S, r) => S.noise({ type: 'highpass', f: 1800 * r, dur: 0.08, vol: 0.25 }),
    kill: (S, r) => { S.tone({ f: 520 * r, to: 180, dur: 0.12, vol: 0.18 }); S.noise({ type: 'bandpass', f: 900, dur: 0.1, vol: 0.2 }); },
    soul: (S, r) => S.tone({ f: 880 * r, to: 1760, dur: 0.14, vol: 0.12, type: 'triangle' }),
    gateGood: (S, r) => S.tone({ f: 660 * r, to: 990, dur: 0.18, vol: 0.16 }),
    gateBad: (S, r) => S.tone({ f: 220 * r, to: 110, dur: 0.22, vol: 0.2 }),
    claw: (S, r) => S.noise({ type: 'bandpass', f: 600 * r, dur: 0.1, vol: 0.3 }),
    lose: (S, r) => S.tone({ f: 180 * r, to: 60, dur: 0.3, vol: 0.25 }),
    slam: (S, r) => { S.noise({ type: 'lowpass', f: 400 * r, to: 80, dur: 0.35, vol: 0.5 }); S.tone({ f: 80, to: 40, dur: 0.3, vol: 0.4 }); },
    wallBreak: (S, r) => { S.noise({ type: 'lowpass', f: 1400 * r, to: 200, dur: 0.4, vol: 0.5 }); S.tone({ f: 150, to: 50, dur: 0.3, vol: 0.5 }); },
    spike: (S, r) => S.noise({ type: 'highpass', f: 2500 * r, dur: 0.06, vol: 0.2 }),
    dodge: (S, r) => S.tone({ f: 440 * r, to: 660, dur: 0.1, vol: 0.1, type: 'triangle' }),
  },
};

const Music = {
  set(name) { this.mode = name; this.step = 0; },
  tick() {
    if (!Sound.ctx || Sound.muted || !Save.music) return;
    const t = Sound.ctx.currentTime;
    if (this.mode === 'storm') {
      if (this.step % 16 === 0) Sound.tone({ f: 55, dur: 0.4, vol: 0.15, type: 'sawtooth', at: t });
      if (this.step % 8 === 4) Sound.noise({ type: 'lowpass', f: 300, dur: 0.15, vol: 0.08, at: t });
    } else {
      if (this.step % 8 === 0) Sound.tone({ f: 110, dur: 0.2, vol: 0.06, type: 'triangle', at: t });
      if (this.step % 16 === 8) Sound.tone({ f: 165, dur: 0.15, vol: 0.05, type: 'triangle', at: t });
    }
    this.step++;
  },
};

class BaseScene extends Phaser.Scene {
  constructor(key) { super(key); }
  setupCamera() {
    this.scale.setZoom(1);
    this.cameras.main.setBackgroundColor(0x120c14);
  }
  txt(x, y, text, size, color, style) {
    return this.add.text(x, y, text, Object.assign({ fontFamily: FONT, fontSize: size, color, fontStyle: 'bold' }, style || {})).setOrigin(0.5);
  }
  img(x, y, key) { return this.add.image(x, y, key).setScale(S); }
  shake(ms, mag) {
    if (!Save.shake) return;
    this.cameras.main.shake(ms, mag * CFG.shake);
  }
  float(x, y, text, color, size) {
    const t = this.add.text(x, y, text, { fontFamily: FONT, fontSize: size || 18, color, fontStyle: 'bold' }).setOrigin(0.5).setDepth(5000);
    this.tweens.add({ targets: t, y: y - 40, alpha: 0, duration: 700, onComplete: () => t.destroy() });
  }
  banner(title, sub) {
    const g = this.add.container(W / 2, 180).setDepth(4000);
    const bg = this.add.rectangle(0, 0, 340, 70, 0x000000, 0.6);
    const t1 = this.add.text(0, -12, title, { fontFamily: FONT, fontSize: 22, color: '#fff', fontStyle: 'bold' }).setOrigin(0.5);
    const t2 = this.add.text(0, 16, sub, { fontFamily: FONT, fontSize: 14, color: '#ddd' }).setOrigin(0.5);
    g.add([bg, t1, t2]);
    this.tweens.add({ targets: g, alpha: 0, delay: 1800, duration: 400, onComplete: () => g.destroy() });
  }
}

class GameScene extends BaseScene {
  constructor() { super('Game'); }
  init(data) {
    this.levelNo = clamp((data && data.level) || 1, 1, LEVELS.length);
    this.L = LEVELS[this.levelNo - 1];
  }

  create() {
    this.setupCamera();
    this.dist = 0;
    this.speedMod = 1;
    this.dmgMod = 1;
    this.timeScale = 1;
    this.slowLeft = 0;
    this.charge = 0;
    this.count = CFG.startArmy;
    this.earned = 0;
    this.wound = 0;
    this.over = false;
    this.gearOpen = null;
    this.bolts = [];
    this.hazards = [];
    this.started = false;
    this.paused = false;
    this.time.paused = false;
    this.crushed = false;
    this.wallSeen = false;
    this.fight = false;
    this.boss = null;
    this.finaleDone = false;
    this.targetX = W / 2;
    this.armyX = W / 2;
    this.formY = 440;
    this.soldiers = [];
    this.enemies = [];
    this.gates = [];
    this.spikes = [];
    this.decor = [];

    Music.set(this.L.storm ? 'storm' : 'run');
    this.applyGear();
    this.buildGround();
    this.buildLevel();
    this.buildFx();
    this.buildHud();
    this.syncArmy(true);
    this.sagaPos = (this.levelNo - 1) % (SAGA_LEVELS + 1);
    this.isSagaBoss = this.sagaPos === SAGA_LEVELS;
    this.stageName = this.isSagaBoss ? 'SAGA BOSS' : 'LEVEL ' + (this.sagaPos + 1);
    this.banner(this.stageName, this.L.name);
    this.showStartUi();
    this.input.on('pointerdown', p => {
      if (this.started || this.paused || this.gearOpen || p.worldY < 120 || p.worldY > 505 || (p.worldX < 124 && p.worldY < 198)) return;
      this.beginRun();
    });

    const steer = p => {
      if (!this.started) return;
      if (p.worldY > 636 && p.worldX > 280) return;
      if (this.paused || (p.worldY < 84 && p.worldX > 345)) return;
      this.targetX = clamp(p.worldX, CFG.steerMin, CFG.steerMax);
    };
    this.input.on('pointerdown', steer);
    this.input.on('pointermove', steer);
  }

  lightningBonus(e, dmg) {
    if (!this.thunderBlade) return 0;
    const T = CFG.thunderBlade, el = ELEMENT[e.kind];
    return dmg * (T.strong.includes(el) ? T.strongBonus : T.weak.includes(el) ? -T.weakPenalty : 0);
  }

  applyGear() {
    this.thunderArmor = Save.armor === 'thunder';
    this.thunderBlade = Save.weapon === 'thunder';
    this.armorTint = this.thunderArmor ? 0xc9bcff : 0xffffff;
    this.bladeTint = this.thunderBlade ? 0xd9a8ff : 0xffffff;
    (this.soldiers || []).forEach(s => { s.img.setTint(this.armorTint); s.blade.setTint(this.bladeTint); });
  }

  showStartUi() {
    if (this.startUi) this.startUi.forEach(o => o.destroy());
    const before = new Set(this.children.list);
    this.add.rectangle(W / 2, 618, W, 204, 0x0a0610, 0.6);
    const cards = [
      ['fire', 'ATTACK SPEED', 0x2e7d32, (Stats.attackMs() / 1000).toFixed(2) + 's swing'],
      ['damage', 'BLADE DAMAGE', 0x1565c0, fmt(Stats.damage()) + ' per hit'],
      ['revenue', 'COIN REWARD', 0x6a1b9a, fmt(Stats.soulsPerKill()) + ' per kill'],
    ];
    cards.forEach((c, i) => {
      const x = 70 + i * 130;
      const bg = this.add.rectangle(x, 640, 120, 90, 0x1a1220).setStrokeStyle(2, c[2]);
      this.txt(x, 618, c[1], 11, '#fff');
      this.txt(x, 640, c[3], 13, '#fff');
      const cost = Stats.cost(Save[c[0]]);
      const can = Save.souls >= cost;
      const btn = this.add.rectangle(x, 672, 100, 28, can ? c[2] : 0x333).setInteractive();
      this.txt(x, 672, can ? coins(cost) + ' 💜' : 'MAX', 12, '#fff');
      btn.on('pointerdown', () => {
        if (Save.souls < cost) return;
        Save.souls -= cost; Save[c[0]]++; Save.save();
        this.showStartUi();
      });
    });
    this.startUi = this.children.list.filter(o => !before.has(o));
  }

  beginRun() {
    this.started = true;
    if (this.startUi) this.startUi.forEach(o => o.destroy());
    this.startUi = null;
    Sound.unlock();
  }

  buildGround() {
    const mountain = this.L.theme === 'mountain';
    const storm = this.L.storm;
    this.add.rectangle(W / 2, H / 2, W, H, storm ? 0x0a0610 : mountain ? 0x1a140e : 0x1a3a1a);
    this.grass = this.add.tileSprite(W / 2, H / 2, W, H, 'grass').setTint(mountain ? 0x6b5a3a : 0x4a7a3a).setAlpha(0.4);
    this.path = this.add.tileSprite(W / 2, H / 2, 280, H, 'path').setTint(mountain ? 0x5a4a32 : 0x6a5a42);
    if (mountain) {
      this.add.rectangle(30, H / 2, 60, H, 0x3a3228);
      this.add.rectangle(370, H / 2, 60, H, 0x3a3228);
    }
  }

  buildLevel() {
    this.L.gates.forEach((g, i) => {
      const left = this.addGateSide(g.d, true, g.bad, i);
      const right = this.addGateSide(g.d, false, g.good, i);
      this.gates.push({ d: g.d, left, right, used: false });
    });
    this.L.packs.forEach(p => {
      for (let i = 0; i < p.n; i++) {
        const x = 100 + Math.random() * 200;
        const kind = this.L.foe === 'rockOni' ? 'rockOni' : (this.L.demons && Math.random() < CFG.enemy.demonShare ? 'demon' : 'zombie');
        this.addEnemy(kind, x, p.d + i * p.gap, p.hp * (kind === 'demon' ? CFG.enemy.demonHp : 1));
      }
    });
    this.L.spikes.forEach(d => {
      const x = 90 + Math.random() * 220;
      const o = this.img(x, 0, 'spike');
      this.spikes.push({ d, x, obj: o, hit: false });
    });
    const [charmRows, charmHp, charmGrow] = this.L.charms;
    charmRows.forEach((row, idx) => {
      const gate = this.L.gates[row];
      if (!gate) return;
      const x = 120 + Math.random() * 160;
      const e = this.addEnemy('charm', x, gate.d - CFG.charm.lead, charmHp + charmGrow * idx);
      Object.assign(e, { r: 12, souls: CFG.charm.souls });
    });
    const [wallRows, wallHp, wallGrow] = this.L.walls;
    wallRows.forEach((row, idx) => {
      const gate = this.L.gates[row];
      if (!gate) return;
      const side = Math.random() < 0.5 ? 'left' : 'right';
      const x = side === 'left' ? 140 : 260;
      const e = this.addEnemy('wall', x, gate.d - CFG.wall.lead, wallHp + wallGrow * idx);
      Object.assign(e, { r: 20, souls: CFG.wall.souls });
      this.wallLabel(e);
    });
    this.L.bosses.forEach(b => {
      const prof = CFG.bosses[b.type];
      const e = this.addEnemy(b.type, W / 2, b.at, b.hp);
      Object.assign(e, { r: prof.r, souls: prof.souls, prof, hold: true });
      if (!this.boss) this.boss = e;
    });
  }

  addGateSide(d, left, op, idx) {
    const x = left ? 110 : 290;
    const color = op.op === '-' ? 0xff5252 : 0x42a5f5;
    const bg = this.add.rectangle(x, 0, 120, 50, color, 0.7);
    const txt = this.add.text(x, 0, op.op + op.n, { fontFamily: FONT, fontSize: 28, color: '#fff', fontStyle: 'bold' }).setOrigin(0.5);
    const obj = this.add.container(x, 0, [bg, txt]);
    return { d, x, obj, op, good: op.op !== '-', y: 0 };
  }

  addEnemy(kind, x, d, hp) {
    const key = { zombie: 'zombie', demon: 'demon', rockOni: 'rock', charm: 'charm', wall: 'wall', giant: 'giant', thunder: 'thunder', rock: 'rockBoss', tengu: 'tenguBoss' }[kind] || 'zombie';
    const obj = this.img(x, 0, key);
    const e = { kind, x, d, hp, maxHp: hp, obj, gone: false, seed: Math.random() * 1000, r: kind === 'wall' ? 20 : 14 };
    if (kind === 'wall') {
      e.label = this.add.text(x, -30, '', { fontFamily: FONT, fontSize: 14, color: '#fff' }).setOrigin(0.5);
      e.obj = this.add.container(x, 0, [obj, e.label]);
    }
    this.enemies.push(e);
    return e;
  }

  wallLabel(e) { e.label.setText('♥︎ ' + Math.max(1, Math.ceil(e.hp))); }

  buildFx() {
    this.danger = this.add.graphics().setDepth(2000);
    this.boltG = this.add.graphics().setDepth(2100);
    this.burst = this.add.particles(0, 0, 'dot', {
      speed: { min: 40, max: 120 }, scale: { start: 0.6, end: 0 }, lifespan: 400, quantity: 0,
    }).setDepth(3000);
  }

  buildHud() {
    this.soulIcon = this.img(22, 36, 'soul');
    this.soulTxt = this.txt(50, 36, coins(Save.souls), 16, '#fff').setOrigin(0, 0.5);
    this.progBg = this.add.rectangle(W / 2, 36, 160, 10, 0x333);
    this.prog = this.add.rectangle(W / 2 - 80, 36, 0, 10, 0x42a5f5).setOrigin(0, 0.5);
    this.progTxt = this.txt(W / 2, 36, '0%', 11, '#fff');
    this.specialBg = this.add.rectangle(W - 50, H - 40, 80, 24, 0x333);
    this.specialFill = this.add.rectangle(W - 90, H - 40, 0, 24, 0xab47bc).setOrigin(0, 0.5);
    this.specialBtn = this.add.rectangle(W - 50, H - 40, 80, 24, 0x6a1b9a).setInteractive();
    this.txt(W - 50, H - 40, 'SPECIAL', 11, '#fff');
    this.specialBtn.on('pointerdown', () => this.useSpecial());
    this.pauseBtn = this.add.rectangle(W - 28, 36, 40, 28, 0x333).setInteractive();
    this.txt(W - 28, 36, '||', 14, '#fff');
    this.pauseBtn.on('pointerdown', () => this.togglePause());
  }

  update(time, dt) {
    dt /= 1000;
    if (!this.started || this.paused || this.over) return;
    this.updateArmy(time, dt);
    this.updateCombat(dt);
    this.updateEnemies(dt);
    this.updateScroll(dt);
    this.updateHud();
    if (this.count <= 0) this.finish(false);
    else if (this.finaleDone && this.dist >= this.L.length) this.finish(true);
  }

  updateScroll(wdt) {
    if (!this.fight) {
      const speed = CFG.baseSpeed * this.L.pace * (1 + CFG.speedRamp * this.dist / this.L.length) * this.speedMod;
      const step = speed * wdt;
      this.dist += step;
      this.grass.tilePositionY -= step * R;
      this.path.tilePositionY -= step * R;
      this.enemies.forEach(e => { if (e.hold) e.d += step; });
    }
    const place = o => {
      const y = CFG.armyY - (o.d - this.dist);
      o.y = y;
      if (y > H + 80) { o.obj.destroy(); o.gone = true; return; }
      if (y < -120) { if (o.obj.visible) o.obj.setVisible(false); return; }
      const p = this.persp(y);
      const bob = o.seed !== undefined && !o.r && !o.hold && o !== this.boss ? Math.sin(this.time.now * 0.02 + o.seed) * 1.5 : 0;
      o.obj.setVisible(y > -90).setPosition(o.x, y + bob).setScale((o.obj.type === 'Container' ? 1 : S) * p * (o.size || 1)).setDepth(o.flat ? y - 30 : y);
    };
    const alive = o => !o.gone;
    this.decor.forEach(place); this.spikes.forEach(place); this.enemies.forEach(place);
    this.gates.forEach(g => {
      [g.left, g.right].forEach(s => { s.d = g.d; place(s); });
      g.y = g.left.y; g.gone = g.left.gone;
    });
    this.decor = this.decor.filter(alive); this.spikes = this.spikes.filter(alive);
    this.enemies = this.enemies.filter(alive); this.gates = this.gates.filter(alive);
    if (!this.fight && this.boss && this.boss.y >= 330) this.startFight();
  }

  persp(y) { return 0.7 + 0.3 * clamp((y - 60) / 500, 0, 1); }

  updateArmy(time, dt) {
    this.armyX += (this.targetX - this.armyX) * damp(12, dt);
    const wantForm = !this.started ? 440 : this.fight ? this.boss.y + 92 : CFG.armyY;
    this.formY += (wantForm - this.formY) * damp(5, dt);
    const n = this.soldiers.length, cols = Math.min(5, Math.ceil(Math.sqrt(n || 1)));
    this.soldiers.forEach((s, i) => {
      const col = i % cols, row = Math.floor(i / cols);
      const inRow = Math.min(cols, n - row * cols);
      const wx = this.armyX + (col - (inRow - 1) / 2) * 21;
      const wy = this.formY + row * 18;
      const k = damp(16 - row * 2.5, dt);
      const lean = clamp((wx - s.x) * 0.02, -0.25, 0.25);
      s.x += (wx - s.x) * k; s.y += (wy - s.y) * k;
      s.lunge *= 1 - damp(14, dt);
      s.pop += (1 - s.pop) * damp(14, dt);
      const bob = Math.sin(time * 0.018 + i * 1.7) * 1.6;
      s.swing = Math.max(0, s.swing - dt / 0.17);
      const p = this.persp(s.y) * s.pop, y = s.y + bob - s.lunge;
      s.img.setPosition(s.x, y).setRotation(lean).setScale(S * p).setDepth(s.y);
      s.blade.setPosition(s.x + 9.5 * p, y + 5.5 * p).setScale(S * p).setDepth(s.y + 0.5)
        .setRotation(0.45 + lean - Math.sin(s.swing * Math.PI) * 2.4);
    });
  }

  updateCombat(dt) {
    const cd = Stats.attackMs(), dmg = Stats.damage() * this.dmgMod;
    const near = this.enemies.filter(e => e.y > 250 && e.y < H);
    this.soldiers.forEach(s => {
      s.cd -= dt * 1000;
      if (s.cd > 0) return;
      let best = null, bestD = CFG.attackRange;
      near.forEach(e => {
        if (e.hp <= 0) return;
        if (e.kind === 'wall') {
          if (bestD >= CFG.attackRange && e.y > this.formY - CFG.wall.range && e.y < this.formY && Math.abs(this.armyX - e.x) < CFG.wall.half) best = e;
          return;
        }
        const d = e === this.boss && this.fight ? (Math.abs(s.x - e.x) < e.prof.reach + 10 ? 0 : Infinity) : Math.hypot(e.x - s.x, e.y - s.y) - e.r;
        if (d < bestD) { bestD = d; best = e; }
      });
      if (!best) return;
      s.cd = cd * (0.9 + Math.random() * 0.2);
      s.lunge = 7; s.swing = 1;
      if (best.kind === 'wall') this.airSlash(s, best);
      this.strike(best, dmg + this.lightningBonus(best, dmg), s);
      if (this.thunderBlade && Math.random() < 0.6) this.zap(s.x + 9, s.y - 12, best.x, best.y, 90);
    });
  }

  strike(e, dmg, s) {
    if (e.powering) return;
    if (e.air) {
      if (Math.random() < 0.4) this.float(e.x + (Math.random() - 0.5) * 70, e.y - 10 - Math.random() * 30, 'MISS', '#cfd8dc', 13);
      return;
    }
    e.hp -= dmg;
    Sound.play('slash');
    const spread = e.r ? e.r * 0.6 : 4;
    const hx = e.x + (Math.random() - 0.5) * spread * 2, hy = e.y + (Math.random() - 0.5) * spread;
    const sl = this.img(hx, hy, 'slash').setDepth(2900).setRotation(Math.atan2(e.y - s.y, e.x - s.x) + (Math.random() - 0.5))
      .setScale(S * (e.r ? 1.1 : 0.75));
    this.tweens.add({ targets: sl, alpha: 0, scaleX: sl.scaleX * 1.5, scaleY: sl.scaleY * 1.5, duration: 140, onComplete: () => sl.destroy() });
    if (!e.prof) {
      const sp = e.sprite || e.obj;
      sp.setTintFill(0xffffff);
      this.time.delayedCall(55, () => { if (sp.active) sp.clearTint(); });
    } else if (!e.flash) {
      e.flash = true;
      e.obj.setTint(0xff9a9a);
      this.time.delayedCall(60, () => { if (e.obj.active) e.obj.clearTint(); });
      this.time.delayedCall(260, () => { e.flash = false; });
    }
    if (e.r || Math.random() < 0.5) this.float(hx, hy - 12, fmt(dmg), this.thunderBlade && ELEMENT[e.kind] ? '#d9a8ff' : '#ffeb3b', 13);
    if (e.label) this.wallLabel(e);
    if (e.hp <= 0) this.kill(e);
  }

  kill(e) {
    const raw = e.souls || Stats.soulsPerKill();
    const gain = Math.floor(raw) + (Math.random() < raw % 1 ? 1 : 0);
    this.earned += gain; Save.souls += gain;
    Sound.play('kill');
    this.charge = Math.min(this.specialMax, this.charge + (e.r && e.kind !== 'wall' ? this.specialMax / 4 : 1));
    const tint = { demon: 0xab47bc, zombie: 0x9ccc65, giant: 0x9ccc65, thunder: 0xb388ff, charm: 0xffd54f, wall: 0x9aa1a9, rockOni: 0x9aa1a9, rockBoss: 0x9aa1a9, tenguBoss: 0xef5350, boss: 0xab47bc }[e.kind];
    this.burst.setParticleTint(tint);
    this.burst.explode(e.r ? 40 : 10, e.x, e.y);
    const orb = this.img(e.x, e.y, 'soul').setDepth(5001).setScale(S * (e.r ? 2 : 1.2));
    this.tweens.add({ targets: orb, x: 22, y: 56, duration: 520, ease: 'Cubic.in', onComplete: () => {
      orb.destroy(); Sound.play('soul');
      this.tweens.add({ targets: this.soulIcon, scale: S * 1.8, duration: 80, yoyo: true });
    } });
    if (e.kind === 'wall') {
      Sound.play('wallBreak'); this.shake(200, 0.01);
    }
    e.gone = true; e.obj.destroy();
    if (e === this.boss) this.endFight();
  }

  updateEnemies(dt) {
    const wdt = dt * this.timeScale;
    this.enemies.forEach(e => {
      if (e.gone || e.hp <= 0 || e.hold) return;
      if (e.kind === 'charm') {
        e.x += e.vx * wdt;
        if (e.x < 85 || e.x > 315) { e.x = clamp(e.x, 85, 315); e.vx = -e.vx; }
        const pulse = Math.sin(this.time.now * 0.008 + e.seed);
        e.glow.setScale(S * (1.5 + pulse * 0.2)).setAlpha(0.8 + pulse * 0.2);
        e.sprite.setRotation(Math.sin(this.time.now * 0.012 + e.seed) * 0.12);
      }
    });
    // ORIGINAL WALL CRUSH BEHAVIOR
    this.enemies.forEach(e => {
      if (e.kind !== 'wall' || e.gone || e.hp <= 0 || e.passed) return;
      if (!this.wallSeen && e.y > 120) { this.wallSeen = true; this.banner('STONE WALL', 'break it or go around'); }
      const close = e.y > this.formY - 110;
      e.label.setColor(close && Math.sin(this.time.now * 0.025) > 0 ? '#ff5252' : '#fff');
      if (e.y < this.formY - 26) return;
      e.passed = true;
      if (Math.abs(this.armyX - e.x) >= CFG.wall.half) return;
      this.crushed = true;
      Sound.play('slam'); this.shake(450, 0.02);
      this.float(this.armyX, this.formY - 50, 'CRUSHED', '#ff5252', 30);
      this.count = 0; this.syncArmy();
    });
    this.spikes.forEach(o => {
      if (o.hit || o.y < this.formY - 20) return;
      const s = this.soldiers.find(s => Math.abs(s.x - o.x) < 17 && Math.abs(s.y - o.y) < 13);
      if (!s) return;
      o.hit = true;
      o.obj.setTint(0xff8a80); Sound.play('spike');
      this.lose(1, s);
    });
    this.updateBoss(wdt);
  }

  updateBoss(wdt) {
    this.danger.clear();
    this.boltG.clear();
    const b = this.boss;
    if (!b || !this.fight || b.gone) return;
    const B = b.prof;
    if (B.trickle) {
      b.trickleT -= wdt * 1000;
    }
  }

  useSpecial() {
    if (this.charge < this.specialMax || this.slowLeft > 0) return;
    this.charge = 0;
    this.slowLeft = CFG.slowMs;
    this.timeScale = CFG.slowScale;
  }

  togglePause() {
    this.paused = !this.paused;
    this.time.paused = this.paused;
  }

  finish(win) {
    this.over = true;
    Save.save();
  }

  syncArmy(init) {
    const n = Math.min(this.count, CFG.maxDrawn);
    while (this.soldiers.length < n) {
      const img = this.img(0, 0, 'samurai');
      const blade = this.img(0, 0, 'blade');
      this.soldiers.push({ img, blade, x: W / 2, y: this.formY, cd: 0, lunge: 0, swing: 0, pop: 1 });
    }
    while (this.soldiers.length > n) {
      const s = this.soldiers.pop();
      s.img.destroy(); s.blade.destroy();
    }
  }

  lose(n, s, shake) {
    this.wound += n;
    while (this.wound >= 1 && this.count > 0) {
      this.wound--;
      this.count--;
      if (s) { s.img.destroy(); s.blade.destroy(); this.soldiers = this.soldiers.filter(x => x !== s); }
      else this.syncArmy();
    }
    if (shake) this.shake(120, 0.008);
  }

  startFight() {
    this.fight = true;
    this.boss.hold = false;
  }

  endFight() {
    this.fight = false;
    this.finaleDone = true;
    this.speedMod *= CFG.bossSlow;
  }

  updateHud() {
    this.soulTxt.setText(coins(Save.souls));
    const p = Math.min(1, this.dist / this.L.length);
    this.prog.width = 160 * p;
    this.progTxt.setText(Math.floor(p * 100) + '%');
    const sc = this.charge / this.specialMax;
    this.specialFill.width = 80 * sc;
    if (this.slowLeft > 0) {
      this.slowLeft -= 16;
      if (this.slowLeft <= 0) this.timeScale = 1;
    }
  }

  airSlash(s, e) {
    const sl = this.img(s.x, s.y, 'slash').setDepth(2900).setRotation(Math.atan2(e.y - s.y, e.x - s.x));
    this.tweens.add({ targets: sl, x: e.x, y: e.y, alpha: 0, duration: 180, onComplete: () => sl.destroy() });
  }

  zap(x1, y1, x2, y2, dur) {
    const g = this.add.graphics().setDepth(2800);
    g.lineStyle(2, 0xd9a8ff, 0.8);
    g.lineBetween(x1, y1, x2, y2);
    this.time.delayedCall(dur, () => g.destroy());
  }
}

class BootScene extends BaseScene {
  constructor() { super('Boot'); }
  preload() {}
  create() {
    this.scene.start('Menu');
  }
}

class MenuScene extends BaseScene {
  constructor() { super('Menu'); }
  create() {
    this.setupCamera();
    this.txt(W / 2, 200, 'SAMURAI RUNNER', 28, '#fff');
    const btn = this.add.rectangle(W / 2, 360, 200, 50, 0x6a1b9a).setInteractive();
    this.txt(W / 2, 360, 'PLAY', 20, '#fff');
    btn.on('pointerdown', () => this.scene.start('Game', { level: Save.level }));
  }
}

const config = {
  type: Phaser.AUTO,
  width: W,
  height: H,
  parent: 'game',
  backgroundColor: '#120c14',
  scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
  scene: [BootScene, MenuScene, GameScene],
};
new Phaser.Game(config);
</script>
