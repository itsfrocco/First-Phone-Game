    Sound.play('gateGood');
    if (!this.caughtHint) { this.caughtHint = true; this.banner('CATCH IT!', 'slide your archers under the prize'); }
  }
  updateDrops(wdt) {
    const F = CFG.fort, n = this.archers.length, half = (Math.min(n, F.perRow) - 1) / 2 * F.spacing;
    this.drops = this.drops.filter(d => {
      d.y += F.drop.speed * wdt;
      const p = 1 + Math.sin(this.time.now * 0.015) * 0.08;
      d.obj.setPosition(d.x, d.y).setScale(S * 0.55 * p); d.label.setPosition(d.x, d.y - 1);
      d.ring.clear().lineStyle(3, d.kind === 'mystery' ? 0xe1bee7 : 0xffe082, 0.5 + Math.sin(this.time.now * 0.015) * 0.3).strokeCircle(d.x, d.y, 30 * p);
      if (d.y < F.archerY - 30) return true;
      d.obj.destroy(); d.label.destroy(); d.ring.destroy();
      if (Math.abs(d.x - this.aimX) <= half + F.drop.reach) this.grant(d.kind, d.boost, d.x, d.y);
      else { this.missed++; this.float(d.x, d.y - 20, 'MISSED', '#cfd8dc', 16); Sound.play('deny'); }
      return false;
    });
  }
  grant(kind, boost, x, y) {
    const F = CFG.fort;
    if (kind === 'mystery') {
      const M = F.mystery, prize = M.prizes[Math.random() * M.prizes.length | 0];
      Sound.play('buy');
      if (prize === 'rapid') { this.rapidLeft = M.rapidMs; this.float(x, y - 10, 'RAPID FIRE!', '#e1bee7', 17); }
      else if (prize === 'twin') { this.twinLeft = M.twinMs; this.float(x, y - 10, 'TWIN ARROWS!', '#e1bee7', 17); }
      else if (prize === 'freeze') { this.freezeLeft = M.freezeMs; Sound.play('special'); this.float(W / 2, y - 10, 'FROZEN!', '#b3e5fc', 24); }
      else { this.earned += M.coins; Save.souls += M.coins; Sound.play('soul'); this.float(x, y - 10, '+' + M.coins + ' COINS', '#ffe082', 17); }
      return;
    }
    if (boost === 'archers' && this.archerCount() >= F.maxArchers) boost = 'fire';
    Sound.play('buy'); this.cameras.main.flash(160, 255, 200, 60);
    if (boost === 'archers') { this.moreArchers += F.moreArchers; this.syncArchers(); this.banner('REINFORCEMENTS', '+' + F.moreArchers + ' archers on the wall'); }
    else if (boost === 'fire') { this.fireLeft = F.fireMs; this.banner('FIRE ARROWS', 'they burn through the ranks'); }
    else if (boost === 'sharp') { this.dmgMod += F.sharp; this.banner('SHARP ARROWS', 'arrow damage +' + Math.round(F.sharp * 100) + '%'); }
    else { this.gate = Math.min(F.gateHp, this.gate + F.repair); this.banner('GATE REPAIRED', '+' + F.repair); }
  }

  /* ---------- SLOW and the ultimate ---------- */
  activateSpecial() {
    if (!this.started || this.over || this.paused || this.slowLeft > 0 || this.charge < this.specialMax) return;
    this.charge = 0; this.slowLeft = CFG.slowMs;
    Sound.play('special'); this.cameras.main.flash(180, 150, 110, 255); this.banner('SLOW MOTION', '');
  }

  // Arrow Storm: every archer looses at once and a wave of golden arrows sweeps the whole road.
  activateUlt() {
    if (!this.started || this.over || this.paused || this.ultWave || this.ultCharge < this.ultMax) return;
    this.ultCharge = 0; this.ultUsed++;
    this.ultWave = { y: CFG.fort.wallY, hit: new Set(), tail: 0 };
    Sound.play('ultimate'); this.cameras.main.flash(260, 255, 214, 110); this.shake(450, 0.012);
    this.banner('ARROW STORM', '');
  }

  updateUlt(dt) {
    const w = this.ultWave, g = this.ultG, F = CFG.fort;
    if (!w) return;
    g.clear();
    w.y -= CFG.ult.speed * dt; w.tail += dt;
    for (const e of [...this.enemies]) {
      if (e.gone || e.K.crate || w.hit.has(e) || e.y < w.y || e.y < -20) continue;
      w.hit.add(e);
      this.strike(e, e.kind === 'warlord' ? e.maxHp * F.ultBoss : e.kind === 'brute' ? e.maxHp * F.ultBig : e.hp);
      if (e.K.big && !e.gone) this.float(e.x, e.y - e.K.tall - 20, 'ARROW STORM!', '#ffe082', 16);
    }
    if (w.y < -140) { this.ultWave = null; return; }
    for (let i = 1; i <= 5; i++) g.fillStyle(0xffb300, 0.05).fillRect(0, w.y, W, i * 34);
    for (let x = 6; x < W; x += 13) {                         // a wall of arrows
      const y = w.y + Math.sin(x * 0.9 + w.tail * 30) * 9 + ((x * 7) % 23);
      g.lineStyle(2.4, 0xffe082, 0.95).lineBetween(x, y, x, y + 26).lineStyle(6, 0xff8f00, 0.3).lineBetween(x, y + 6, x, y + 60);
      g.fillStyle(0xffffff, 1).fillTriangle(x - 3, y + 2, x, y - 7, x + 3, y + 2);
    }
  }

  /* ---------- main loop ---------- */
  update(time, delta) {
    if (this.over || this.paused) return;
    const dt = Math.min(delta, 50) / 1000;
    this.updateArchers(dt);
    if (!this.started) { this.updateHud(dt); return; }
    const slowing = this.slowLeft > 0;
    this.timeScale += ((slowing ? CFG.slowScale : 1) - this.timeScale) * damp(10, dt);
    const wdt = dt * this.timeScale;
    Music.rate = this.timeScale;
    if (slowing) this.slowLeft = Math.max(0, this.slowLeft - delta);
    this.slowTint.setAlpha((1 - this.timeScale) / (1 - CFG.slowScale) * 0.2);
    this.fireLeft = Math.max(0, this.fireLeft - dt * 1000);
    this.rapidLeft = Math.max(0, this.rapidLeft - dt * 1000); this.twinLeft = Math.max(0, this.twinLeft - dt * 1000);
    this.freezeLeft = Math.max(0, this.freezeLeft - wdt * 1000);
    this.iceTint.setAlpha(Math.min(1, this.freezeLeft / 400) * (0.2 + Math.sin(time * 0.012) * 0.04));
    this.hurt = Math.max(0, this.hurt - dt * 3);
    const low = this.gate / CFG.fort.gateHp < 0.3 ? 0.1 + Math.sin(time * 0.008) * 0.06 : 0;
    this.hurtTint.setAlpha(Math.max(low, this.hurt * 0.18));
    this.t += wdt * 1000;
    this.updateWaves();
    if (this.over) return;
    this.updateEnemies(wdt);
    this.updateBlasts();
    this.updateDrops(wdt);
    this.updateArrows(dt);
    this.updateUlt(dt);
    this.updateHud(dt);
  }

  updateHud(dt) {
    const g = this.hud, F = CFG.fort; g.clear();
    // the gate's health
    const px = 70, pw = 260, r = this.gate / F.gateHp;
    this.gateShown += (r - this.gateShown) * damp(5, dt);
    g.fillStyle(0x000000, 0.55).fillRoundedRect(px - 3, 20, pw + 6, 18, 8);
    if (this.gateShown > 0.01) g.fillStyle(0xffffff, 0.7).fillRoundedRect(px, 23, pw * this.gateShown, 12, 5);
    if (r > 0.01) g.fillStyle(r > 0.5 ? 0x43a047 : r > 0.25 ? 0xffa000 : 0xe53935, 1).fillRoundedRect(px, 23, pw * r, 12, Math.min(5, pw * r / 2));
    this.gateText.setText('GATE  ' + Math.ceil(this.gate) + ' / ' + F.gateHp);
    this.soulText.setText(coins(Save.souls));
    this.waveText.setText(this.waveNo ? (this.waveNo === F.waves.length ? 'FINAL WAVE' : 'WAVE ' + this.waveNo + ' / ' + F.waves.length) : '');
    if (this.doorShut) this.doorText.setText('GATE ' + Math.ceil(this.doorHp));
    this.boostText.setText([['FIRE ARROWS', this.fireLeft], ['RAPID FIRE', this.rapidLeft], ['TWIN ARROWS', this.twinLeft], ['FROZEN', this.freezeLeft]]
      .filter(b => b[1] > 0).map(b => b[0] + ' ' + Math.ceil(b[1] / 1000) + 's').join('  ·  '));
    if (!this.started) return;
    // special bar + button, and the ultimate bar above it (as in the run)
    const slowing = this.slowLeft > 0;
    const fill = slowing ? this.slowLeft / CFG.slowMs : this.charge / this.specialMax;
    const ready = !slowing && this.charge >= this.specialMax;
    g.fillStyle(0x000000, 0.5).fillRoundedRect(27, 673, 206, 16, 8);
    if (fill > 0.005) g.fillStyle(slowing ? 0xb388ff : 0x7c4dff, 1).fillRoundedRect(30, 676, 200 * fill, 10, Math.min(5, 100 * fill));
    const pulse = ready ? 1 + Math.sin(this.time.now * 0.008) * 0.07 : 1;
    g.fillStyle(0x000000, 0.4).fillCircle(336, 679, 33 * pulse);
    g.fillStyle(ready ? 0x7c4dff : slowing ? 0x311b92 : 0x3a3050, 1).fillCircle(336, 676, 32 * pulse);
    g.lineStyle(3, ready ? 0xffffff : 0x8c80a8, ready ? 1 : 0.5).strokeCircle(336, 676, 32 * pulse);
    this.specialText.setText(slowing ? (this.slowLeft / 1000).toFixed(1) : 'SLOW').setAlpha(ready || slowing ? 1 : 0.45);
    this.specialHint.setText(ready ? 'SPECIAL READY' : slowing ? 'SLOW MOTION' : 'SPECIAL');
    const uf = this.ultCharge / this.ultMax, uReady = uf >= 1, glow = 0.5 + Math.sin(this.time.now * 0.01) * 0.5;
    g.fillStyle(0x000000, 0.5).fillRoundedRect(27, 643, 206, 16, 8);
    if (uReady) g.lineStyle(2, 0xffffff, 0.4 + glow * 0.6).strokeRoundedRect(27, 643, 206, 16, 8);
    if (uf > 0.005) g.fillStyle(uReady ? (glow > 0.5 ? 0xffd54f : 0xffb300) : 0xc77800, 1).fillRoundedRect(30, 646, 200 * uf, 10, Math.min(5, 100 * uf));
    this.ultHint.setText(uReady ? 'ULTIMATE READY  ▲ FLICK UP' : 'ULTIMATE').setAlpha(uReady ? 0.7 + glow * 0.3 : 0.8);
  }

  /* ---------- fx, pause, end ---------- */
  shake(ms, amount) { if (Save.shake && CFG.shake > 0) this.cameras.main.shake(ms, amount * CFG.shake); }
  float(x, y, str, color, size) {
    const t = this.txt(x, y, str, size, color, { stroke: '#000', strokeThickness: 3 }).setDepth(4000);
    this.tweens.add({ targets: t, y: y - 30, alpha: 0, duration: 550, ease: 'Cubic.out', onComplete: () => t.destroy() });
  }
  banner(title, sub) {
    const t = this.txt(W / 2, 250, title, 30, '#ffd54f', { stroke: '#2a0a14', strokeThickness: 6 }).setDepth(5200).setScale(0.4);
    const s = this.txt(W / 2, 282, sub, 14, '#fff', { stroke: '#2a0a14', strokeThickness: 4 }).setDepth(5200).setAlpha(0);
    this.tweens.add({ targets: t, scale: 1, duration: 220, ease: 'Back.out' });
    this.tweens.add({ targets: s, alpha: 1, duration: 220 });
    this.tweens.add({ targets: [t, s], alpha: 0, delay: 1300, duration: 400, onComplete: () => { t.destroy(); s.destroy(); } });
  }

  setPaused(on) {
    if (this.over || (on && this.paused)) return;
    this.paused = on; this.time.paused = on;
    if (on) this.tweens.pauseAll(); else this.tweens.resumeAll();
    if (this.pauseUi) this.pauseUi.forEach(o => o.destroy());
    this.pauseUi = null;
    if (!on) return;
    const before = new Set(this.children.list);
    this.add.rectangle(W / 2, H / 2, W, H, 0x05020c, 0.7).setInteractive();
    const g = this.add.graphics();
    g.fillStyle(0x1c1220, 0.97).fillRoundedRect(30, 130, 340, 440, 14).lineStyle(2, 0xffffff, 0.25).strokeRoundedRect(30, 130, 340, 440, 14);
    this.txt(W / 2, 162, 'PAUSED', 24, '#ffd54f');
    [['Music', 'music'], ['Sound effects', 'sfx'], ['Screen shake', 'shake']].forEach(([label, key], i) => {
      const y = 222 + i * 64;
      this.txt(56, y, label, 18, '#fff', { fit: 186 }).setOrigin(0, 0.5);
      this.button(296, y, 92, 44, Save[key] ? 0x2e7d32 : 0x4a4250, Save[key] ? 'ON' : 'OFF', 17, () => {
        Save[key] = !Save[key]; Save.save(); Sound.applyOptions();
        this.paused = false; this.setPaused(true);
      });
    });
    this.button(W / 2, 434, 260, 58, 0x3f9b1f, 'RESUME', 24, () => this.setPaused(false));
    this.button(W / 2, 510, 260, 46, 0x4a3f63, 'QUIT TO SAGAS', 15, () => { Save.save(); this.time.paused = false; this.scene.start('Sagas'); });
    this.pauseUi = this.children.list.filter(o => !before.has(o));
    this.pauseUi.forEach((o, i) => o.setDepth(7000 + i));
  }

  finish(win) {
    if (this.over) return;
    this.over = true; this.won = win;
    const F = CFG.fort, first = win && Save.forts <= this.saga;
    const bonus = win ? F.reward[first ? 0 : 1] : 0;
    if (first) Save.forts = this.saga + 1;
    this.earned += bonus; Save.souls += bonus;
    Save.save();
    Music.rate = 1; Music.set('off'); Sound.play(win ? 'win' : 'defeat');
    this.ultG.clear();
    const D = 6000;
    const shade = this.add.rectangle(W / 2, H / 2, W, H, 0x0a0610, 1).setAlpha(0).setDepth(D);
    this.tweens.add({ targets: shade, alpha: 0.78, duration: 350 });
    const title = this.txt(W / 2, 270, win ? 'COMPOUND HELD' : 'THE GATE HAS FALLEN', win ? 36 : 30, win ? '#ffd54f' : '#ff5252', { stroke: '#000', strokeThickness: 6 }).setDepth(D + 1).setScale(0.3);
    this.tweens.add({ targets: title, scale: 1, duration: 350, ease: 'Back.out' });
    this.img(W / 2 - 62, 336, 'soul').setScale(S * 1.6).setDepth(D + 1);
    this.txt(W / 2 + 6, 336, '+' + coins(this.earned) + ' coins', 24, '#ffe082').setDepth(D + 1);
    if (win) this.txt(W / 2, 368, 'includes ' + bonus + ' for holding the land', 12, '#cfc3d6', { fontStyle: 'normal' }).setDepth(D + 1);
    if (first) this.txt(W / 2, 400, (SAGAS[this.saga + 1] || 'the next saga').toUpperCase() + ' UNLOCKED', 16, '#fff59d').setDepth(D + 1);
    if (!win) this.txt(W / 2, 384, 'reached wave ' + this.waveNo + ' of ' + F.waves.length + '\nupgrade your clan and try again', 14, '#cfc3d6', { align: 'center', fontStyle: 'normal' }).setDepth(D + 1);
    const tap = this.txt(W / 2, 452, 'tap to continue', 16, '#bbb', { fontStyle: 'normal' }).setDepth(D + 1).setAlpha(0);
    this.time.delayedCall(700, () => {
      this.tweens.add({ targets: tap, alpha: 1, duration: 500, yoyo: true, repeat: -1 });
      this.input.once('pointerdown', () => { if (win) this.scene.start('Sagas'); else this.scene.start('Defense', { saga: this.saga }); });
    });
  }
}
