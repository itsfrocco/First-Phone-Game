<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#120c14">
<title>Samurai Runner</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: #120c14; overflow: hidden; touch-action: none;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  #game { width: 100%; height: 100%; }
</style>
</head>
<body>
<div id="game"></div>
<script>
'use strict';

/* ============================================================
   CONFIG — every tuning number lives here
   ============================================================ */
const W = 400, H = 720;                       // logical size; everything is laid out in these units
const R = Math.min(3, Math.max(1, Math.round(window.devicePixelRatio || 1)));  // render scale for crisp art
const S = 1 / R;                              // sprite scale that undoes R
const FONT = '"Trebuchet MS", "Avenir Next", "Segoe UI", system-ui, sans-serif';

const CFG = {
  startArmy: 4,
  maxDrawn: 20,            // soldiers drawn on screen; the count can go higher
  armyY: 560,              // front row of the army
  pathLeft: 60, pathRight: 340,
  steerMin: 78, steerMax: 322,
  baseSpeed: 90,           // px/s at the start of a level
  speedRamp: 0.30,         // +30% by the end
  attackRange: 38,
  slowScale: 0.30,         // world speed while the special is active
  slowMs: 4000,
  specialMax: 12,
  oniSlow: 0.97,           // each oni kill slows the run 3%
  shake: 0.4,              // screen-shake strength multiplier (0 = off)
  // Regular enemies run at the army, then strike. `hit` is the share of one samurai lost per strike.
  enemy: {
    reach: 16,
    zombie: { speed: 38, hit: 0.20, strikeMs: 1100 },
    demon:  { speed: 55, hit: 0.30, strikeMs: 900 },
  },
  boss: { hp: 520, swingMs: 1100, cleave: 4, cleaveShare: 0.10, souls: 80 },   // a swing takes the larger of `cleave` or `cleaveShare` of the army
  oni: { swingMs: 750, reach: 55, hitReach: 40 },
};

// Level layout, measured in distance along the path (px).
const LEVEL = {
  gates: [
    { d: 340,  bad: { op: '-', n: 2 }, good: { op: '+', n: 4 } },
    { d: 640,  bad: { op: '-', n: 3 }, good: { op: 'x', n: 2 } },
    { d: 1660, bad: { op: '-', n: 4 }, good: { op: '+', n: 6 } },
    { d: 2010, bad: { op: '-', n: 5 }, good: { op: 'x', n: 2 } },
    { d: 2360, bad: { op: '-', n: 4 }, good: { op: '+', n: 8 } },
    { d: 2710, bad: { op: '-', n: 6 }, good: { op: 'x', n: 3 } },
  ],
  packs:  [510, 910, 1260, 1610, 1960, 2310, 2610],   // enemy groups; each is bigger than the last
  onis:   [1160, 2160],
  spikes: [490, 900, 1400, 1835, 2185, 2535, 2950],     // each sits midway between two gate rows, never beside one
  bossAt: 3600,
  length: 3700,
};

/* ============================================================
   SAVE — same localStorage keys as the prototype
   ============================================================ */
const Save = {
  souls: 500, fire: 1, damage: 1, revenue: 1,
  load() {
    const num = (k, def) => {
      try { const v = parseInt(localStorage.getItem(k), 10); return Number.isFinite(v) ? v : def; }
      catch (e) { return def; }
    };
    this.souls = num('samurai_souls', 500);
    this.fire = num('samurai_fire', 1);
    this.damage = num('samurai_damage', 1);
    this.revenue = num('samurai_revenue', 1);
  },
  save() {
    try {
      localStorage.setItem('samurai_souls', this.souls);
      localStorage.setItem('samurai_fire', this.fire);
      localStorage.setItem('samurai_damage', this.damage);
      localStorage.setItem('samurai_revenue', this.revenue);
    } catch (e) {}
  },
};
Save.load();
window.addEventListener('pagehide', () => Save.save());
document.addEventListener('visibilitychange', () => { if (document.hidden) Save.save(); });

const Stats = {
  cost: lvl => Math.floor(40 * Math.pow(1.55, lvl - 1)),
  attackMs: () => Math.max(180, 400 - Save.fire * 25),
  damage: () => 1 + (Save.damage - 1) * 0.5,
  soulsPerKill: () => 5 * Save.revenue,
};
const fmt = n => Number.isInteger(n) ? String(n) : n.toFixed(1);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const damp = (rate, dt) => 1 - Math.exp(-rate * dt);   // frame-rate independent lerp factor

/* ============================================================
   ART — every texture is drawn here with Canvas 2D at R× scale
   ============================================================ */
const Art = {
  make(scene, key, w, h, draw) {
    if (scene.textures.exists(key)) return;
    const t = scene.textures.createCanvas(key, Math.ceil(w * R), Math.ceil(h * R));
    const c = t.getContext();
    c.scale(R, R);
    c.lineJoin = c.lineCap = 'round';
    draw(c, w, h);
    t.refresh();
  },
  rr(c, x, y, w, h, r) {
    c.beginPath();
    c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
  },
  ell(c, x, y, rx, ry, fill) { c.beginPath(); c.ellipse(x, y, rx, ry, 0, 0, 7); c.fillStyle = fill; c.fill(); },
  tri(c, a, b, d, fill) { c.beginPath(); c.moveTo(...a); c.lineTo(...b); c.lineTo(...d); c.closePath(); c.fillStyle = fill; c.fill(); },
  grad(c, x0, y0, x1, y1, stops) {
    const g = c.createLinearGradient(x0, y0, x1, y1);
    stops.forEach(([o, col]) => g.addColorStop(o, col));
    return g;
  },
  shadow(c, x, y, rx) { Art.ell(c, x, y, rx, rx * 0.35, 'rgba(0,0,0,0.32)'); },

  samurai(c) {
    c.translate(0, 4);
    Art.shadow(c, 18, 42, 11);
    // back banner (sashimono)
    c.strokeStyle = '#2b2118'; c.lineWidth = 1.4; c.beginPath(); c.moveTo(11, 26); c.lineTo(11, -2); c.stroke();
    Art.rr(c, 2.5, -2.5, 8.5, 14, 1); c.fillStyle = Art.grad(c, 0, -2, 0, 12, [[0, '#42a5f5'], [1, '#1565c0']]); c.fill();
    Art.ell(c, 6.7, 4, 2.4, 2.4, '#fff'); Art.ell(c, 6.7, 4, 1, 1, '#1565c0');
    // legs and shin guards
    c.fillStyle = '#14141f'; c.fillRect(13, 33, 4.4, 8); c.fillRect(18.6, 33, 4.4, 8);
    c.fillStyle = '#ffca28'; c.fillRect(13, 37, 4.4, 1); c.fillRect(18.6, 37, 4.4, 1);
    // armoured skirt (kusazuri)
    [10.5, 15.5, 20.5].forEach(x => { Art.rr(c, x, 27, 5, 7.5, 1.5); c.fillStyle = '#1e2a78'; c.fill(); });
    c.strokeStyle = 'rgba(255,202,40,0.85)'; c.lineWidth = 0.7;
    [30.5, 33].forEach(y => { c.beginPath(); c.moveTo(11, y); c.lineTo(25, y); c.stroke(); });
    // black lacquer cuirass
    Art.rr(c, 11, 16.5, 14, 12, 3); c.fillStyle = Art.grad(c, 11, 16, 25, 29, [[0, '#3a3a52'], [1, '#0d0d16']]); c.fill();
    c.strokeStyle = '#42a5f5'; c.lineWidth = 0.8;
    [20, 23.5].forEach(y => { c.beginPath(); c.moveTo(12, y); c.lineTo(24, y); c.stroke(); });
    Art.ell(c, 18, 21.7, 1.7, 1.7, '#ffca28');
    c.fillStyle = '#1976d2'; c.fillRect(11, 26.5, 14, 1.8);
    // layered shoulder plates (sode)
    [4.5, 23.5].forEach(x => {
      Art.rr(c, x, 15.5, 8, 9.5, 2.5); c.fillStyle = Art.grad(c, 0, 15, 0, 25, [[0, '#3f51b5'], [1, '#1a237e']]); c.fill();
      c.strokeStyle = '#ffca28'; c.lineWidth = 0.8;
      [18.8, 21.8].forEach(y => { c.beginPath(); c.moveTo(x + 1, y); c.lineTo(x + 7, y); c.stroke(); });
    });
    Art.ell(c, 8.5, 26.5, 2, 2, '#14141f'); Art.ell(c, 27.5, 26.5, 2, 2, '#14141f');
    // neck guard, war mask, glowing eyes
    Art.tri(c, [10, 10], [6, 16.5], [14, 15], '#1a237e'); Art.tri(c, [26, 10], [30, 16.5], [22, 15], '#1a237e');
    Art.ell(c, 18, 12.5, 5.4, 5.2, '#1b1b26');
    Art.rr(c, 13.6, 12.8, 8.8, 4.6, 2); c.fillStyle = '#a32020'; c.fill();
    c.fillStyle = '#fff'; c.fillRect(15.4, 15, 5.2, 1.1);
    c.fillStyle = '#a32020'; [16.6, 18, 19.4].forEach(x => c.fillRect(x - 0.2, 15, 0.4, 1.1));
    c.shadowColor = '#40c4ff'; c.shadowBlur = 5;
    Art.tri(c, [13.8, 10.2], [17, 11.5], [14.3, 12.2], '#e1f5fe'); Art.tri(c, [22.2, 10.2], [19, 11.5], [21.7, 12.2], '#e1f5fe');
    c.shadowBlur = 0;
    // helmet (kabuto) with gold crescent crest
    c.beginPath(); c.arc(18, 9.6, 7.4, Math.PI, 0); c.closePath(); c.fillStyle = Art.grad(c, 11, 2, 25, 10, [[0, '#3a3a52'], [1, '#0d0d16']]); c.fill();
    c.strokeStyle = 'rgba(255,255,255,0.16)'; c.lineWidth = 0.6;
    [-0.9, -0.45, 0, 0.45, 0.9].forEach(a => { c.beginPath(); c.moveTo(18, 3); c.lineTo(18 + Math.sin(a) * 7, 9.4); c.stroke(); });
    Art.rr(c, 9.6, 8.6, 16.8, 2.4, 1); c.fillStyle = '#0d0d16'; c.fill();
    c.fillStyle = '#ffca28'; c.fillRect(10.4, 10.4, 15.2, 0.6);
    c.beginPath(); c.arc(18, -1.5, 8.5, 0.06 * Math.PI, 0.94 * Math.PI); c.arc(18, -4.5, 8.6, 0.86 * Math.PI, 0.14 * Math.PI, true); c.closePath();
    c.fillStyle = '#ffd54f'; c.fill(); c.strokeStyle = '#b28704'; c.lineWidth = 0.5; c.stroke();
  },
  katana(c) {
    c.fillStyle = '#1b1b26'; c.fillRect(5, 26, 2.4, 9);
    c.fillStyle = '#ffca28'; [28, 30.5, 33].forEach(y => c.fillRect(5, y, 2.4, 0.8));
    Art.ell(c, 6.2, 26, 3.4, 1.3, '#ffca28');
    c.shadowColor = '#40c4ff'; c.shadowBlur = 4;
    c.beginPath(); c.moveTo(4.9, 25.5); c.quadraticCurveTo(4.4, 11, 8.8, 1); c.quadraticCurveTo(8, 12, 7.6, 25.5); c.closePath();
    c.fillStyle = Art.grad(c, 4, 0, 9, 0, [[0, '#ffffff'], [1, '#90caf9']]); c.fill();
    c.shadowBlur = 0;
  },
  demon(c) {
    Art.shadow(c, 16, 36, 10);
    c.fillStyle = '#38006b'; c.fillRect(11, 29, 4, 6); c.fillRect(17, 29, 4, 6);
    Art.rr(c, 8, 15, 16, 16, 5); c.fillStyle = Art.grad(c, 8, 15, 24, 31, [[0, '#8e24aa'], [1, '#4a148c']]); c.fill();
    Art.ell(c, 6.5, 22, 2.6, 5, '#6a1b9a'); Art.ell(c, 25.5, 22, 2.6, 5, '#6a1b9a');       // arms
    Art.tri(c, [9, 7], [7, 0], [13, 5], '#ffe0b2'); Art.tri(c, [23, 7], [25, 0], [19, 5], '#ffe0b2');   // horns
    Art.ell(c, 16, 11, 7.5, 6.8, '#ab47bc');
    c.shadowColor = '#ff1744'; c.shadowBlur = 4;
    Art.tri(c, [11, 9], [15, 11], [11.5, 12], '#ff5252'); Art.tri(c, [21, 9], [17, 11], [20.5, 12], '#ff5252');  // eyes
    c.shadowBlur = 0;
    c.fillStyle = '#2a0038'; c.fillRect(12.5, 14, 7, 2);
    Art.tri(c, [13, 14], [14.5, 14], [13.7, 16.4], '#fff'); Art.tri(c, [17.5, 14], [19, 14], [18.3, 16.4], '#fff');
  },
  zombie(c) {
    Art.shadow(c, 16, 36, 9);
    c.fillStyle = '#3e2723'; c.fillRect(11, 29, 4, 6); c.fillRect(17, 30, 4, 5);
    Art.rr(c, 9, 15, 14, 15, 3); c.fillStyle = Art.grad(c, 9, 15, 23, 30, [[0, '#6d4c41'], [1, '#4e342e']]); c.fill(); // rags
    Art.tri(c, [9, 30], [13, 30], [11, 33], '#4e342e'); Art.tri(c, [16, 30], [21, 30], [19, 34], '#4e342e');
    c.fillStyle = '#7cb342'; Art.rr(c, 4, 17, 4.5, 13, 2); c.fill(); Art.rr(c, 23.5, 17, 4.5, 11, 2); c.fill();   // reaching arms
    Art.ell(c, 16, 11, 6.6, 6.4, '#9ccc65');
    Art.ell(c, 12, 7, 3, 2, '#558b2f');                                                      // rot patch
    Art.ell(c, 13.4, 10.4, 1.9, 1.9, '#fffde7'); Art.ell(c, 13.6, 10.6, 0.7, 0.7, '#111');
    Art.ell(c, 19, 10.6, 1.4, 1.4, '#1b1b1b');
    c.strokeStyle = '#33401a'; c.lineWidth = 1.2; c.beginPath(); c.moveTo(13, 14.6); c.lineTo(15, 13.8); c.lineTo(17, 14.8); c.lineTo(19, 14); c.stroke();
  },
  oni(c) {
    Art.shadow(c, 24, 51, 17);
    c.fillStyle = '#7f0000'; c.fillRect(15, 40, 7, 10); c.fillRect(26, 40, 7, 10);
    c.save(); c.translate(40, 24); c.rotate(0.35);                                           // kanabo club
    Art.rr(c, -3.5, -22, 7, 30, 3); c.fillStyle = '#3e2723'; c.fill();
    c.fillStyle = '#bdbdbd'; for (let y = -19; y < 2; y += 5) { c.fillRect(-4.6, y, 2, 2); c.fillRect(2.6, y + 2, 2, 2); }
    c.restore();
    Art.rr(c, 10, 20, 28, 24, 8); c.fillStyle = Art.grad(c, 10, 20, 38, 44, [[0, '#e53935'], [1, '#8e0000']]); c.fill();
    Art.rr(c, 12, 36, 24, 8, 3); c.fillStyle = '#ffb300'; c.fill();                          // tiger-skin wrap
    [15, 21, 27, 32].forEach(x => Art.tri(c, [x, 36], [x + 3, 36], [x + 1.5, 42], '#3e2723'));
    Art.ell(c, 8, 29, 4.2, 8, '#c62828'); Art.ell(c, 40, 30, 4.2, 7, '#c62828');
    Art.tri(c, [14, 9], [11, 0], [19, 6], '#ffd54f'); Art.tri(c, [34, 9], [37, 0], [29, 6], '#ffd54f');   // horns
    Art.ell(c, 24, 14, 11, 9.5, '#ef5350');
    c.strokeStyle = '#3e0000'; c.lineWidth = 2; c.beginPath(); c.moveTo(16, 9.5); c.lineTo(22, 12); c.moveTo(32, 9.5); c.lineTo(26, 12); c.stroke();
    c.shadowColor = '#ffeb3b'; c.shadowBlur = 5; Art.ell(c, 19.5, 13.5, 2, 1.6, '#ffee58'); Art.ell(c, 28.5, 13.5, 2, 1.6, '#ffee58'); c.shadowBlur = 0;
    c.fillStyle = '#3e0000'; c.fillRect(18, 18, 12, 3);
    Art.tri(c, [18.5, 21], [21, 21], [19.7, 16.5], '#fff'); Art.tri(c, [27, 21], [29.5, 21], [28.3, 16.5], '#fff');   // tusks
  },
  boss(c) {
    Art.shadow(c, 65, 118, 46);
    c.save(); c.translate(108, 62); c.rotate(0.3);                                           // cleaver
    c.fillStyle = '#4e342e'; c.fillRect(-3, 6, 6, 26);
    Art.rr(c, -9, -34, 20, 42, 3); c.fillStyle = Art.grad(c, -9, 0, 11, 0, [[0, '#eceff1'], [1, '#78909c']]); c.fill();
    c.restore();
    c.fillStyle = '#38006b'; Art.rr(c, 36, 96, 20, 20, 6); c.fill(); Art.rr(c, 74, 96, 20, 20, 6); c.fill();
    const g = c.createRadialGradient(56, 62, 6, 65, 74, 50);
    g.addColorStop(0, '#ab47bc'); g.addColorStop(1, '#4a148c');
    Art.ell(c, 65, 74, 46, 38, g);                                                           // belly
    Art.ell(c, 65, 82, 26, 20, 'rgba(225,190,231,0.35)');
    Art.ell(c, 65, 84, 2, 2.6, '#38006b');
    Art.ell(c, 22, 72, 9, 17, '#6a1b9a'); Art.ell(c, 108, 70, 9, 17, '#6a1b9a');
    c.strokeStyle = '#ffb300'; c.lineWidth = 3; c.beginPath(); c.arc(65, 54, 30, 0.25, Math.PI - 0.25); c.stroke();   // bead necklace
    Art.tri(c, [44, 26], [34, 2], [56, 18], '#ffd54f'); Art.tri(c, [86, 26], [96, 2], [74, 18], '#ffd54f');
    Art.ell(c, 65, 34, 26, 21, '#7b1fa2');
    c.strokeStyle = '#2a0038'; c.lineWidth = 3.5; c.beginPath(); c.moveTo(47, 24); c.lineTo(60, 30); c.moveTo(83, 24); c.lineTo(70, 30); c.stroke();
    c.shadowColor = '#ffea00'; c.shadowBlur = 8; Art.ell(c, 54, 33, 4.5, 3.4, '#ffee58'); Art.ell(c, 76, 33, 4.5, 3.4, '#ffee58'); c.shadowBlur = 0;
    Art.ell(c, 54.5, 33.4, 1.4, 2, '#3e0000'); Art.ell(c, 75.5, 33.4, 1.4, 2, '#3e0000');
    Art.rr(c, 49, 41, 32, 9, 3); c.fillStyle = '#2a0038'; c.fill();
    for (let x = 51; x < 79; x += 5.6) Art.tri(c, [x, 41], [x + 4.4, 41], [x + 2.2, 46.5], '#fff');
  },
  spike(c) {
    Art.ell(c, 18, 23, 16, 5, 'rgba(0,0,0,0.38)');
    Art.ell(c, 18, 21.5, 14, 4, '#3b3b44');
    [[7, 21, 9], [29, 21, 9], [13, 22, 14], [23, 22, 14], [18, 23, 19]].forEach(([x, y, h]) => {
      Art.tri(c, [x - 4.2, y], [x, y - h], [x, y], '#eceff1');
      Art.tri(c, [x, y], [x, y - h], [x + 4.2, y], '#78909c');
      Art.tri(c, [x - 1, y - h + 3.5], [x, y - h], [x + 1, y - h + 3.5], '#ef5350');
    });
  },
  slash(c) {
    c.beginPath(); c.arc(24, 24, 20, -1.2, 1.2); c.arc(15, 24, 21, 1.0, -1.0, true); c.closePath();
    c.fillStyle = Art.grad(c, 24, 4, 24, 44, [[0, 'rgba(255,255,255,0)'], [0.5, 'rgba(255,255,255,1)'], [1, 'rgba(255,255,255,0)']]);
    c.fill();
  },
  soul(c) {
    const g = c.createRadialGradient(8, 8, 0.5, 8, 8, 8);
    g.addColorStop(0, '#ffffff'); g.addColorStop(0.35, '#e1bee7'); g.addColorStop(1, 'rgba(171,71,188,0)');
    Art.ell(c, 8, 8, 8, 8, g);
  },
  dot(c) { Art.ell(c, 4, 4, 4, 4, '#fff'); },
  petal(c) { Art.ell(c, 4, 3, 4, 2.4, '#ffc1d9'); Art.ell(c, 3, 2.6, 1.8, 1, '#ffe3ee'); },
  grass(c, w, h) {
    c.fillStyle = '#2f5d2a'; c.fillRect(0, 0, w, h);
    for (let i = 0; i < 90; i++) {
      const x = Math.random() * w, y = 4 + Math.random() * (h - 4);
      c.strokeStyle = ['#3c7a33', '#27501f', '#4b8f3c'][i % 3]; c.lineWidth = 1.2;
      c.beginPath(); c.moveTo(x, y); c.lineTo(x + 1.5, y - 4); c.stroke();
    }
  },
  path(c, w, h) {
    c.fillStyle = Art.grad(c, 0, 0, w, 0, [[0, '#6a4a3a'], [0.12, '#8a6650'], [0.88, '#8a6650'], [1, '#6a4a3a']]);
    c.fillRect(0, 0, w, h);
    for (let i = 0; i < 70; i++) {
      Art.ell(c, 16 + Math.random() * (w - 32), 3 + Math.random() * (h - 6), 1 + Math.random() * 2.2, 0.8 + Math.random() * 1.2,
        ['rgba(60,40,30,0.35)', 'rgba(190,160,130,0.3)'][i % 2]);
    }
    for (let y = 0; y < h; y += 16) {                    // stone kerbs
      [2, w - 12].forEach(x => { Art.rr(c, x, y + 2, 10, 12, 3); c.fillStyle = (y / 16) % 2 ? '#9e9e9e' : '#868686'; c.fill(); });
    }
  },
  lantern(c) {
    Art.shadow(c, 12, 38, 9);
    c.fillStyle = '#8d8d8d'; c.fillRect(9, 22, 6, 15); Art.rr(c, 5, 34, 14, 4, 1.5); c.fill();
    Art.rr(c, 5, 12, 14, 11, 2); c.fillStyle = '#a5a5a5'; c.fill();
    c.shadowColor = '#ffb300'; c.shadowBlur = 8; Art.rr(c, 8, 14, 8, 7, 1); c.fillStyle = '#ffd54f'; c.fill(); c.shadowBlur = 0;
    Art.tri(c, [1, 13], [12, 3], [23, 13], '#6d6d6d');
  },
  tree(c) {
    Art.shadow(c, 30, 52, 20);
    c.fillStyle = '#4e342e'; c.fillRect(27, 34, 6, 18);
    [[30, 22, 19], [17, 29, 12], [43, 28, 12], [30, 34, 13]].forEach(([x, y, r], i) => Art.ell(c, x, y, r, r * 0.85, ['#f48fb1', '#f8bbd0', '#f06292', '#f8bbd0'][i]));
    for (let i = 0; i < 16; i++) Art.ell(c, 14 + Math.random() * 32, 10 + Math.random() * 30, 1.6, 1.2, 'rgba(255,255,255,0.6)');
  },
  menuBg(c, w, h) {
    c.fillStyle = Art.grad(c, 0, 0, 0, h, [[0, '#1a1030'], [0.45, '#7b1e3a'], [0.7, '#e2603a'], [1, '#2a1420']]); c.fillRect(0, 0, w, h);
    Art.ell(c, 200, 300, 95, 95, '#ff7043'); Art.ell(c, 200, 300, 82, 82, '#ffab91');
    c.fillStyle = '#3a1830'; c.beginPath(); c.moveTo(0, 400); c.lineTo(70, 320); c.lineTo(140, 380); c.lineTo(230, 300); c.lineTo(320, 385); c.lineTo(400, 330); c.lineTo(400, h); c.lineTo(0, h); c.fill();
    c.fillStyle = '#22101e'; c.beginPath(); c.moveTo(0, 470); c.quadraticCurveTo(200, 400, 400, 470); c.lineTo(400, h); c.lineTo(0, h); c.fill();
  },
  buildAll(scene) {
    const m = (k, w, h) => Art.make(scene, k, w, h, Art[k]);
    m('samurai', 36, 50); m('katana', 12, 36); m('demon', 32, 40); m('zombie', 32, 40); m('oni', 48, 56); m('boss', 130, 126);
    m('spike', 36, 28); m('slash', 48, 48); m('soul', 16, 16); m('dot', 8, 8); m('petal', 8, 6);
    m('grass', 64, 64); m('path', 280, 128); m('lantern', 24, 42); m('tree', 60, 58); m('menuBg', W, H);
  },
};

/* ============================================================
   SHARED SCENE HELPERS
   ============================================================ */
class BaseScene extends Phaser.Scene {
  setupCamera() { this.cameras.main.setOrigin(0, 0).setZoom(R); }
  img(x, y, key) { return this.add.image(x, y, key).setScale(S); }
  sword(x, y) { return this.img(x, y, 'katana').setOrigin(0.52, 0.97); }
  txt(x, y, str, size, color = '#fff', extra = {}) {
    return this.add.text(x, y, str, Object.assign({
      fontFamily: FONT, fontSize: size + 'px', color, fontStyle: 'bold', resolution: R,
    }, extra)).setOrigin(0.5);
  }
  button(x, y, w, h, color, label, size, onTap) {
    const g = this.add.graphics();
    const draw = (pressed) => {
      g.clear();
      g.fillStyle(0x000000, 0.35).fillRoundedRect(x - w / 2, y - h / 2 + 4, w, h, 10);
      g.fillStyle(color, 1).fillRoundedRect(x - w / 2, y - h / 2 + (pressed ? 3 : 0), w, h, 10);
      g.fillStyle(0xffffff, 0.16).fillRoundedRect(x - w / 2 + 3, y - h / 2 + 3 + (pressed ? 3 : 0), w - 6, h * 0.4, 8);
    };
    draw(false);
    const t = this.txt(x, y, label, size);
    const z = this.add.zone(x, y, w, h).setInteractive({ useHandCursor: true });
    let held = false;
    const set = on => { held = on; draw(on); t.y = y + (on ? 3 : 0); };
    z.on('pointerdown', () => set(true));
    z.on('pointerout', () => set(false));
    z.on('pointerup', () => { if (!held) return; set(false); onTap(); });
    return { g, t, z };
  }
}

class BootScene extends BaseScene {
  constructor() { super('Boot'); }
  create() { Art.buildAll(this); this.scene.start('Menu'); }
}

/* ============================================================
   GAME — the run
   ============================================================ */
class GameScene extends BaseScene {
  constructor() { super('Game'); }

  create() {
    this.setupCamera();
    this.dist = 0;                 // distance travelled; drives layout and the progress bar
    this.speedMod = 1;
    this.timeScale = 1;            // 1 normally, eases to CFG.slowScale during the special
    this.slowLeft = 0;
    this.charge = 0;
    this.count = CFG.startArmy;
    this.earned = 0;
    this.wound = 0;                // enemy strikes add up here; each full point costs one samurai
    this.over = false;
    this.fight = false;            // true while the scroll is stopped for the boss
    this.bossDefeated = false;
    this.targetX = W / 2;
    this.armyX = W / 2;
    this.formY = CFG.armyY;
    this.soldiers = [];
    this.enemies = [];
    this.gates = [];
    this.spikes = [];
    this.decor = [];

    this.buildGround();
    this.buildLevel();
    this.buildFx();
    this.buildHud();
    this.syncArmy(true);

    const steer = p => {
      if (p.worldY > 636 && p.worldX > 280) return;        // special button area
      this.targetX = clamp(p.worldX, CFG.steerMin, CFG.steerMax);
    };
    this.input.on('pointerdown', steer);
    this.input.on('pointermove', steer);
  }

  /* ---------- construction ---------- */
  buildGround() {
    this.grass = this.add.tileSprite(W / 2, H / 2, W, H, 'grass').setTileScale(S).setDepth(-20);
    const pw = CFG.pathRight - CFG.pathLeft;
    this.path = this.add.tileSprite(W / 2, H / 2, pw, H, 'path').setTileScale(S).setDepth(-19);
    const fog = this.add.graphics().setDepth(-18);           // distance haze at the top
    fog.fillGradientStyle(0x1a1030, 0x1a1030, 0x1a1030, 0x1a1030, 0.75, 0.75, 0, 0).fillRect(0, 0, W, 200);
    for (let d = 100; d < LEVEL.length + 600; d += 150) {
      const left = (d / 150) % 2 < 1;
      const key = Math.random() < 0.55 ? 'tree' : 'lantern';
      this.decor.push({ d, x: left ? 24 + Math.random() * 12 : W - 24 - Math.random() * 12, obj: this.img(0, -200, key), flat: true });
    }
  }

  buildLevel() {
    LEVEL.gates.forEach(g => {
      const goodLeft = Math.random() < 0.5;
      this.gates.push({
        d: g.d, used: false,
        left: this.makeGate(130, goodLeft ? g.good : g.bad, goodLeft),
        right: this.makeGate(270, goodLeft ? g.bad : g.good, !goodLeft),
      });
    });
    LEVEL.packs.forEach((base, idx) => {
      const n = 6 + idx * 2;
      for (let i = 0; i < n; i++) {
        const demon = Math.random() > 0.45;
        this.addEnemy(demon ? 'demon' : 'zombie', 85 + Math.random() * 230, base + i * 28, (demon ? 5 : 3) + idx);
      }
    });
    LEVEL.onis.forEach((d, idx) => {
      const e = this.addEnemy('oni', W / 2, d, 19 + idx * 8);
      e.souls = 40 + idx * 20; e.r = 8; e.swing = CFG.oni.swingMs;
    });
    LEVEL.spikes.forEach(d => {
      const roll = Math.random();
      if (roll < 0.45) this.addSpike(130, d);
      else if (roll < 0.9) this.addSpike(270, d);
      else { this.addSpike(130, d); this.addSpike(270, d - 60); }
    });
    this.boss = this.addEnemy('boss', W / 2, LEVEL.bossAt, CFG.boss.hp);
    this.boss.r = 50; this.boss.souls = CFG.boss.souls; this.boss.swing = CFG.boss.swingMs;
  }

  makeGate(x, op, good) {
    const col = good ? 0x1e88e5 : 0xe53935, dark = good ? 0x0d47a1 : 0x8e0000;
    const g = this.add.graphics();
    g.fillStyle(col, 0.5).fillRoundedRect(-62, -24, 124, 48, 6);
    g.lineStyle(3, 0xffffff, 0.9).strokeRoundedRect(-62, -24, 124, 48, 6);
    g.fillStyle(dark, 1).fillRect(-66, -30, 8, 60).fillRect(58, -30, 8, 60);     // posts
    g.fillStyle(dark, 1).fillRoundedRect(-72, -38, 144, 10, 3);                    // torii beam
    g.fillStyle(col, 1).fillRoundedRect(-68, -42, 136, 5, 2);
    const label = (op.op === 'x' ? '×' : op.op === '-' ? '−' : '+') + op.n;
    const t = this.txt(0, 0, label, 28, '#fff', { stroke: good ? '#0d2a5c' : '#5c0d0d', strokeThickness: 5 });
    return { x, op, good, obj: this.add.container(x, -200, [g, t]) };
  }

  addEnemy(kind, x, d, hp) {
    const e = { kind, x, d, hp, maxHp: hp, r: 0, strike: 400, seed: Math.random() * 6, obj: this.img(x, -200, kind) };
    this.enemies.push(e);
    return e;
  }

  addSpike(x, d) { this.spikes.push({ x, d, hit: false, obj: this.img(x, -200, 'spike'), flat: true }); }

  buildFx() {
    this.burst = this.add.particles(0, 0, 'dot', {
      speed: { min: 40, max: 150 }, lifespan: { min: 250, max: 480 }, scale: { start: S, end: 0 }, emitting: false,
    }).setDepth(3000);
    this.add.particles(0, 0, 'petal', {
      x: { min: 0, max: W }, y: -10, lifespan: 8000, speedY: { min: 35, max: 80 }, speedX: { min: -25, max: 10 },
      scale: S, rotate: { start: 0, end: 360 }, frequency: 500, alpha: 0.8,
    }).setDepth(3500);
    this.slowTint = this.add.rectangle(W / 2, H / 2, W, H, 0x5e35b1, 1).setAlpha(0).setDepth(3600);
  }

  buildHud() {
    const D = 5000;
    this.hud = this.add.graphics().setDepth(D);
    this.soulIcon = this.img(22, 56, 'soul').setScale(S * 1.2).setDepth(D);
    this.soulText = this.txt(34, 56, '', 16, '#e1bee7', { stroke: '#1a0a20', strokeThickness: 3 }).setOrigin(0, 0.5).setDepth(D);
    this.countText = this.txt(0, 0, '', 15, '#fff', { stroke: '#0d1642', strokeThickness: 4 }).setDepth(D);
    this.specialText = this.txt(336, 676, 'SLOW', 13).setDepth(D + 1);
    this.specialHint = this.txt(130, 662, 'SPECIAL', 10, '#b39ddb').setDepth(D);
    this.add.zone(336, 676, 84, 76).setInteractive().on('pointerdown', () => this.activateSpecial());
  }

  /* ---------- main loop ---------- */
  update(time, delta) {
    if (this.over) return;
    const dt = Math.min(delta, 50) / 1000;                 // real time: steering, samurai attacks
    const slowing = this.slowLeft > 0;
    this.timeScale += ((slowing ? CFG.slowScale : 1) - this.timeScale) * damp(10, dt);
    const wdt = dt * this.timeScale;                       // world time: scroll, enemy attacks

    if (slowing) this.slowLeft = Math.max(0, this.slowLeft - delta);
    this.slowTint.setAlpha((1 - this.timeScale) / (1 - CFG.slowScale) * 0.2);

    this.updateEnemies(wdt);
    this.updateScroll(wdt);
    this.updateArmy(time, dt);
    this.updateGates();
    this.updateCombat(dt);
    this.updateHazards(wdt);
    this.updateHud(dt);

    if (this.count <= 0) this.finish(false);
    else if (this.bossDefeated && this.dist >= LEVEL.length) this.finish(true);
  }

  updateScroll(wdt) {
    if (!this.fight) {
      const speed = CFG.baseSpeed * (1 + CFG.speedRamp * this.dist / LEVEL.length) * this.speedMod;
      const step = speed * wdt;
      this.dist += step;
      this.grass.tilePositionY -= step * R;
      this.path.tilePositionY -= step * R;
      this.enemies.forEach(e => { if (e.hold) e.d += step; });
    }
    const place = o => {
      const y = CFG.armyY - (o.d - this.dist);
      o.y = y;
      if (y > H + 80) { o.obj.destroy(); o.gone = true; return; }
      const p = this.persp(y);
      const bob = o.seed !== undefined && !o.r && !o.hold ? Math.sin(this.time.now * 0.02 + o.seed) * 1.5 : 0;
      o.obj.setVisible(y > -90).setPosition(o.x, y + bob).setScale((o.obj.type === 'Container' ? 1 : S) * p).setDepth(o.flat ? y - 30 : y);
    };
    const alive = o => !o.gone;
    this.decor.forEach(place); this.spikes.forEach(place); this.enemies.forEach(place);
    this.gates.forEach(g => {
      [g.left, g.right].forEach(s => { s.d = g.d; place(s); });
      g.y = g.left.y; g.gone = g.left.gone;
    });
    this.decor = this.decor.filter(alive); this.spikes = this.spikes.filter(alive);
    this.enemies = this.enemies.filter(alive); this.gates = this.gates.filter(alive);
    if (!this.fight && !this.bossDefeated && this.boss.y >= 330) this.startBossFight();
  }

  // Far things are drawn smaller.
  persp(y) { return 0.7 + 0.3 * clamp((y - 60) / 500, 0, 1); }

  updateArmy(time, dt) {
    this.armyX += (this.targetX - this.armyX) * damp(12, dt);
    const wantForm = this.fight ? this.boss.y + 92 : CFG.armyY;
    this.formY += (wantForm - this.formY) * damp(5, dt);
    const n = this.soldiers.length, cols = Math.min(5, Math.ceil(Math.sqrt(n || 1)));
    this.soldiers.forEach((s, i) => {
      const col = i % cols, row = Math.floor(i / cols);
      const inRow = Math.min(cols, n - row * cols);
      const wx = this.armyX + (col - (inRow - 1) / 2) * 21;
      const wy = this.formY + row * 18;
      const k = damp(16 - row * 2.5, dt);                 // back rows trail a little
      const lean = clamp((wx - s.x) * 0.02, -0.25, 0.25);
      s.x += (wx - s.x) * k; s.y += (wy - s.y) * k;
      s.lunge *= 1 - damp(14, dt);
      s.pop += (1 - s.pop) * damp(14, dt);
      const bob = Math.sin(time * 0.018 + i * 1.7) * 1.6;
      s.swing = Math.max(0, s.swing - dt / 0.17);
      const p = this.persp(s.y) * s.pop, y = s.y + bob - s.lunge;
      s.img.setPosition(s.x, y).setRotation(lean).setScale(S * p).setDepth(s.y);
      s.blade.setPosition(s.x + 9.5 * p, y + 5.5 * p).setScale(S * p).setDepth(s.y + 0.5)
        .setRotation(0.45 + lean - Math.sin(s.swing * Math.PI) * 2.4);
    });
  }

  updateGates() {
    this.gates.forEach(g => {
      if (g.used || g.y < this.formY - 14) return;
      g.used = true;
      const side = this.armyX < W / 2 ? g.left : g.right;
      const other = side === g.left ? g.right : g.left;
      const before = this.count;
      if (side.op.op === '+') this.count += side.op.n;
      if (side.op.op === '-') this.count = Math.max(0, this.count - side.op.n);
      if (side.op.op === 'x') this.count *= side.op.n;
      const diff = this.count - before;
      this.float(this.armyX, this.formY - 40, (diff >= 0 ? '+' : '−') + Math.abs(diff), side.good ? '#64b5f6' : '#ff5252', 30);
      if (side.good) this.cameras.main.flash(120, 30, 110, 220); else this.cameras.main.flash(120, 120, 20, 20);
      if (!side.good) this.shake(140, 0.006);
      this.tweens.add({ targets: side.obj, alpha: 0, duration: 220 });
      this.tweens.add({ targets: other.obj, alpha: 0.25, duration: 220 });
      this.syncArmy();
    });
  }

  updateCombat(dt) {
    const cd = Stats.attackMs(), dmg = Stats.damage();
    const near = this.enemies.filter(e => e.y > 250 && e.y < H);
    this.soldiers.forEach(s => {
      s.cd -= dt * 1000;
      if (s.cd > 0) return;
      let best = null, bestD = CFG.attackRange;
      near.forEach(e => {
        if (e.hp <= 0) return;
        const d = e === this.boss && this.fight ? 0 : Math.hypot(e.x - s.x, e.y - s.y) - e.r;
        if (d < bestD) { bestD = d; best = e; }
      });
      if (!best) return;
      s.cd = cd * (0.9 + Math.random() * 0.2);
      s.lunge = 7; s.swing = 1;
      this.strike(best, dmg, s);
    });
  }

  strike(e, dmg, s) {
    e.hp -= dmg;
    const spread = e.r ? e.r * 0.6 : 4;
    const hx = e.x + (Math.random() - 0.5) * spread * 2, hy = e.y + (Math.random() - 0.5) * spread;
    const sl = this.img(hx, hy, 'slash').setDepth(2900).setRotation(Math.atan2(e.y - s.y, e.x - s.x) + (Math.random() - 0.5))
      .setScale(S * (e.r ? 1.1 : 0.75));
    this.tweens.add({ targets: sl, alpha: 0, scaleX: sl.scaleX * 1.5, scaleY: sl.scaleY * 1.5, duration: 140, onComplete: () => sl.destroy() });
    e.obj.setTintFill(0xffffff);
    this.time.delayedCall(55, () => { if (e.obj.active) e.obj.clearTint(); });
    if (e.r || Math.random() < 0.5) this.float(hx, hy - 12, fmt(dmg), '#ffeb3b', 13);
    if (e.hp <= 0) this.kill(e);
  }

  kill(e) {
    const gain = e.souls || Stats.soulsPerKill();
    this.earned += gain; Save.souls += gain;
    this.charge = Math.min(CFG.specialMax, this.charge + (e.kind === 'oni' ? 3 : 1));
    const tint = { demon: 0xab47bc, zombie: 0x9ccc65, oni: 0xef5350, boss: 0xab47bc }[e.kind];
    this.burst.setParticleTint(tint);
    this.burst.explode(e.r ? 40 : 10, e.x, e.y);
    const orb = this.img(e.x, e.y, 'soul').setDepth(5001).setScale(S * (e.r ? 2 : 1.2));
    this.tweens.add({ targets: orb, x: 22, y: 56, duration: 520, ease: 'Cubic.in', onComplete: () => {
      orb.destroy();
      this.tweens.add({ targets: this.soulIcon, scale: S * 1.8, duration: 80, yoyo: true });
    } });
    if (e.kind === 'oni') {
      this.speedMod *= CFG.oniSlow;
      this.banner('ONI SLAIN', 'game speed −3%');
      this.shake(180, 0.008);
      Save.save();
    }
    e.obj.destroy(); e.gone = true;
    if (e === this.boss) this.endBossFight();
  }

  // Demons and zombies run at the nearest samurai, stop in reach, and strike on a timer.
  updateEnemies(wdt) {
    const E = CFG.enemy;
    const pack = this.enemies.filter(e => !e.r && !e.gone && e.y > -20);
    pack.forEach(e => {
      let near = null, L = Infinity;
      this.soldiers.forEach(s => { const d = Math.hypot(s.x - e.x, s.y - e.y); if (d < L) { L = d; near = s; } });
      if (!near) { e.hold = false; return; }
      const k = E[e.kind];
      e.hold = L <= E.reach;
      if (!e.hold) {
        const v = k.speed * wdt / L;
        e.x = clamp(e.x + (near.x - e.x) * v, CFG.pathLeft + 12, CFG.pathRight - 12);
        e.d -= (near.y - e.y) * v;
        e.obj.setRotation(clamp((near.x - e.x) * 0.006, -0.2, 0.2));
        return;
      }
      e.obj.setRotation(0);
      e.strike -= wdt * 1000;
      if (e.strike > 0) return;
      e.strike = k.strikeMs;
      this.enemySlash(near.x, near.y, 0.55, e.kind === 'demon' ? 0xea80fc : 0xc5e1a5);
      near.img.setTint(0xff8a80);
      this.time.delayedCall(90, () => { if (near.img.active) near.img.clearTint(); });
      this.wound += k.hit;
      if (this.wound >= 1) { this.wound -= 1; this.lose(1, near); }
    });
    // keep the pack from stacking on one spot
    for (let a = 0; a < pack.length; a++) for (let b = a + 1; b < pack.length; b++) {
      const p = pack[a], q = pack[b], dx = p.x - q.x, dy = q.d - p.d, d = Math.hypot(dx, dy);
      if (d >= 13 || d === 0) continue;
      const push = (13 - d) / 2 / d;
      p.x += dx * push; q.x -= dx * push; p.d -= dy * push; q.d += dy * push;
    }
  }

  updateHazards(wdt) {
    // Oni: club swing on a timer.
    this.enemies.forEach(e => {
      if (e.kind !== 'oni' || e.gone) return;
      e.swing -= wdt * 1000;
      if (e.swing > 0) return;
      let best = null, bestD = CFG.oni.reach;
      this.soldiers.forEach(s => { const d = Math.hypot(s.x - e.x, s.y - e.y); if (d < bestD) { bestD = d; best = s; } });
      if (!best) return;
      e.swing = CFG.oni.swingMs;
      this.enemySlash(e.x, e.y + 14, 1.2, 0xffd54f);
      if (bestD < CFG.oni.hitReach) this.lose(1, best);
    });
    // Spikes.
    this.spikes.forEach(o => {
      if (o.hit || o.y < this.formY - 20) return;
      const s = this.soldiers.find(s => Math.abs(s.x - o.x) < 17 && Math.abs(s.y - o.y) < 13);
      if (!s) return;
      o.hit = true;
      o.obj.setTint(0xff8a80);
      this.lose(1, s);
    });
    // Boss: cleaver sweep.
    if (this.fight && !this.boss.gone) {
      const b = this.boss;
      b.swing -= wdt * 1000;
      b.obj.setRotation(b.swing < 260 ? -0.12 : 0);        // wind-up tell
      if (b.swing <= 0) {
        b.swing = CFG.boss.swingMs;
        this.enemySlash(b.x, b.y + 70, 3.2, 0xffffff);
        this.shake(200, 0.012);
        this.lose(Math.max(CFG.boss.cleave, Math.ceil(this.count * CFG.boss.cleaveShare)));
      }
    }
  }

  /* ---------- army bookkeeping ---------- */
  syncArmy(instant) {
    const want = Math.min(this.count, CFG.maxDrawn);
    while (this.soldiers.length < want) {
      this.soldiers.push({ x: this.armyX + (Math.random() - 0.5) * 30, y: this.formY + 20 + Math.random() * 30,
        cd: Math.random() * 200, lunge: 0, swing: 0, pop: instant ? 1 : 0,
        img: this.img(0, -200, 'samurai'), blade: this.sword(0, -200) });
    }
    while (this.soldiers.length > want) this.dropSoldier(this.soldiers[this.soldiers.length - 1]);
  }

  dropSoldier(s) {
    const i = this.soldiers.indexOf(s);
    if (i < 0) return;
    this.soldiers.splice(i, 1);
    this.burst.setParticleTint(0x5c6bc0);
    this.burst.explode(8, s.x, s.y);
    s.img.destroy(); s.blade.destroy();
  }

  lose(n, victim) {
    if (this.count <= 0) return;
    this.count = Math.max(0, this.count - n);
    const at = victim || this.soldiers[0] || { x: this.armyX, y: this.formY };
    this.float(at.x, at.y - 16, '−' + n, '#ff5252', n > 1 ? 26 : 20);
    if (victim && this.count < CFG.maxDrawn) this.dropSoldier(victim);
    this.syncArmy();
  }

  /* ---------- special ---------- */
  activateSpecial() {
    if (this.over || this.slowLeft > 0 || this.charge < CFG.specialMax) return;
    this.charge = 0;
    this.slowLeft = CFG.slowMs;
    this.cameras.main.flash(180, 150, 110, 255);
    this.banner('SLOW MOTION', '');
  }

  /* ---------- boss ---------- */
  startBossFight() {
    this.fight = true;
    [...this.spikes, ...this.enemies.filter(e => e !== this.boss)].forEach(o => { o.obj.destroy(); o.gone = true; });
    this.gates.forEach(g => { g.left.obj.destroy(); g.right.obj.destroy(); g.gone = true; });
    this.spikes = []; this.gates = []; this.enemies = [this.boss];
    this.bars = [this.add.rectangle(W / 2, -30, W, 60, 0x000000).setDepth(4500), this.add.rectangle(W / 2, H + 30, W, 60, 0x000000).setDepth(4500)];
    this.tweens.add({ targets: this.bars[0], y: 30, duration: 400, ease: 'Cubic.out' });
    this.tweens.add({ targets: this.bars[1], y: H - 30, duration: 400, ease: 'Cubic.out' });
    this.bossName = this.txt(W / 2, 88, 'FAT DEMON', 17, '#fff', { stroke: '#2a0038', strokeThickness: 4 }).setDepth(5001);
    this.bossGhost = 1;
    this.shake(300, 0.008);
  }

  endBossFight() {
    this.fight = false;
    this.bossDefeated = true;
    this.speedMod *= CFG.oniSlow;
    this.bossName.destroy();
    this.tweens.add({ targets: this.bars[0], y: -30, duration: 300 });
    this.tweens.add({ targets: this.bars[1], y: H + 30, duration: 300 });
    this.shake(350, 0.014);
    this.cameras.main.flash(250, 255, 240, 200);
    this.banner('DEMON SLAIN', '+' + CFG.boss.souls + ' souls');
    Save.save();
  }

  /* ---------- fx ---------- */
  shake(ms, amount) { if (CFG.shake > 0) this.cameras.main.shake(ms, amount * CFG.shake); }

  enemySlash(x, y, scale, tint) {
    const sl = this.img(x, y, 'slash').setDepth(2950).setRotation(Math.PI / 2 - 0.8).setScale(S * scale).setTint(tint);
    this.tweens.add({ targets: sl, rotation: Math.PI / 2 + 0.8, alpha: 0, duration: 200, onComplete: () => sl.destroy() });
  }

  float(x, y, str, color, size) {
    const t = this.txt(x, y, str, size, color, { stroke: '#000', strokeThickness: 3 }).setDepth(4000);
    this.tweens.add({ targets: t, y: y - 30, alpha: 0, duration: 550, ease: 'Cubic.out', onComplete: () => t.destroy() });
  }

  banner(title, sub) {
    const t = this.txt(W / 2, 250, title, 30, '#ffd54f', { stroke: '#2a0a14', strokeThickness: 6 }).setDepth(5200).setScale(0.4);
    const s = this.txt(W / 2, 282, sub, 14, '#fff', { stroke: '#2a0a14', strokeThickness: 4 }).setDepth(5200).setAlpha(0);
    this.tweens.add({ targets: t, scale: 1, duration: 220, ease: 'Back.out' });
    this.tweens.add({ targets: s, alpha: 1, duration: 220 });
    this.tweens.add({ targets: [t, s], alpha: 0, delay: 1300, duration: 400, onComplete: () => { t.destroy(); s.destroy(); } });
  }

  /* ---------- hud ---------- */
  updateHud(dt) {
    const g = this.hud; g.clear();
    // progress
    const px = 70, pw = 260, p = clamp(this.dist / LEVEL.length, 0, 1);
    g.fillStyle(0x000000, 0.5).fillRoundedRect(px - 3, 21, pw + 6, 16, 8);
    if (p > 0.004) g.fillStyle(0xff7043, 1).fillRoundedRect(px, 24, pw * p, 10, Math.min(5, pw * p / 2));
    g.fillStyle(0xab47bc, 1).fillCircle(px + pw * (LEVEL.bossAt - 230) / LEVEL.length, 29, 6);     // boss marker
    g.fillStyle(0xffffff, 1).fillCircle(px + pw * p, 29, 4);
    // boss bar
    if (this.fight) {
      const r = clamp(this.boss.hp / this.boss.maxHp, 0, 1), bw = 240, bx = W / 2 - bw / 2;
      this.bossGhost += (r - this.bossGhost) * damp(4, dt);
      g.fillStyle(0x000000, 0.7).fillRoundedRect(bx - 3, 101, bw + 6, 18, 6);
      g.fillStyle(0xffffff, 0.8).fillRect(bx, 104, bw * this.bossGhost, 12);
      g.fillStyle(0xe53935, 1).fillRect(bx, 104, bw * r, 12);
    }
    // special bar + button
    const slowing = this.slowLeft > 0;
    const fill = slowing ? this.slowLeft / CFG.slowMs : this.charge / CFG.specialMax;
    const ready = !slowing && this.charge >= CFG.specialMax;
    g.fillStyle(0x000000, 0.5).fillRoundedRect(27, 673, 206, 16, 8);
    if (fill > 0.005) g.fillStyle(slowing ? 0xb388ff : 0x7c4dff, 1).fillRoundedRect(30, 676, 200 * fill, 10, Math.min(5, 100 * fill));
    const pulse = ready ? 1 + Math.sin(this.time.now * 0.008) * 0.07 : 1;
    g.fillStyle(0x000000, 0.4).fillCircle(336, 679, 33 * pulse);
    g.fillStyle(ready ? 0x7c4dff : slowing ? 0x311b92 : 0x3a3050, 1).fillCircle(336, 676, 32 * pulse);
    g.lineStyle(3, ready ? 0xffffff : 0x8c80a8, ready ? 1 : 0.5).strokeCircle(336, 676, 32 * pulse);
    this.specialText.setText(slowing ? (this.slowLeft / 1000).toFixed(1) : 'SLOW').setAlpha(ready || slowing ? 1 : 0.45);
    this.specialHint.setText(ready ? 'SPECIAL READY' : slowing ? 'SLOW MOTION' : 'SPECIAL');

    this.soulText.setText(Save.souls + (this.earned ? '  +' + this.earned : ''));
    this.countText.setText(this.count).setPosition(this.armyX, this.formY - 30);
  }

  /* ---------- end ---------- */
  finish(win) {
    this.over = true;
    Save.save();
    this.countText.setVisible(false);
    const D = 6000;
    const shade = this.add.rectangle(W / 2, H / 2, W, H, 0x0a0610, 1).setAlpha(0).setDepth(D);
    this.tweens.add({ targets: shade, alpha: 0.78, duration: 350 });
    const title = this.txt(W / 2, 280, win ? 'PATH CLEARED' : 'CLAN WIPED', 38, win ? '#ffd54f' : '#ff5252', { stroke: '#000', strokeThickness: 6 }).setDepth(D + 1).setScale(0.3);
    this.tweens.add({ targets: title, scale: 1, duration: 350, ease: 'Back.out' });
    this.img(W / 2 - 62, 346, 'soul').setScale(S * 1.6).setDepth(D + 1);
    this.txt(W / 2 + 6, 346, '+' + this.earned + ' souls', 24, '#e1bee7').setDepth(D + 1);
    const tap = this.txt(W / 2, 430, 'tap to continue', 16, '#bbb', { fontStyle: 'normal' }).setDepth(D + 1).setAlpha(0);
    this.time.delayedCall(700, () => {
      this.tweens.add({ targets: tap, alpha: 1, duration: 500, yoyo: true, repeat: -1 });
      this.input.once('pointerdown', () => this.scene.start('Menu'));
    });
  }
}

   BOOT
   ============================================================ */
window.samuraiGame = new Phaser.Game({
  type: Phaser.AUTO,
  parent: 'game',
  width: W * R,
  height: H * R,
  backgroundColor: '#120c14',
  scale: { mode: Phaser.Scale.FIT, autoCenter: Phaser.Scale.CENTER_BOTH },
  scene: [BootScene, MenuScene, GameScene],
});
</script>
