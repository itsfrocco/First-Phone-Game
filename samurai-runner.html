      blocked = e;                                           // in its way: the wall shoves the army down the screen
    });
    this.drawCrush(blocked);
    if (blocked && !this.blockedBy) { Sound.play('slam'); this.shake(220, 0.012); this.float(this.armyX, this.formY - 50, 'BLOCKED!', '#ff5252', 24); }
    this.blockedBy = blocked;
    if (blocked) {
      this.push = Math.max(this.push, blocked.y + 26 - CFG.armyY);
      if (Math.random() < 0.08) this.shake(90, 0.005);
      if (this.formY >= CFG.wall.crushY && !this.crushed) {
        this.crushed = true;
        Sound.play('slam'); this.shake(450, 0.02);
        this.float(this.armyX, this.formY - 50, 'CRUSHED', '#ff5252', 30);
        this.count = 0; this.syncArmy();
      }
    } else this.push = Math.max(0, this.push - 45 * wdt);   // free again: the army works its way back up
    // Spikes.
    this.spikes.forEach(o => {
      if (o.hit || o.y < this.formY - 20) return;
      const s = this.soldiers.find(s => Math.abs(s.x - o.x) < 17 && Math.abs(s.y - o.y) < 13);
      if (!s) return;
      o.hit = true;
      o.obj.setTint(0xff8a80); Sound.play('spike');
      this.lose(1, s);
    });
    this.updateBoss(wdt);
  }

  // Boss cycle: shuffle after the army -> wind up (red zone shows where it lands) -> strike -> pause.
  updateBoss(wdt) {
    this.danger.clear();
    if (this.rockG) this.rockG.clear();
    this.boltG.clear();
    const b = this.boss;
    if (!b || !this.fight || b.gone) return;
    const B = b.prof;
    if (B.trickle) {                                         // regular enemies keep arriving
      b.trickleT -= wdt * 1000;
      if (b.trickleT <= 0) {
        b.trickleT = B.trickleMs;
        const [kind, mul] = this.pickFoe();
        this.addEnemy(kind, 85 + Math.random() * 230, this.dist + CFG.armyY + 10, Math.round(b.trickleHp * mul));
      }
    }
    if (B.phase2 && !b.phase2 && !b.powering && b.hp <= b.maxHp * B.phase2) {          // second phase: he powers up first
      Object.assign(b, { powering: true, state: 'powerup', t: B.powerUpMs, style: null, air: false, comboLeft: 0, zones: null, drumsAgain: false });
      this.hazards = [];
      b.obj.setRotation(0);
      Sound.play('warnPower');
    }
    if (b.state === 'powerup') { this.powerUp(b, wdt); return; }
    const haste = b.phase2 ? B.phase2Haste || 1 : 1;
    this.updateLightning(b, wdt);
    b.t -= wdt * 1000 * haste;
    if (b.state === 'roll') { this.bossRoll(b); return; }
    if (b.state === 'barrage') { this.updateBarrage(b, wdt * 1000 * haste); return; }
    if (b.state === 'chase') {
      b.obj.setRotation(0);
      const step = B.speed * haste * wdt;
      b.x = clamp(b.x + clamp(this.armyX - b.x, -step, step), 120, 280);
      if (b.t > 0) return;
      const chance = B.powerChance * (b.phase2 ? 1.6 : 1);
      b.power = chance > 0 && b.swings > 0 && !b.power && Math.random() < chance;
      b.comboLeft = b.power ? 0 : ((b.phase2 && B.phase2Combo) || B.combo || 1) - 1;
      const style = b.power ? this.pickPower(b) : null;
      b.bouncesLeft = style === 'bounce' ? B.bounces - 1 : 0;
      b.drumsAgain = style === 'drums' && b.phase2;
      this.startWind(b, style);
    } else if (b.state === 'wind') {
      const k = clamp(1 - b.t / b.windFull, 0, 1), style = b.style;
      const reach = style === 'bolt' ? B.boltHalf : style ? B.powerReach : B.reach;
      if (style === 'jump' || style === 'fly' || style === 'bounce') {             // leap toward where the army stood
        const h = Math.sin(k * Math.PI);
        b.x = b.fromX + (b.aimX - b.fromX) * k;
        b.obj.y -= h * (b.air ? 130 : 80);
        b.obj.setScale(b.obj.scaleX * (1 + h * 0.25)).setRotation(b.air ? Math.sin(this.time.now * 0.02) * 0.08 : -0.35 * h);
        if (b.air) this.danger.fillStyle(0x000000, 0.28).fillEllipse(b.x, b.y + 50, 70 - h * 30, 22 - h * 9);   // his shadow
      } else b.obj.setRotation((style === 'dash' ? 0.3 : -0.25) * k);
      if (b.zones) this.drawZones(b, k);
      else if (style === 'shellroll') {                      // his path: an orange lane from him to the bottom of the screen
        const R = B.roll;
        b.obj.setRotation(Math.sin(this.time.now * 0.06) * 0.12 * k).setTint(Phaser.Display.Color.GetColor(255, 255 - 90 * k, 255 - 190 * k));
        if (k > 0.45 && b.obj.texture.key === B.key) {           // limbs drawn in (updateRigs), then he is all shell
          b.obj.setTexture(B.key + 'Ball');
          Sound.play('slam'); this.shake(120, 0.008); this.fxDust(b.x, b.y + 50, 10);
          this.burst.setParticleTint(0x8d8d8d); this.burst.explode(14, b.x, b.y + 40);
        }
        this.danger.fillStyle(0xff6d00, 0.12 + 0.28 * k).fillRect(b.aimX - R.half, b.y + 30, R.half * 2, H);
        this.danger.lineStyle(2, 0xffcc80, 0.4 + 0.6 * k).strokeRect(b.aimX - R.half, b.y + 30, R.half * 2, H);
      } else if (style === 'barrage') {                      // the back arms heave up a boulder
        b.obj.setRotation(Math.sin(this.time.now * 0.03) * 0.06 * k);
        if (Math.random() < 0.15) { this.burst.setParticleTint(0x9e9e9e); this.burst.explode(2, b.x + (Math.random() < 0.5 ? -50 : 50), b.obj.y - 70); }
      } else if (style === 'bolt') {                           // a lane of lightning, from him to the bottom of the screen
        this.danger.fillStyle(0xb388ff, 0.14 + 0.3 * k).fillRect(b.aimX - reach, b.y + 30, reach * 2, H);
        this.danger.lineStyle(2, 0xede7f6, 0.4 + 0.6 * k).strokeRect(b.aimX - reach, b.y + 30, reach * 2, H);
        if (Math.random() < 0.3) this.zap(b.aimX + (Math.random() - 0.5) * reach, b.y + 40 + Math.random() * 300, b.aimX + (Math.random() - 0.5) * reach, b.y + 120 + Math.random() * 300, 90);
      } else {
        this.danger.fillStyle(style === 'dash' ? 0x7c4dff : style ? 0xff6d00 : 0xff1744, 0.16 + 0.24 * k).fillEllipse(b.aimX, b.y + 118, reach * 2, 124);
        this.danger.lineStyle(2, 0xff8a80, 0.5 + 0.5 * k).strokeEllipse(b.aimX, b.y + 118, reach * 2, 124);
        if (style === 'dash') this.danger.lineStyle(4, 0xb388ff, 0.3 + 0.6 * k).lineBetween(b.x, b.y + 50, b.aimX, b.y + 110);
      }
      if (b.t > 0) return;
      if (b.zones) { this.zonesStrike(b); return; }
      if (style === 'shellroll') { Object.assign(b, { state: 'roll', t: B.roll.ms, rollHit: false }); b.x = b.aimX; b.obj.clearTint(); Sound.play('roll'); return; }
      if (style === 'barrage') { this.startBarrage(b); return; }
      if (style === 'dash') this.zap(b.x, b.y + 40, b.aimX, b.y + 40, 220);
      if (style !== 'bolt') b.x = b.aimX;
      b.air = false;
      b.obj.setRotation(0);
      if (style === 'bolt') {
        for (let i = 0; i < 4; i++) this.zap(b.aimX + (Math.random() - 0.5) * 30, b.y - 60, b.aimX + (Math.random() - 0.5) * reach * 1.6, H, 260);
        this.cameras.main.flash(120, 200, 170, 255);
      } else {
        this.enemySlash(b.x, b.y + 75, style ? 4.4 : 3.2, B.linger ? 0xd1c4e9 : style ? 0xffab91 : 0xffffff);
        if (!style && B.key === 'genbu') this.clawTrail(b.x + (b.swings % 2 ? -14 : 14), b.y + 80, b.swings % 2 ? 1 : -1);
        this.fxDust(b.aimX, b.y + 100, style ? 16 : 6);
        if (STONY[B.key] || style) this.chips.explode(style ? 10 : 4, b.aimX, b.y + 100);
        if (style) this.cameras.main.flash(90, 255, 225, 190);
      }
      Sound.play(style ? 'slam' : 'swing');
      this.shake(style ? 320 : 200, style ? 0.03 : 0.012);
      if (style && style !== 'bolt') { this.burst.setParticleTint(B.linger ? 0xb388ff : 0xffab91); this.burst.explode(36, b.x, b.y + 95); }
      if (Math.abs(this.armyX - b.aimX) < reach) {
        this.lose(Math.max(B.cleave, Math.ceil(this.count * B.cleaveShare)) * (style ? B.powerMult : 1), null, !!B.linger && (!!style || b.phase2));
      } else { Sound.play('dodge'); this.float(this.armyX, this.formY - 46, 'DODGED', '#80d8ff', 18); }
      if (b.phase2 && B.linger && style !== 'bolt') this.hazards.push({ x: b.aimX, y: b.y + 118, rx: reach, ry: 62, t: B.linger, tick: B.lingerTick });
      b.swings++;
      if (style === 'bounce' && b.bouncesLeft > 0) {         // the belly bounce: straight up again, aimed at where the army is now
        b.bouncesLeft--;
        this.startWind(b, 'bounce', B.bounceWindMs);
        return;
      }
      if (!style && b.comboLeft > 0) {                       // next swing of the combo: a step toward the army, a shorter wind-up
        b.comboLeft--;
        b.x = clamp(b.x + clamp(this.armyX - b.x, -B.comboStep, B.comboStep), 120, 280);
        this.startWind(b, null, B.comboWindMs);
        return;
      }
      b.state = 'recover';
      b.t = B.recoverMs;
    } else if (b.t <= 0) { b.state = 'chase'; b.t = B.chaseMs; }
  }

  // The cutscene between phases: the arena darkens, lightning pours into him, he rises, heals a little and cannot be hurt.
  powerUp(b, wdt) {
    const B = b.prof, ms = wdt * 1000;
    b.t -= ms;
    const k = clamp(1 - b.t / B.powerUpMs, 0, 1);
    b.hp = Math.min(b.maxHp, b.hp + b.maxHp * B.powerUpHeal * ms / B.powerUpMs);
    this.shade.setAlpha(0.6 * Math.min(1, k * 5));
    b.obj.y -= k * 28;
    b.obj.setScale(b.obj.scaleX * (1 + 0.22 * k)).setTint(k > 0.25 ? (B.lava ? 0xffc28a : 0xd9c2ff) : 0xffffff);
    if (B.lava) {                                            // the mountain shakes and lava wells up through his cracks
      if (Math.random() < 0.35) this.fxDust(b.x + (Math.random() - 0.5) * 110, b.obj.y + Math.random() * 50, 1, 0x3a3634);
      if (Math.random() < 0.5) { this.sparks.setParticleTint(Math.random() < 0.5 ? 0xff6d00 : 0xffd180); this.sparks.explode(2, b.x + (Math.random() - 0.5) * 100, b.obj.y + 20 + Math.random() * 50); }
      if (Math.random() < 0.7) { this.burst.setParticleTint(Math.random() < 0.5 ? 0xff6d00 : 0xffd180); this.burst.explode(3, b.x + (Math.random() - 0.5) * 120, b.obj.y + 30 + Math.random() * 40); }
    } else if (Math.random() < 0.25 + k * 0.6) this.zap(b.x + (Math.random() - 0.5) * 320, -10, b.x + (Math.random() - 0.5) * 40, b.obj.y - 20, 200);
    if (!B.lava && Math.random() < 0.6) { const a = Math.random() * 6.28, r = 40 + k * 40; this.zap(b.x + Math.cos(a) * r, b.obj.y + Math.sin(a) * r, b.x + Math.cos(a + 1.2) * r, b.obj.y + Math.sin(a + 1.2) * r, 120); }
    this.shake(120, 0.004 + 0.02 * k);
    this.updateLightning(b, wdt);
    if (b.t > 0) return;
    Object.assign(b, { powering: false, phase2: true, state: 'chase', t: B.chaseMs });
    b.obj.clearTint();
    this.tweens.add({ targets: this.shade, alpha: 0, duration: 500 });
    if (this.stormDark) this.tweens.add({ targets: this.stormDark, alpha: 0.5, duration: 500 });      // the storm closes in for phase 2
    if (!B.lava) for (let i = 0; i < 8; i++) this.zap(b.x, b.y, b.x + Math.cos(i * 0.785) * 190, b.y + Math.sin(i * 0.785) * 190, 320);
    this.burst.setParticleTint(B.lava ? 0xff6d00 : 0xb388ff); this.burst.explode(50, b.x, b.y);
    if (B.lava) b.obj.setTint(0xffd0b0);                     // he stays a little lit by the lava
    this.banner(B.phase2Name, '');
    Sound.play('gong'); Sound.play('slam');
    if (B.lava) this.cameras.main.flash(350, 255, 140, 40); else this.cameras.main.flash(350, 200, 170, 255);
    this.shake(450, 0.03);
  }

  // Begins a wind-up. `style` is null for a plain swing, or the kind of power attack.
  startWind(b, style, ms) {
    const B = b.prof;
    b.style = style;
    b.state = 'wind';
    b.t = b.windFull = ms || (style ? (B.powerWind && B.powerWind[style]) || B.powerWindMs : B.windMs);
    b.fromX = b.x;
    b.aimX = style ? clamp(this.armyX, 100, 300) : b.x;
    b.air = style === 'fly';                                 // in the air he cannot be hit
    b.zones = this.zonesFor(style);
    Sound.play(style ? 'warnPower' : 'warn');
  }

  // Genbu's Shell Roll: down through the army along the marked lane and back up.
  bossRoll(b) {
    const B = b.prof, R = B.roll, k = clamp(1 - b.t / R.ms, 0, 1), down = Math.sin(k * Math.PI) * R.depth;
    const sc = b.obj.displayWidth / 110, hop = Math.abs(Math.sin(k * Math.PI * 7)) * 9 * sc * Math.sin(k * Math.PI);
    const ground = b.obj.y + down + 44 * sc;
    this.danger.fillStyle(0x000000, 0.32).fillEllipse(b.x, ground, 84 * sc - hop, 18 * sc);
    b.obj.y += down - hop; b.obj.setRotation(1.7 * down / (47 * sc)).setDepth(b.obj.y + 40);   // turns as far as it has rolled, back the other way
    if (hop < 1.5 * sc && !b.landed) { b.landed = true; this.shake(70, 0.006); this.burst.setParticleTint(0x9e9e9e); this.burst.explode(5, b.x, ground); }
    else if (hop > 3 * sc) b.landed = false;
    this.danger.fillStyle(0xff6d00, 0.1).fillRect(b.x - R.half, b.y + 30, R.half * 2, down);
    if (Math.random() < 0.6) { this.burst.setParticleTint(0x8d8d8d); this.burst.explode(2, b.x + (Math.random() - 0.5) * 50, ground - 4); }
    if (Math.random() < 0.45) this.fxDust(b.x + (Math.random() - 0.5) * 40, ground - 2, 1);
    if (b.lastMark === undefined || Math.abs(ground - b.lastMark) > 26) { b.lastMark = ground; this.fxMark(b.x, ground, 'puff', 2.2, 1600, 0x1a1410); }
    if (Math.random() < 0.12) {                              // chips of stone thrown off to the sides
      const rk = this.img(b.x + (Math.random() - 0.5) * 40, ground - 6, 'rock').setDepth(ground).setScale(S * (0.7 + Math.random() * 0.6));
      this.tweens.add({ targets: rk, x: rk.x + (Math.random() < 0.5 ? -1 : 1) * (40 + Math.random() * 50), y: rk.y - 20 - Math.random() * 20, rotation: 6, alpha: 0, duration: 450, ease: 'Cubic.out', onComplete: () => rk.destroy() });
    }
    if (!b.rollHit && b.y + down >= this.formY - 30) {
      b.rollHit = true; this.shake(320, 0.025); Sound.play('slam');
      if (Math.abs(this.armyX - b.x) < R.half) this.lose(Math.max(B.cleave, Math.ceil(this.count * B.cleaveShare)) * B.powerMult);
      else { Sound.play('dodge'); this.float(this.armyX, this.formY - 46, 'DODGED', '#80d8ff', 18); }
    }
    if (b.t > 0) return;
    b.obj.setTexture(B.key).setRotation(0);                  // he unfolds again (updateRigs)
    b.lastMark = undefined; this.fxDust(b.x, b.y + 50, 12);
    this.burst.setParticleTint(0x9e9e9e); this.burst.explode(16, b.x, b.y + 40);
    b.swings++; b.state = 'recover'; b.t = B.recoverMs;
  }

  // Limbs of bosses drawn in pieces (RIGS): every frame each piece is put back on the body (its place, size, turn, tint and
  // fade follow the body) and turned for what he is doing: legs step while he walks, front claws rear up and swipe on a plain
  // swing, back arms reach back with a rock and hurl it in the barrage, all limbs draw into the shell before a roll and come
  // back out after, and both claws go up while he powers up.
  updateRigs(wdt) {
    (this.bosses || []).forEach(b => {
      if (!RIGS[b.kind] || b.rigDone) return;
      const o = b.obj, RG = RIGS[b.kind];
      if (!b.rig) b.rig = { parts: RG.parts.map(d => ({ d, img: this.add.image(0, 0, d.key).setOrigin(d.o[0] / d.w, d.o[1] / d.h),
        rock: d.hand ? this.img(0, 0, 'boulder').setVisible(false) : null })), walk: 0, phase: 0, out: 1, hands: {}, sw: b.swings, swipe: null };
      const g = b.rig;
      if (!o.active) { g.parts.forEach(p => { p.img.destroy(); if (p.rock) p.rock.destroy(); }); b.rigDone = true; return; }
      const ms = wdt * 1000, now = this.time.now, st = b.state, fighting = this.fight && this.boss === b;
      const ease = f => f * f * (3 - 2 * f);
      // walking: a heavy step while he follows the army, a slow plod while he waits up the road
      const moved = Math.abs(b.x - (g.px === undefined ? b.x : g.px)); g.px = b.x;
      const want = !fighting ? 0.5 : st === 'chase' ? Math.min(1, 0.45 + moved / Math.max(wdt, 0.001) / 40) : 0;
      g.walk += (want - g.walk) * Math.min(1, ms / 150);
      g.phase += ms * 0.008 * (0.4 + g.walk);
      const sw = Math.sin(g.phase);
      if (fighting && g.walk > 0.4 && g.out > 0.98 && Math.sign(sw) !== Math.sign(g.lastSw || 0)) {      // a foot comes down
        this.fxDust(o.x + Math.sign(sw) * RG.foot[0] * R * o.scaleX, o.y + RG.foot[1] * R * o.scaleY, 2);
      }
      g.lastSw = sw;
      // limbs out (1) or drawn into the shell (0)
      let out = o.texture.key === b.kind ? 1 : 0;
      if (st === 'wind' && b.style === 'shellroll') out = Math.min(out, clamp(1 - (1 - b.t / b.windFull) / 0.45, 0, 1));
      g.out = out < g.out ? out : Math.min(out, g.out + ms / 380);
      if (g.out > 0.98) o.y -= Math.abs(sw) * 2.4 * g.walk;   // the body rises and falls with each step
      // a swing has just landed: that arm follows through across his body (both arms after a power attack)
      const plain = st === 'wind' && !b.style;
      const power = st === 'wind' && b.style && b.style !== 'barrage' && b.style !== 'shellroll';
      if (b.swings !== g.sw) { if (g.wasPlain) g.swipe = { side: g.side, t: 0 }; else if (g.wasPower) g.swipe = { side: 0, t: 0 }; g.sw = b.swings; }
      if (plain) g.side = RG.strike === 'alt' ? (b.swings % 2 ? -1 : 1) : RG.strike;
      g.wasPlain = plain; g.wasPower = power;
      if (g.swipe && (g.swipe.t += ms) > 420) g.swipe = null;
      // the barrage clock: the wind-up counts up to 0, then rocks leave one after another
      const A = b.prof.barrage;
      const bt = st === 'barrage' ? b.bt : st === 'wind' && b.style === 'barrage' ? -b.t : null;
      const nRocks = b.rocks ? b.rocks.length : A ? (b.phase2 ? A.n2 : A.n) : 0;
      const pu = st === 'powerup' ? clamp(1 - b.t / b.prof.powerUpMs, 0, 1) : 0;
      const sc = R * o.scaleX, scy = R * o.scaleY, cos = Math.cos(o.rotation), sin = Math.sin(o.rotation);
      const grow = 0.35 + 0.65 * g.out;
      g.parts.forEach(p => {
        const d = p.d, s = d.side;
        let a = 0, sx = 1, sy = 1, dy = 0, hold = false;
        if (d.role === 'leg') {
          a = s * sw * 0.32 * g.walk;
          dy = -Math.max(0, s * sw) * 5 * g.walk;
        } else if (d.role === 'arm') {
          const up = d.raise || 1.3, wk = ease(clamp(1 - b.t / (b.windFull || 1), 0, 1));
          a = Math.sin(now * 0.004 + s) * 0.06 - s * sw * 0.12 * g.walk;
          if (plain) a = -s * (g.side === s ? up : 0.3) * wk;
          else if (power) a = -s * up * (b.style === 'dash' ? 0.45 : 0.85) * wk + (wk > 0.85 ? Math.sin(now * 0.07 + s) * 0.06 : 0);
          if (g.swipe && (g.swipe.side === s || g.swipe.side === 0) && !(plain && g.side === s)) {
            const f = g.swipe.t / 420, from = g.swipe.side === 0 ? up * 0.85 : up;
            a = s * (f < 0.22 ? -from + (from + 0.8) * ease(f / 0.22) : 0.8 * (1 - ease((f - 0.22) / 0.78)));
          }
          if (st === 'barrage' || (st === 'wind' && b.style === 'barrage')) a = -s * 0.25;
          if (pu) a = -s * (1.35 + Math.sin(now * 0.05) * 0.12) * ease(Math.min(1, pu * 3));
        } else if (d.role === 'wing') {                       // slow beats on the ground, hard and fast in the air
          const fast = b.air || (st === 'wind' && (b.style === 'fly' || b.style === 'feathers'));
          a = -s * (Math.sin(now * (fast ? 0.03 : 0.005) + (fast ? 0 : s)) * (fast ? 0.42 : 0.07) + (fast ? 0.1 : 0));
          if (pu) a = -s * 0.35 * ease(Math.min(1, pu * 3));
        } else if (d.role === 'throw') {
          a = Math.sin(now * 0.003 + s * 2) * 0.07 + sw * 0.05 * g.walk;
          if (bt !== null) {
            let next = null, last = null;
            for (let i = 0; i < nRocks; i++) {
              if ((i % 2 ? 1 : -1) !== s) continue;
              const at = i * A.gap;
              if (at > bt) { if (next === null) next = at - bt; } else last = bt - at;
            }
            if (next !== null && next <= 480) {
              hold = true;
              if (next > 90) { const f = ease((480 - next) / 390); a = s * 0.95 * f; sy = 1 - 0.18 * f; }      // reaching back with the rock
              else { const f = 1 - next / 90; a = s * (0.95 - 1.7 * f); sy = 0.82 + 0.4 * f; }               // the throw
            } else if (last !== null && last < 420) { const f = ease(last / 420); a = -s * 0.75 * (1 - f); sy = 1.22 - 0.22 * f; }
          }
          if (pu) a = s * Math.sin(now * 0.04) * 0.15;
        }
        const ox = d.x * grow, oy = (d.y + dy) * grow, k = g.out;
        const px = o.x + (ox * cos - oy * sin) * sc, py = o.y + (ox * sin + oy * cos) * scy, rot = o.rotation + a * k;
        p.img.setPosition(px, py).setRotation(rot).setScale(o.scaleX * sx * k, o.scaleY * sy * k)
          .setDepth(o.depth + (d.back ? -0.5 : 0.5)).setVisible(o.visible && k > 0.03).setAlpha(o.alpha);
        if (o.isTinted) p.img.setTint(o.tintTopLeft); else p.img.clearTint();
        if (d.hand) {
          const c2 = Math.cos(rot), s2 = Math.sin(rot), hx = d.hand[0] * sx * k, hy = d.hand[1] * sy * k;
          const hand = g.hands[s] = { x: px + (hx * c2 - hy * s2) * sc, y: py + (hx * s2 + hy * c2) * scy };
          p.rock.setVisible(hold && p.img.visible).setPosition(hand.x, hand.y).setDepth(o.depth + 0.6).setScale(o.scaleX * 2);
        }
      });
    });
  }

  // Genbu's Boulder Barrage: rocks thrown up one after another, each falling on a shadow aimed where the army is when it is thrown.
  startBarrage(b) {
    const A = b.prof.barrage, n = b.phase2 ? A.n2 : A.n;
    b.state = 'barrage'; b.bt = 0; b.obj.setRotation(0);
    b.rocks = [...Array(n)].map((_, i) => ({ at: i * A.gap }));
  }
  updateBarrage(b, ms) {
    const B = b.prof, A = B.barrage;
    b.bt += ms;
    b.obj.setRotation(Math.sin(this.time.now * 0.02) * 0.05);
    b.rocks.forEach((r, i) => {
      if (r.done || b.bt < r.at) return;
      if (r.x === undefined) {                                // thrown: up from one of the arms on his back, off the top of the screen
        r.x = clamp(this.armyX + (Math.random() - 0.5) * 30, 90, 310); r.y = this.formY + 6;
        const hand = b.rig && b.rig.hands[i % 2 ? 1 : -1];
        const up = this.img(hand ? hand.x : b.x + (i % 2 ? 46 : -46), hand ? hand.y : b.obj.y - 80, 'boulder').setDepth(2900).setScale(S * 2);
        this.tweens.add({ targets: up, y: -60, rotation: 4, duration: 340, ease: 'Quad.out', onComplete: () => up.destroy() });
        Sound.play('swing');
      }
      const k = clamp((b.bt - r.at) / A.fall, 0, 1), blink = 0.75 + 0.25 * Math.sin(this.time.now * 0.03);
      if (!this.rockG) this.rockG = this.add.graphics().setDepth(2950);      // drawn over the army, or the soldiers would hide it
      this.rockG.fillStyle(0x000000, 0.1 + 0.22 * k).fillEllipse(r.x, r.y, A.r * 2 * (0.4 + 0.6 * k), A.r * (0.4 + 0.6 * k));
      this.rockG.fillStyle(0xff6d00, 0.12 + 0.12 * k).fillEllipse(r.x, r.y, A.r * 2, A.r);
      this.rockG.lineStyle(3, 0xffab40, (0.5 + 0.5 * k) * blink).strokeEllipse(r.x, r.y, A.r * 2, A.r);
      if (k > 0.75 && !r.drop) {                              // the rock in the last moment of its fall
        r.drop = this.img(r.x, r.y - 160, 'boulder').setDepth(2900).setScale(S * 2.4);
        this.tweens.add({ targets: r.drop, y: r.y - 8, duration: A.fall * 0.25, ease: 'Quad.in' });
      }
      if (k < 1) return;
      r.done = true;
      if (r.drop) { const d = r.drop; this.tweens.add({ targets: d, alpha: 0, duration: 250, onComplete: () => d.destroy() }); }
      this.burst.setParticleTint(0x9e9e9e); this.burst.explode(16, r.x, r.y); this.shake(160, 0.012); Sound.play('slam');
      this.fxDust(r.x, r.y, 10); this.chips.explode(8, r.x, r.y - 4); this.fxMark(r.x, r.y + 2, 'crack', 0.75);
      if (Math.abs(this.armyX - r.x) < A.r) this.lose(Math.max(A.hit, Math.ceil(this.count * A.share)));
      else if (i === b.rocks.length - 1) { Sound.play('dodge'); this.float(this.armyX, this.formY - 46, 'DODGED', '#80d8ff', 18); }
      if (b.phase2) this.hazards.push({ x: r.x, y: r.y + 4, rx: A.r, ry: 13, t: A.pool, tick: A.poolTick, every: A.poolTick, share: A.poolShare, lava: true });
    });
    if (b.rocks.every(r => r.done)) { b.swings++; b.state = 'recover'; b.t = B.recoverMs; b.rocks = null; }
  }

  // Attacks that light up every lane but one.
  zonesFor(style) {
    const lanes = (n, half) => {                             // every lane but one; the clear one is never the lane the army is in
      const w = (CFG.pathRight - CFG.pathLeft) / n, xs = [...Array(n)].map((_, i) => CFG.pathLeft + w * (i + 0.5));
      const mine = xs.findIndex(x => Math.abs(this.armyX - x) <= w / 2);
      const options = xs.map((_, i) => i).filter(i => i !== mine);
      const safe = options[Math.floor(Math.random() * options.length)];
      return xs.filter((_, i) => i !== safe).map(x => ({ x, half, lane: true }));
    };
    if (style === 'feathers') return lanes(4, 33);
    if (style === 'drums') return lanes(5, 26);
    if (style === 'rockslide') return lanes(4, 33);
    return null;
  }

  drawZones(b, k) {
    const col = { feathers: 0xff8a80, drums: 0xb388ff, rockslide: 0xffa726 }[b.style], blink = 0.6 + 0.4 * Math.sin(this.time.now * 0.03);
    b.zones.forEach(z => {
      const w = (CFG.pathRight - CFG.pathLeft) / (b.style === 'drums' ? 5 : 4);
      if (b.style === 'rockslide' && Math.random() < 0.08) { this.burst.setParticleTint(0x9e9e8e); this.burst.explode(2, z.x + (Math.random() - 0.5) * 40, b.y + 60); }   // pebbles trickling
      this.danger.fillStyle(col, 0.1 + 0.26 * k).fillRect(z.x - w / 2 + 2, b.y + 40, w - 4, H);
      this.danger.lineStyle(2, col, (0.4 + 0.6 * k) * blink).strokeRect(z.x - w / 2 + 2, b.y + 40, w - 4, H);
      if (b.style === 'drums' && Math.random() < 0.12) this.zap(z.x, b.y + 50 + Math.random() * 200, z.x + (Math.random() - 0.5) * 30, b.y + 150 + Math.random() * 250, 70);
    });
    if (b.style === 'feathers') b.obj.setRotation(Math.sin(this.time.now * 0.04) * 0.15 * k);       // wings beating
    else b.obj.setRotation(Math.sin(this.time.now * 0.05) * 0.1 * k);
  }

  zonesStrike(b) {
    const B = b.prof, style = b.style;
    b.obj.setRotation(0);
    b.zones.forEach(z => {
      if (style === 'feathers') {                            // a rain of razor feathers down the lane
        for (let i = 0; i < 5; i++) {
          const f = this.add.rectangle(z.x + (Math.random() - 0.5) * 50, b.y + 40 - i * 40, 3, 22, 0xffebee).setDepth(2900).setRotation(0.25);
          this.tweens.add({ targets: f, y: H + 40, duration: 320 + i * 40, onComplete: () => f.destroy() });
        }
      } else if (style === 'rockslide') {                    // a boulder thunders down the lane
        const r = this.img(z.x + (Math.random() - 0.5) * 16, b.y + 50, 'boulder').setDepth(2900).setScale(S * 1.7);
        this.tweens.add({ targets: r, y: H + 60, rotation: 9, duration: 520, ease: 'Quad.in', onComplete: () => r.destroy() });
      } else {                                               // the thunder drums: a bolt down every lane but one
        this.zap(z.x, b.y + 20, z.x + (Math.random() - 0.5) * 20, H, 300);
        this.zap(z.x + (Math.random() - 0.5) * 20, b.y + 20, z.x, H, 240);
      }
    });
    if (style === 'drums') { this.cameras.main.flash(120, 200, 170, 255); Sound.play('thunder'); }
    if (style === 'rockslide') Sound.play('roll');
    Sound.play(style === 'feathers' ? 'swing' : 'slam');
    this.shake(260, 0.02);
    if (b.zones.some(z => Math.abs(this.armyX - z.x) < z.half)) {
      this.lose(Math.ceil(Math.max(B.cleave, Math.ceil(this.count * B.cleaveShare)) * B.powerMult), null, style === 'drums');
    } else { Sound.play('dodge'); this.float(this.armyX, this.formY - 46, 'DODGED', '#80d8ff', 18); }
    b.swings++;
    if (b.drumsAgain) {                                      // in his second phase the drums roll twice
      b.drumsAgain = false;
      this.startWind(b, 'drums', B.drumsAgainMs);
      return;
    }
    b.zones = null;
    b.state = 'recover';
    b.t = B.recoverMs;
  }

  pickPower(b) {
    const B = b.prof;
    if (!B.powers) return B.powerStyle;
    const list = B.powers[b.phase2 ? 1 : 0];
    return list[Math.floor(Math.random() * list.length)];
  }

  // The storm stage: lightning flickers in the sky, and on the run to the boss a wave of it sweeps down a marked lane.
  updateStorm(wdt) {
    const ms = wdt * 1000, C = CFG.storm;
    this.skyT -= ms;
    if (this.skyT <= 0) {                                    // distant lightning
      this.skyT = 1800 + Math.random() * 3200;
      this.skyFlash.setAlpha(0.35);
      this.tweens.add({ targets: this.skyFlash, alpha: 0, duration: 260 });
      const x = Math.random() * W;
      this.zap(x, -10, x + (Math.random() - 0.5) * 160, 120 + Math.random() * 120, 240);
      Sound.play('thunder');
    }
    const w = this.wave;
    if (!w) {
      if (this.fight || this.finaleDone) return;             // the waves stop once the boss fight begins
      this.stormT -= ms;
      if (this.stormT > 0) return;
      this.stormT = C.everyMs[0] + Math.random() * (C.everyMs[1] - C.everyMs[0]);
      this.wave = { x: clamp(this.armyX, CFG.steerMin + 20, CFG.steerMax - 20), t: C.warnMs, y: null, done: false };
      Sound.play('warn');
      return;
    }
    w.t -= ms;
    if (w.y === null) {                                      // warning: red lines mark the lane
      const k = clamp(1 - w.t / C.warnMs, 0, 1), blink = 0.55 + 0.45 * Math.sin(this.time.now * 0.03);
      this.danger.fillStyle(0xff1744, 0.08 + 0.14 * k).fillRect(w.x - C.half, 0, C.half * 2, H);
      this.danger.lineStyle(3, 0xff1744, (0.5 + 0.5 * k) * blink).lineBetween(w.x - C.half, 0, w.x - C.half, H).lineBetween(w.x + C.half, 0, w.x + C.half, H);
      if (w.t > 0) return;
      w.y = -40; w.t = C.sweepMs;
      Sound.play('slam'); Sound.play('thunder');
      this.skyFlash.setAlpha(0.5); this.tweens.add({ targets: this.skyFlash, alpha: 0, duration: 300 });
      return;
    }
    w.y = -40 + (H + 80) * clamp(1 - w.t / C.sweepMs, 0, 1); // the wave itself, sweeping top to bottom
    this.waveImg.setVisible(true).setPosition(w.x, w.y).setRotation(Math.PI / 2).setScale(S * 3, S * 2.9);
    this.zap(w.x - C.half, w.y - 30, w.x + C.half, w.y - 30, 140);
    if (Math.random() < 0.6) this.zap(w.x + (Math.random() - 0.5) * C.half * 2, w.y - 120, w.x + (Math.random() - 0.5) * C.half * 2, w.y, 160);
    if (!w.done && w.y >= this.formY) {
      w.done = true;
      this.shake(220, 0.016);
      if (Math.abs(this.armyX - w.x) < C.half + 14) this.lose(Math.max(C.cleave, Math.ceil(this.count * C.cleaveShare)), null, true);
      else { Sound.play('dodge'); this.float(this.armyX, this.formY - 46, 'DODGED', '#80d8ff', 18); }
    }
    if (w.t <= 0) { this.wave = null; this.waveImg.setVisible(false); }
  }

  // A jagged streak of lightning that fades over `life` ms.
  zap(x1, y1, x2, y2, life = 160) {
    const pts = [[x1, y1]], n = Math.max(3, Math.round(Math.hypot(x2 - x1, y2 - y1) / 28));
    for (let i = 1; i < n; i++) {
      const t = i / n;
      pts.push([x1 + (x2 - x1) * t + (Math.random() - 0.5) * 26, y1 + (y2 - y1) * t + (Math.random() - 0.5) * 14]);
    }
    pts.push([x2, y2]);
    this.bolts.push({ pts, t: life, life });
  }

  // Draws lightning, the storm around a second-phase boss, and the lightning left on the ground.
  updateLightning(b, wdt) {
    const ms = wdt * 1000;
    if (b.phase2 && b.prof.lava) {                          // embers rising off him
      if (Math.random() < 0.3) { this.burst.setParticleTint(Math.random() < 0.5 ? 0xff9100 : 0xffd180); this.burst.explode(1, b.x + (Math.random() - 0.5) * 90, b.obj.y + (Math.random() - 0.5) * 80); }
    } else if (b.phase2 && Math.random() < 0.5) {            // storm crackling around him
      const a = Math.random() * 6.28, r = 46 + Math.random() * 16;
      this.zap(b.x + Math.cos(a) * r, b.obj.y + Math.sin(a) * r, b.x + Math.cos(a + 1) * r, b.obj.y + Math.sin(a + 1) * r, 110);
    }
    this.hazards = this.hazards.filter(h => (h.t -= ms) > 0);
    this.hazards.forEach(h => {
      this.danger.fillStyle(h.lava ? 0xff6d00 : 0x7c4dff, 0.3 + Math.random() * 0.12).fillEllipse(h.x, h.y, h.rx * 2, h.ry * 2);
      this.danger.lineStyle(2, h.lava ? 0xffe0b2 : 0xede7f6, 0.7).strokeEllipse(h.x, h.y, h.rx * 2, h.ry * 2);
      if (h.lava) { if (Math.random() < 0.2) { this.burst.setParticleTint(0xffab40); this.burst.explode(1, h.x + (Math.random() - 0.5) * h.rx, h.y); } }
      else if (Math.random() < 0.35) this.zap(h.x + (Math.random() - 0.5) * h.rx * 1.6, h.y + (Math.random() - 0.5) * h.ry, h.x + (Math.random() - 0.5) * h.rx * 1.6, h.y + (Math.random() - 0.5) * h.ry, 100);
      h.tick -= ms;
      if (h.tick <= 0 && Math.abs(this.armyX - h.x) < h.rx) {
        h.tick = h.every || b.prof.lingerTick;
        this.lose(Math.max(1, Math.ceil(this.count * (h.share || b.prof.lingerShare))), null, !h.lava);
      }
    });
  }

  drawBolts(wdt) {
    const g = this.boltG, ms = wdt * 1000;
    this.bolts = this.bolts.filter(z => (z.t -= ms) > 0);
    this.bolts.forEach(z => {
      const a = z.t / z.life;
      [[5, 0x7c4dff, a * 0.6], [2, 0xffffff, a]].forEach(([w, col, al]) => {
        g.lineStyle(w, col, al).beginPath().moveTo(z.pts[0][0], z.pts[0][1]);
        for (let i = 1; i < z.pts.length; i++) g.lineTo(z.pts[i][0], z.pts[i][1]);
        g.strokePath();
      });
    });
  }

  /* ---------- army bookkeeping ---------- */
  syncArmy(instant) {
    const want = Math.min(this.count, CFG.maxDrawn);
    while (this.soldiers.length < want) {
      this.soldiers.push({ x: this.armyX + (Math.random() - 0.5) * 30, y: this.formY + 20 + Math.random() * 30,
        cd: Math.random() * 200, lunge: 0, swing: 0, pop: instant ? 1 : 0,
        img: this.img(0, -200, 'samurai').setTint(this.armorTint), blade: this.sword(0, -200).setTint(this.bladeTint) });
    }
    while (this.soldiers.length > want) this.dropSoldier(this.soldiers[this.soldiers.length - 1]);
  }

  dropSoldier(s) {
    const i = this.soldiers.indexOf(s);
    if (i < 0) return;
    this.soldiers.splice(i, 1);
    this.burst.setParticleTint(0x5c6bc0);
    this.burst.explode(8, s.x, s.y);
    s.img.destroy(); s.blade.destroy();
  }

  // `lightning` losses are halved by the Thunder Armor.
  lose(n, victim, lightning) {
    if (lightning && this.thunderArmor) n = Math.ceil(n / 2);
    if (this.count <= 0) return;
    this.count = Math.max(0, this.count - n);
    Sound.play('lose');
    const at = victim || this.soldiers[0] || { x: this.armyX, y: this.formY };
    this.float(at.x, at.y - 16, '−' + n, '#ff5252', n > 1 ? 26 : 20);
    if (victim && this.count < CFG.maxDrawn) this.dropSoldier(victim);
    this.syncArmy();
  }

  /* ---------- pause ---------- */
  // Freezes the run and shows the pause menu: sound switches, resume, quit.
  // Live hints for a first-time player, each shown once.
  updateTips() {
    const b = this.boss;
    const gate = this.gates.find(g => !g.used && g.y > 200);
    if (gate) return this.tip('gate', 'Slide your finger to steer.\nGo through the BLUE gate to add samurai!', true);
    if (this.enemies.some(e => !e.r && e.kind !== 'wall' && e.y > 330)) this.tip('fight', 'Enemies! Your samurai fight on their own.\nThe bigger your army, the stronger it is.', true);
    if (this.ultCharge >= this.ultMax && !this.ultWave) this.tip('ult', 'Your ULTIMATE is ready!\nFLICK your finger UP to unleash the Dragon Slash.', true);
    if (this.charge >= this.specialMax && this.slowLeft <= 0) this.tip('slow', 'Your SLOW power is ready!\nTap the SLOW button (bottom right) to slow time.', true);
    if (this.fight && b && b.state === 'wind' && b.t < b.windFull * 0.5) {      // once the circle has lit up
      if (!b.style) this.tip('swing', 'RED circle: the boss will strike right there.\nSlide out of it before it lands!');
      else this.tip('power', 'ORANGE circle: a big power attack!\nGet clear fast, it hits twice as hard.');
    }
  }

  tip(key, text, low) {
    if (this.tipsShown[key] || this.paused || this.over) return;
    this.tipsShown[key] = true;
    this.paused = true; this.time.paused = true; this.tweens.pauseAll();
    const before = new Set(this.children.list);
    this.add.rectangle(W / 2, H / 2, W, H, 0x05020c, 0.35).setInteractive();       // swallows touches meant for the game
    const g = this.add.graphics();
    const top = low ? 340 : 92;
    g.fillStyle(0x1c1220, 0.96).fillRoundedRect(24, top, 352, 132, 14).lineStyle(3, 0xffd54f, 0.9).strokeRoundedRect(24, top, 352, 132, 14);
    this.txt(W / 2, top + 48, text, 15, '#fff3e0', { align: 'center', fit: 336, lineSpacing: 4 });
    this.button(W / 2, top + 102, 140, 38, 0x2e7d32, 'GOT IT', 16, () => {
      ui.forEach(o => o.destroy());
      this.paused = false; this.time.paused = false; this.tweens.resumeAll();
    });
    const ui = this.children.list.filter(o => !before.has(o));
    ui.forEach((o, i) => o.setDepth(7000 + i));
  }

  setPaused(on) {
    if (this.over || (on && this.paused)) return;
    this.paused = on;
    this.time.paused = on;
    if (on) this.tweens.pauseAll(); else this.tweens.resumeAll();
    if (this.pauseUi) this.pauseUi.forEach(o => o.destroy());
    this.pauseUi = null;
    if (!on) return;
    const before = new Set(this.children.list);
    this.add.rectangle(W / 2, H / 2, W, H, 0x05020c, 0.7).setInteractive();        // also swallows touches meant for the game
    const g = this.add.graphics();
    g.fillStyle(0x1c1220, 0.97).fillRoundedRect(30, 130, 340, 440, 14);
    g.lineStyle(2, 0xffffff, 0.25).strokeRoundedRect(30, 130, 340, 440, 14);
    this.txt(W / 2, 162, 'PAUSED', 24, '#ffd54f');
    [['Music', 'music'], ['Sound effects', 'sfx'], ['Screen shake', 'shake']].forEach(([label, key], i) => {
      const y = 222 + i * 64;
      this.txt(56, y, label, 18, '#fff', { fit: 186 }).setOrigin(0, 0.5);
      this.button(296, y, 92, 44, Save[key] ? 0x2e7d32 : 0x4a4250, Save[key] ? 'ON' : 'OFF', 17, () => {
        Save[key] = !Save[key]; Save.save(); Sound.applyOptions();
        this.paused = false; this.setPaused(true);           // redraw
      });
    });
    this.button(W / 2, 434, 260, 58, 0x3f9b1f, 'RESUME', 24, () => this.setPaused(false));
    this.button(W / 2, 510, 260, 46, 0x4a3f63, 'QUIT TO SAGAS', 15, () => { Save.save(); this.time.paused = false; this.scene.start('Sagas'); });
    this.pauseUi = this.children.list.filter(o => !before.has(o));
    this.pauseUi.forEach((o, i) => o.setDepth(7000 + i));
  }

  /* ---------- special ---------- */
  activateSpecial() {
    if (!this.started || this.over || this.paused || this.slowLeft > 0 || this.charge < this.specialMax) return;
    this.charge = 0;
    this.slowLeft = CFG.slowMs;
    Sound.play('special');
    this.cameras.main.flash(180, 150, 110, 255);
    this.banner('SLOW MOTION', '');
  }

  /* ---------- ultimate ---------- */
  // Dragon Slash: the clan swings as one and a wave of golden wind sweeps up the whole road.
  activateUlt() {
    if (!this.started || this.over || this.paused || this.ultWave || this.ultCharge < this.ultMax) return;
    this.ultCharge = 0; this.ultUsed++;
    // Of the obstacles, only the nearest `walls` break (those in the army's own lane first).
    const walls = this.enemies.filter(e => e.kind === 'wall' && !e.gone && e.hp > 0 && e.y > -20 && e.y < this.formY + 30)
      .sort((a, b) => (Math.abs(a.x - this.armyX) < CFG.wall.half ? 0 : 1000) - a.y - ((Math.abs(b.x - this.armyX) < CFG.wall.half ? 0 : 1000) - b.y)).slice(0, CFG.ult.walls);
    this.ultWave = { y: this.formY + 30, hit: new Set(), tail: 0, walls };
    Sound.play('ultimate');
    this.cameras.main.flash(260, 255, 214, 110);
    this.shake(450, 0.012);
    this.banner('DRAGON SLASH', '');
    this.soldiers.forEach(s => {                             // every blade goes up with it
      const sl = this.img(s.x, s.y - 14, 'slash').setDepth(2960).setRotation(-Math.PI / 2).setScale(S * 1.2).setTint(0xffe082).setBlendMode(Phaser.BlendModes.ADD);
      this.tweens.add({ targets: sl, y: s.y - 150, alpha: 0, scaleX: S * 2.2, duration: 320, ease: 'Cubic.out', onComplete: () => sl.destroy() });
    });
  }

  updateUlt(dt) {
    const w = this.ultWave, g = this.ultG;
    if (!w) return;
    g.clear();
    w.y -= CFG.ult.speed * dt; w.tail += dt;
    for (const e of [...this.enemies]) {
      if (e.gone || e.hp <= 0 || w.hit.has(e) || e.y < w.y || e.y < -20 || e.y > H + 20) continue;
      w.hit.add(e);
      if (e.kind === 'wall' && !w.walls.includes(e)) continue;
      this.strike(e, e.prof ? e.maxHp * CFG.ult.bossShare : e.hp, { x: e.x, y: e.y + 40 });
      if (e.prof && !e.air && !e.powering) { this.float(e.x, e.y - 50, 'DRAGON SLASH!', '#ffe082', 18); this.shake(250, 0.014); }
    }
    if (w.y < -140) { this.ultWave = null; return; }
    // The wave: a wide crescent, its middle leading, with a fading wake behind it.
    const bow = x => w.y + (x - W / 2) * (x - W / 2) / 700;
    for (let i = 1; i <= 5; i++) g.fillStyle(0xffb300, 0.05).fillRect(0, w.y, W, i * 34);
    for (const [wd, col, a, off] of [[30, 0xff8f00, 0.3, 10], [16, 0xffc107, 0.6, 4], [7, 0xffecb3, 0.95, 0], [3, 0xffffff, 1, -2]]) {
      g.lineStyle(wd, col, a).beginPath().moveTo(-10, bow(-10) + off);
      for (let x = 10; x <= W + 10; x += 20) g.lineTo(x, bow(x) + off + Math.sin(x * 0.07 + w.tail * 40) * 3);
      g.strokePath();
    }
    for (let i = 0; i < 2; i++) {                            // sparks thrown off the edge
      const x = Math.random() * W, sp = this.img(x, bow(x), 'dot').setDepth(2971).setScale(S * (0.6 + Math.random())).setTint(0xffe082).setBlendMode(Phaser.BlendModes.ADD);
      this.tweens.add({ targets: sp, y: sp.y + 60 + Math.random() * 60, alpha: 0, duration: 380, onComplete: () => sp.destroy() });
    }
  }

  /* ---------- boss ---------- */
  startFight() {
    const P = this.boss.prof;
    this.fight = true;
    Music.set(this.L.storm ? 'stormBoss' : 'boss'); Sound.play('gong');
    if (!P.trickle) {                                        // final bosses fight alone
      const keep = this.bosses.filter(b => !b.gone);
      [...this.spikes, ...this.enemies.filter(e => !keep.includes(e))].forEach(o => { o.obj.destroy(); o.gone = true; });
      this.gates.forEach(g => { g.left.obj.destroy(); g.right.obj.destroy(); g.gone = true; });
      this.spikes = []; this.gates = []; this.enemies = keep;
    }
    if (this.bars) this.bars.forEach(o => o.destroy());
    this.bars = [this.add.rectangle(W / 2, -30, W, 60, 0x000000).setDepth(4500), this.add.rectangle(W / 2, H + 30, W, 60, 0x000000).setDepth(4500)];
    this.tweens.add({ targets: this.bars[0], y: 30, duration: 400, ease: 'Cubic.out' });
    this.tweens.add({ targets: this.bars[1], y: H - 30, duration: 400, ease: 'Cubic.out' });
    this.bossName = this.txt(W / 2, 88, P.name, 17, '#fff', { stroke: '#2a0038', strokeThickness: 4 }).setDepth(5001);
    this.bossGhost = 1;
    this.shake(300, 0.008);
  }

  // Called when the current big fight is won; the run resumes toward the next one, if any.
  endFight() {
    const P = this.boss.prof;
    this.fight = false;
    this.bolts = []; this.hazards = []; this.shade.setAlpha(0);
    this.boss = this.bosses.find(b => !b.gone) || null;
    this.finaleDone = !this.boss;
    Music.set(this.L.storm ? 'storm' : 'run'); Sound.play('gong');
    if (this.finaleDone) {                                   // nothing is left to fight on the way to the finish
      this.speedMod *= CFG.bossSlow;
      [...this.enemies, ...this.spikes].forEach(o => { if (!o.gone) { o.obj.destroy(); o.gone = true; } });
      this.enemies = []; this.spikes = [];
    }
    this.bossName.destroy();
    this.tweens.add({ targets: this.bars[0], y: -30, duration: 300 });
    this.tweens.add({ targets: this.bars[1], y: H + 30, duration: 300 });
    this.shake(350, 0.014);
    this.cameras.main.flash(250, 255, 240, 200);
    this.banner(P.slain, '+' + P.souls + ' coins');
    Save.save();
  }

  /* ---------- fx ---------- */
  shake(ms, amount) { if (Save.shake && CFG.shake > 0) this.cameras.main.shake(ms, amount * CFG.shake); }

  // Sparks where a blade lands, and stone chips off anything made of rock.
  fxHit(x, y, e, n = 3) {
    const stony = STONY[e.kind] || e.mat === 'stone' || (e.kind === 'wall' && e.mat !== 'log');
    this.sparks.setParticleTint(stony ? 0xffd9a0 : 0xfff6c8); this.sparks.explode(n, x, y);
    if (stony && Math.random() < 0.6) this.chips.explode(Math.ceil(n / 3), x, y);
  }
  // Three glowing claw marks raked across the ground (Genbu's front claws).
  clawTrail(x, y, dir) {
    [-11, 0, 11].forEach((dx, i) => {
      const sl = this.img(x + dx, y + i * 3 - 3, 'slash').setDepth(2951).setScale(S * 1.9, S * 2.6).setTint(0xffab40).setBlendMode(Phaser.BlendModes.ADD)
        .setRotation(Math.PI / 2 - 0.6 * dir);
      this.tweens.add({ targets: sl, rotation: Math.PI / 2 + 0.6 * dir, alpha: 0, duration: 260, delay: i * 25, onComplete: () => sl.destroy() });
    });
    this.sparks.setParticleTint(0xffab40); this.sparks.explode(10, x, y);
  }
  // A cloud of dust or smoke (`tint` defaults to the colour of this level's ground).
  fxDust(x, y, n, tint = this.dustTint) { this.smoke.setParticleTint(tint); this.smoke.explode(n, x, y); }
  // A mark left on the ground for a moment: a crack, or a scorch from the shell roll.
  fxMark(x, y, key, scale, ms = 2400, tint) {
    const m = this.img(x, y, key).setDepth(-8).setScale(S * scale).setRotation(Math.random() * 6.28);
    if (tint !== undefined) m.setTint(tint).setAlpha(0.4);
    this.tweens.add({ targets: m, alpha: 0, delay: ms * 0.7, duration: ms * 0.3, onComplete: () => m.destroy() });
  }

  enemySlash(x, y, scale, tint) {
    const sl = this.img(x, y, 'slash').setDepth(2950).setRotation(Math.PI / 2 - 0.8).setScale(S * scale).setTint(tint);
    this.tweens.add({ targets: sl, rotation: Math.PI / 2 + 0.8, alpha: 0, duration: 200, onComplete: () => sl.destroy() });
  }

  // A blade of wind from a samurai to a wall ahead.
  // The Range upgrade: a crescent of wind flies from the samurai and lands its hit on arrival. The foe is
  // marked so other samurai do not all fire at one that is already as good as dead.
  windSlash(s, e, dmg) {
    const dist = Math.hypot(e.x - s.x, e.y - s.y), ms = 1000 * dist / CFG.slashSpeed;
    const sl = this.img(s.x, s.y - 14, 'slash').setDepth(2900).setRotation(Math.atan2(e.y - s.y, e.x - s.x)).setScale(S * 0.95).setAlpha(0.95).setTint(this.thunderBlade ? 0xd9a8ff : 0xb3e5fc);
    e.incoming = (e.incoming || 0) + dmg;
    this.tweens.add({ targets: sl, x: e.x, y: e.y, duration: ms, onComplete: () => sl.destroy() });
    this.time.delayedCall(ms, () => {                     // the hit runs on the clock, not the tween
      e.incoming -= dmg;
      if (!e.gone && e.hp > 0 && !this.over) this.strike(e, dmg + this.lightningBonus(e, dmg), s);
    });
  }

  airSlash(s, e) {
    const tx = e.x + clamp(s.x - e.x, -50, 50), sl = this.img(s.x, s.y - 14, 'slash').setDepth(2900).setRotation(-Math.PI / 2).setScale(S * 0.6).setAlpha(0.85).setTint(this.bladeTint);
    this.tweens.add({ targets: sl, x: tx, y: e.y, duration: 110, onComplete: () => sl.destroy() });
  }

  float(x, y, str, color, size) {
    const t = this.txt(x, y, str, size, color, { stroke: '#000', strokeThickness: 3 }).setDepth(4000);
    this.tweens.add({ targets: t, y: y - 30, alpha: 0, duration: 550, ease: 'Cubic.out', onComplete: () => t.destroy() });
  }

  banner(title, sub) {
    const t = this.txt(W / 2, 250, title, 30, '#ffd54f', { stroke: '#2a0a14', strokeThickness: 6 }).setDepth(5200).setScale(0.4);
    const s = this.txt(W / 2, 282, sub, 14, '#fff', { stroke: '#2a0a14', strokeThickness: 4 }).setDepth(5200).setAlpha(0);
    this.tweens.add({ targets: t, scale: 1, duration: 220, ease: 'Back.out' });
    this.tweens.add({ targets: s, alpha: 1, duration: 220 });
    this.tweens.add({ targets: [t, s], alpha: 0, delay: 1300, duration: 400, onComplete: () => { t.destroy(); s.destroy(); } });
  }

  /* ---------- hud ---------- */
  updateHud(dt) {
    const g = this.hud; g.clear();
    // progress
    const px = 70, pw = 260, p = clamp(this.dist / this.L.length, 0, 1);
    g.fillStyle(0x000000, 0.5).fillRoundedRect(px - 3, 21, pw + 6, 16, 8);
    if (p > 0.004) g.fillStyle(0xff7043, 1).fillRoundedRect(px, 24, pw * p, 10, Math.min(5, pw * p / 2));
    this.L.bosses.forEach(b => g.fillStyle(0xab47bc, 1).fillCircle(px + pw * (b.at - 230) / this.L.length, 29, 6));       // big-fight markers
    g.fillStyle(0xffffff, 1).fillCircle(px + pw * p, 29, 4);
    // boss bar
    if (this.fight) {
      const r = clamp(this.boss.hp / this.boss.maxHp, 0, 1), bw = 240, bx = W / 2 - bw / 2;
      this.bossGhost += (r - this.bossGhost) * damp(4, dt);
      g.fillStyle(0x000000, 0.7).fillRoundedRect(bx - 3, 101, bw + 6, 18, 6);
      g.fillStyle(0xffffff, 0.8).fillRect(bx, 104, bw * this.bossGhost, 12);
      g.fillStyle(0xe53935, 1).fillRect(bx, 104, bw * r, 12);
    }
    this.soulText.setText(coins(Save.souls));
    this.earnedText.setText(this.earned ? '+' + coins(this.earned) : '').setX(this.soulText.x + this.soulText.width + 6);
    this.countText.setText(this.count).setPosition(this.armyX, this.formY - 30);
    if (!this.started) return;                             // the upgrade cards cover the bottom until the run begins
    // special bar + button
    const slowing = this.slowLeft > 0;
    const fill = slowing ? this.slowLeft / CFG.slowMs : this.charge / this.specialMax;
    const ready = !slowing && this.charge >= this.specialMax;
    g.fillStyle(0x000000, 0.5).fillRoundedRect(27, 673, 206, 16, 8);
    if (fill > 0.005) g.fillStyle(slowing ? 0xb388ff : 0x7c4dff, 1).fillRoundedRect(30, 676, 200 * fill, 10, Math.min(5, 100 * fill));
    const pulse = ready ? 1 + Math.sin(this.time.now * 0.008) * 0.07 : 1;
    g.fillStyle(0x000000, 0.4).fillCircle(336, 679, 33 * pulse);
    g.fillStyle(ready ? 0x7c4dff : slowing ? 0x311b92 : 0x3a3050, 1).fillCircle(336, 676, 32 * pulse);
    g.lineStyle(3, ready ? 0xffffff : 0x8c80a8, ready ? 1 : 0.5).strokeCircle(336, 676, 32 * pulse);
    this.specialText.setText(slowing ? (this.slowLeft / 1000).toFixed(1) : 'SLOW').setAlpha(ready || slowing ? 1 : 0.45);
    this.specialHint.setText(ready ? 'SPECIAL READY' : slowing ? 'SLOW MOTION' : 'SPECIAL');
    // ultimate bar, just above it
    const uf = this.ultCharge / this.ultMax, uReady = uf >= 1, glow = 0.5 + Math.sin(this.time.now * 0.01) * 0.5;
    g.fillStyle(0x000000, 0.5).fillRoundedRect(27, 643, 206, 16, 8);
    if (uReady) g.lineStyle(2, 0xffffff, 0.4 + glow * 0.6).strokeRoundedRect(27, 643, 206, 16, 8);
    if (uf > 0.005) g.fillStyle(uReady ? (glow > 0.5 ? 0xffd54f : 0xffb300) : 0xc77800, 1).fillRoundedRect(30, 646, 200 * uf, 10, Math.min(5, 100 * uf));
    this.ultHint.setText(uReady ? 'ULTIMATE READY  ▲ FLICK UP' : 'ULTIMATE').setAlpha(uReady ? 0.7 + glow * 0.3 : 0.8);

  }

  /* ---------- end ---------- */
  finish(win) {
    this.over = true;
    const unlocked = win && this.levelNo === Save.level;
    if (unlocked) Save.level++;
    const gearWon = unlocked && this.levelNo === SAGA_LEVELS + 1;   // first win over the saga boss: his armor and sword, equipped
    if (gearWon) Save.armor = Save.weapon = 'thunder';
    Save.save();
    Music.set('off'); Sound.play(win ? 'win' : 'defeat');
    this.countText.setVisible(false);
    const D = 6000;
    const shade = this.add.rectangle(W / 2, H / 2, W, H, 0x0a0610, 1).setAlpha(0).setDepth(D);
    this.tweens.add({ targets: shade, alpha: 0.78, duration: 350 });
    const title = this.txt(W / 2, 280, win ? this.stageName + (this.isSagaBoss ? ' SLAIN' : ' CLEARED') : this.crushed ? 'CLAN CRUSHED' : 'CLAN WIPED', 38, win ? '#ffd54f' : '#ff5252', { stroke: '#000', strokeThickness: 6 }).setDepth(D + 1).setScale(0.3);
    this.tweens.add({ targets: title, scale: 1, duration: 350, ease: 'Back.out' });
    this.img(W / 2 - 62, 346, 'soul').setScale(S * 1.6).setDepth(D + 1);
    this.txt(W / 2 + 6, 346, '+' + coins(this.earned) + ' coins', 24, '#ffe082').setDepth(D + 1);
    const hasNext = this.levelNo < LEVELS.length, nextSaga = SAGAS[Math.floor(this.levelNo / (SAGA_LEVELS + 1))];
    if (unlocked) this.txt(W / 2, 390, !hasNext ? 'MORE LEVELS COMING SOON' : this.isSagaBoss ? (Save.forts > Math.floor((this.levelNo - 1) / (SAGA_LEVELS + 1)) ? nextSaga.toUpperCase() + ' UNLOCKED' : 'NOW DEFEND THE COMPOUND') : this.sagaPos === SAGA_LEVELS - 1 ? 'SAGA BOSS UNLOCKED' : 'LEVEL ' + (this.sagaPos + 2) + ' UNLOCKED', 16, '#fff59d').setDepth(D + 1);
    if (gearWon) this.txt(W / 2, 418, 'WON: THUNDER ARMOR  ·  FUTSU-NO-MITAMA', 13, '#d1c4e9').setDepth(D + 1);
    const tap = this.txt(W / 2, 452, 'tap to continue', 16, '#bbb', { fontStyle: 'normal' }).setDepth(D + 1).setAlpha(0);
    this.time.delayedCall(700, () => {
      this.tweens.add({ targets: tap, alpha: 1, duration: 500, yoyo: true, repeat: -1 });
      this.input.once('pointerdown', () => {
        if (win && (this.sagaPos >= SAGA_LEVELS - 1 || !hasNext)) this.scene.start('Sagas');   // level 3, a saga boss or the newest level beaten: back to the map
        else this.scene.start('Game', { level: this.levelNo + (win ? 1 : 0) });         // on to the next level, or retry this one
      });
    });
  }
}

/* ============================================================
   STRONGHOLD DEFENCE — the stage after a saga's boss. The clan's archers hold the compound wall.
   ============================================================ */
class DefenseScene extends BaseScene {
  constructor() { super('Defense'); }
  init(data) { this.saga = (data && data.saga) || 0; }

  create() {
    this.setupCamera();
    const F = CFG.fort;
    Object.assign(this, {
      started: false, paused: false, over: false, won: false,
      t: 0,                          // world time, ms
      gate: F.gateHp, gateShown: 1, earned: 0,
      charge: 0, slowLeft: 0, timeScale: 1,      // SLOW, as in the run
      ultCharge: 0, ultWave: null, ultUsed: 0,   // the ultimate: Arrow Storm
      fireLeft: 0, rapidLeft: 0, twinLeft: 0, freezeLeft: 0, moreArchers: 0, dmgMod: 1,    // crate boosts
      leftN: 0, recruits: 0, mysteries: 0, barrels: 0, blasts: [], drops: [], missed: 0, caughtHint: false,
      waveNo: 0, boxes: 0, chests: 0, logs: 0, boxT: 1500, chestT: F.chest.firstMs, nextWave: 800,
      doorShut: false, doorBroken: false, doorHp: 0, leaves: [], spawns: [], enemies: [], arrows: [], archers: [],
      aimX: W / 2, targetX: W / 2, startUi: null, pauseUi: null, hurt: 0,
    });
    this.time.paused = false;
    Music.set('run');
    const total = F.waves.reduce((n, w) => n + w[0] + w[2], 0);
    this.specialMax = Math.round(total / F.specials); this.ultMax = Math.round(total / F.ults);

    // The compound's yard: stone from edge to edge, two low walls making three lanes.
    this.add.tileSprite(W / 2, H / 2, W, H, 'yard').setTileScale(S).setDepth(-20);
    const lanes = this.add.graphics().setDepth(-19);
    lanes.fillStyle(0x1565c0, 0.22).fillRect(0, 0, F.laneL, F.wallY).fillStyle(0xf9a825, 0.22).fillRect(F.laneR, 0, W - F.laneR, F.wallY);
    lanes.fillStyle(0x3e2723, 0.16).fillRect(F.laneL, 0, F.laneR - F.laneL, F.wallY);
    [F.laneL, F.laneR].forEach(x => {
      this.add.tileSprite(x, F.wallY / 2, 10, F.wallY, 'divider').setTileScale(S).setDepth(-17);
      for (let y = 90; y < F.wallY - 60; y += 150) this.img(x, y, 'lantern').setScale(S * 0.8).setDepth(-16);
    });
    const fog = this.add.graphics().setDepth(-15);
    fog.fillGradientStyle(0x1a1030, 0x1a1030, 0x1a1030, 0x1a1030, 0.8, 0.8, 0, 0).fillRect(0, 0, W, 170);
    this.txt(F.laneL / 2, 100, 'SUPPLIES', 11, '#bbdefb', { stroke: '#0d1642', strokeThickness: 3, fit: 104 }).setDepth(-14).setAlpha(0.85);
    this.txt((W + F.laneR) / 2, 100, 'PRIZES', 11, '#ffe082', { stroke: '#3a2400', strokeThickness: 3, fit: 104 }).setDepth(-14).setAlpha(0.85);
    this.lane = this.add.graphics().setDepth(-12);            // where the archers are aiming
    this.fort = this.img(W / 2, F.wallY - 14, 'fort').setOrigin(0.5, 0).setDepth(F.wallY + 2);
    this.burst = this.add.particles(0, 0, 'dot', { speed: { min: 40, max: 150 }, lifespan: { min: 250, max: 480 }, scale: { start: S, end: 0 }, emitting: false }).setDepth(3000);
    this.add.particles(0, 0, 'petal', {
      x: { min: 0, max: W }, y: -10, lifespan: 8000, speedY: { min: 35, max: 80 }, speedX: { min: -25, max: 10 },
      scale: S, rotate: { start: 0, end: 360 }, frequency: 500, alpha: 0.8,
    }).setDepth(3500);
    this.slowTint = this.add.rectangle(W / 2, H / 2, W, H, 0x5e35b1, 1).setAlpha(0).setDepth(3600);
    this.hurtTint = this.add.rectangle(W / 2, H / 2, W, H, 0xff1744, 1).setAlpha(0).setDepth(3601);
    this.ultG = this.add.graphics().setDepth(2970).setBlendMode(Phaser.BlendModes.ADD);
    this.iceTint = this.add.rectangle((F.laneL + F.laneR) / 2, F.wallY / 2, F.laneR - F.laneL, F.wallY, 0x4fc3f7, 1).setAlpha(0).setDepth(2960);
    this.blastG = this.add.graphics().setDepth(2965);

    // HUD
    const D = 5000;
    this.hud = this.add.graphics().setDepth(D);
    this.soulIcon = this.img(22, 56, 'soul').setScale(S * 1.2).setDepth(D);
    this.soulText = this.txt(34, 56, '', 16, '#ffe082', { stroke: '#1a0a20', strokeThickness: 3 }).setOrigin(0, 0.5).setDepth(D);
    this.gateText = this.txt(W / 2, 29, '', 11, '#fff', { stroke: '#000', strokeThickness: 3 }).setDepth(D + 1);
    this.waveText = this.txt(W / 2, 57, '', 13, '#fff3e0', { stroke: '#1a0a20', strokeThickness: 3 }).setDepth(D);
    this.boostText = this.txt(W / 2, 76, '', 12, '#ffab91', { stroke: '#1a0a20', strokeThickness: 3 }).setDepth(D);
    this.specialText = this.txt(336, 676, 'SLOW', 13, '#fff', { fit: 62 }).setDepth(D + 1).setVisible(false);
    this.specialHint = this.txt(130, 662, 'SPECIAL', 10, '#b39ddb').setDepth(D).setVisible(false);
    this.ultHint = this.txt(130, 634, 'ULTIMATE', 10, '#ffe082', { fit: 240 }).setDepth(D).setVisible(false);
    this.add.zone(336, 676, 84, 76).setInteractive().on('pointerdown', () => this.activateSpecial());
    const pg = this.add.graphics().setDepth(5100);
    pg.fillStyle(0x000000, 0.45).fillCircle(372, 58, 17).fillStyle(0xffffff, 1).fillRoundedRect(365, 50, 5, 16, 1.5).fillRoundedRect(374, 50, 5, 16, 1.5);
    this.add.zone(372, 58, 48, 48).setDepth(5100).setInteractive({ useHandCursor: true }).on('pointerdown', () => { Sound.unlock(); if (this.started) this.setPaused(true); });

    this.buildDoor();
    this.syncArchers();
    this.showStartUi();

    // Touch: slide to aim the row of archers; a quick flick up looses the ultimate.
    let trail = [];
    this.input.on('pointerdown', p => {
      trail = [];
      if (!this.started && !this.paused && p.worldY > 120 && p.worldY < 505 && !(p.worldX < 124 && p.worldY < 198)) this.beginRun();
    });
    const steer = p => {
      if (!this.started || this.paused) return;
      if ((p.worldY > 636 && p.worldX > 280) || (p.worldY < 84 && p.worldX > 345)) return;       // the SLOW and pause buttons
      this.targetX = p.worldX;
    };
    this.input.on('pointerdown', steer);
    this.input.on('pointermove', p => {
      steer(p);
      if (!this.started || this.paused || !p.isDown) return;
      const now = performance.now();
      trail.push({ x: p.worldX, y: p.worldY, t: now });
      while (now - trail[0].t > CFG.ult.flickMs) trail.shift();
      const up = trail[0].y - p.worldY;
      if (up >= CFG.ult.flickPx && Math.abs(p.worldX - trail[0].x) < up * 0.6) { trail = []; this.activateUlt(); }
    });
  }

  /* ---------- the main gate ---------- */
  buildDoor() {
    const F = CFG.fort, D = F.door, K = F.kinds.leaf;
    [F.laneL, F.laneR].forEach(x => this.add.rectangle(x, D.y - 16, 16, 44, 0x5a5348).setStrokeStyle(2, 0x2b2620).setDepth(D.y + 3));   // gate posts
    [-1, 1].forEach(side => {
      const x = side < 0 ? F.laneL + 8 + K.half : F.laneR - 8 - K.half;
      const e = { kind: 'leaf', K, side, x, y: D.y, hp: D.hp, maxHp: D.hp, cd: 0, seed: 0, name: 'DOOR' };
      e.obj = this.img(x, D.y, K.key).setOrigin(0.5, 1).setScale(S * 0.46, S);       // seen edge-on while it stands open
      e.label = this.txt(x, D.y, '', 12, '#fff', { stroke: '#2b1a14', strokeThickness: 4, align: 'center', lineSpacing: -3 });
      this.enemies.push(e); this.leaves.push(e);
    });
    this.doorText = this.txt(W / 2, D.y - 20, '', 18, '#fff', { stroke: '#2b1a14', strokeThickness: 5 }).setDepth(4001).setVisible(false);
  }
  // The road the enemy can use at the gate: narrower with a leaf shut, the whole lane once the gate is broken.
  roadAt() {
    const F = CFG.fort, mid = W / 2, o = F.door.open;
    if (this.doorBroken) return [F.laneL + 18, F.laneR - 18];
    const shut = side => this.leaves.find(l => l.side === side).shut;
    return [shut(-1) ? mid + 4 : mid - o, shut(1) ? mid - 4 : mid + o];
  }
  shutLeaf(e) {
    const F = CFG.fort, D = F.door;
    e.shut = true;
    e.door = this.img(e.x, D.y, 'doorHalf').setOrigin(0.5, 1).setScale(S * 0.46, S).setDepth(D.y + 2);
    this.tweens.add({ targets: e.door, x: W / 2 + e.side * 42, scaleX: S, duration: 260, ease: 'Cubic.in' });
    Sound.play('slam'); this.shake(260, 0.012);
    if (this.leaves.every(l => l.shut)) {
      this.doorShut = true; this.doorHp = D.barHp;
      this.doorText.setVisible(true);
      this.banner('MAIN GATE SHUT', 'they must break it down first'); Sound.play('gong');
    } else this.banner('ONE DOOR SHUT', 'now the other one');
  }
  hitDoor(e) {
    const D = CFG.fort.door;
    this.doorHp -= e.K.hit;
    if (e.K.big) { Sound.play('slam'); this.shake(200, 0.01); } else if (Math.random() < 0.3) Sound.play('gateHit');
    this.leaves.forEach(l => { l.door.setTint(0xff9a9a); });
    this.time.delayedCall(80, () => this.leaves.forEach(l => { if (l.door && l.door.active) l.door.clearTint(); }));
    if (this.doorHp > 0) return;
    this.doorShut = false; this.doorBroken = true;
    this.doorText.setVisible(false);
    this.leaves.forEach(l => { this.tweens.add({ targets: l.door, y: D.y + 30, alpha: 0, rotation: l.side * 0.6, duration: 350, onComplete: () => l.door.destroy() }); });
    this.burst.setParticleTint(0x8d6748); this.burst.explode(40, W / 2, D.y - 16);
    Sound.play('wallBreak'); this.shake(400, 0.016);
    this.banner('THE GATE IS DOWN', 'here they come');
  }

  /* ---------- before the fight ---------- */
  showStartUi() {
    if (this.startUi) this.startUi.forEach(o => o.destroy());
    const before = new Set(this.children.list);
    const g0 = this.add.graphics();
    g0.fillStyle(0x1c1220, 0.94).fillRoundedRect(24, 150, 352, 208, 14).lineStyle(3, 0xffd54f, 0.9).strokeRoundedRect(24, 150, 352, 208, 14);
    this.txt(W / 2, 182, 'DEFEND THE COMPOUND', 24, '#ffd54f', { stroke: '#2a0a14', strokeThickness: 5 });
    this.txt(W / 2, 258, 'SLIDE to aim your archers. Hold the wall!\nBroken prizes fall: slide under to CATCH.\nLEFT: shoot the blue banner to raise its\nnumber, open ? boxes, blow up barrels.\nRIGHT: prize chests behind logs.\nMIDDLE: shoot both doors to shut the gate.', 13, '#fff3e0', { align: 'center', fontStyle: 'normal', lineSpacing: 3, fit: 344 });
    const hint = this.txt(W / 2, 334, 'touch the road to start', 15, '#fff', { stroke: '#000', strokeThickness: 4 });
    this.tweens.add({ targets: hint, alpha: 0.35, duration: 600, yoyo: true, repeat: -1 });
    this.add.rectangle(W / 2, 618, W, 204, 0x0a0610, 0.75);
    const n = this.archerCount();
    const cards = [
      ['fire', 'ATTACK\nSPEED', 0x2e7d32, (this.fireMs() / 1000).toFixed(2) + 's a shot'],
      ['damage', 'BLADE\nDAMAGE', 0x1565c0, fmt(Stats.damage() * CFG.fort.arrowDmg) + ' per arrow'],
      ['range', 'RANGE', 0xc62828, n + ' archers', Stats.rangeMaxed()],
      ['revenue', 'COIN\nREWARD', 0x6a1b9a, fmt(Stats.soulsPerKill()) + ' per kill'],
    ];
    cards.forEach(([key, title, color, stat, maxed], i) => {
      const x = 52 + i * 98.7, y = 616, w = 92, h = 150, cost = Stats.cost(Save[key], key), can = !maxed && Save.souls >= cost;
      const g = this.add.graphics();
      g.fillStyle(0x1c1220, 0.96).fillRoundedRect(x - w / 2, y - h / 2, w, h, 12);
      g.fillStyle(color, 1).fillRoundedRect(x - w / 2, y - h / 2, w, 34, { tl: 12, tr: 12, bl: 0, br: 0 });
      g.lineStyle(2, 0xffffff, 0.25).strokeRoundedRect(x - w / 2, y - h / 2, w, h, 12);
      this.txt(x, y - h / 2 + 17, title, 11, '#fff', { align: 'center', lineSpacing: -2, fit: 86 });
      this.txt(x, y - 24, 'Lv ' + Save[key], 20);
      this.txt(x, y - 2, stat, 10, '#cfc3d6', { fontStyle: 'normal', fit: 88 });
      const b = this.button(x, y + 42, 80, 40, can ? color : 0x4a4250, maxed ? 'MAX' : coins(cost), 15, () => {
        if (maxed || Save.souls < cost) { Sound.play('deny'); return; }
        Save.souls -= cost; Save[key]++; Save.save(); Sound.play('buy');
        this.time.delayedCall(0, () => { if (!this.started) { this.syncArchers(); this.showStartUi(); } });
      });
      if (!can) b.t.setColor('#9a90a0');
    });
    this.button(54, 96, 84, 34, 0x3a3050, '‹ SAGAS', 13, () => this.scene.start('Sagas'));
    this.startUi = this.children.list.filter(o => !before.has(o));
    this.startUi.forEach((o, i) => o.setDepth(6000 + i));
  }

  beginRun() {
    if (this.started) return;
    this.started = true;
    this.startUi.forEach(o => o.destroy()); this.startUi = null;
    this.specialText.setVisible(true); this.specialHint.setVisible(true); this.ultHint.setVisible(true);
  }

  /* ---------- the archers ---------- */
  archerCount() { return Math.min(CFG.fort.maxArchers, CFG.fort.archers + Math.floor((Save.range - 1) * CFG.fort.perRange) + this.moreArchers); }
  fireMs() { return Stats.attackMs() * CFG.fort.fireMul * (this.rapidLeft > 0 ? CFG.fort.mystery.rapid : 1); }
  arrowDmg() { return Stats.damage() * CFG.fort.arrowDmg * this.dmgMod * (this.fireLeft > 0 ? CFG.fort.fireDmg : 1); }
  syncArchers() {
    const n = this.archerCount();
    while (this.archers.length < n) this.archers.push({ obj: this.img(W / 2, CFG.fort.archerY, 'archer').setDepth(CFG.fort.wallY + 10), cd: Math.random() * this.fireMs() });
    while (this.archers.length > n) this.archers.pop().obj.destroy();
  }

  updateArchers(dt) {
    const F = CFG.fort, n = this.archers.length, front = Math.min(n, F.perRow), half = (front - 1) / 2 * F.spacing;
    this.targetX = clamp(this.targetX, 14 + half, W - 14 - half);
    this.aimX += (this.targetX - this.aimX) * damp(18, dt);
    this.lane.clear().fillStyle(0xfff59d, 0.07).fillRect(this.aimX - half - 9, 0, half * 2 + 18, F.wallY);
    this.archers.forEach((a, i) => {
      const back = i >= F.perRow, k = back ? i - F.perRow : i, m = back ? n - F.perRow : front;      // a second rank stands behind the first
      a.obj.x = this.aimX + (k - (m - 1) / 2) * F.spacing;
      a.obj.y = F.archerY + (back ? 20 : 0) + (a.kick || 0); a.kick = Math.max(0, (a.kick || 0) - 30 * dt);
      a.obj.setDepth(F.wallY + 10 + (back ? 1 : 0));
      if (!this.started) return;
      a.cd -= dt * 1000;
      if (a.cd > 0) return;
      a.cd += this.fireMs(); a.kick = 3;
      const fire = this.fireLeft > 0;
      (this.twinLeft > 0 ? [-4, 4] : [0]).forEach(dx => {       // twin arrows: two a shot
        const obj = this.img(a.obj.x + dx, F.archerY - 26, 'arrow').setDepth(2900).setAlpha(0.95);
        if (fire) obj.setTint(0xff7043).setScale(S * 1.25);
        this.arrows.push({ x: a.obj.x + dx, y: F.archerY - 26, obj, dmg: this.arrowDmg(), pierce: fire ? F.firePierce : 0, hit: new Set() });
      });
      if (Math.random() < 0.2) Sound.play('arrow');
    });
  }

  updateArrows(dt) {
    const sp = CFG.fort.arrowSpeed * dt;
    this.arrows = this.arrows.filter(a => {
      a.y -= sp;
      for (const e of this.enemies) {
        if (e.gone || a.hit.has(e) || Math.abs(e.x - a.x) > e.K.half || a.y > e.y + 4 || a.y < e.y - e.K.tall - sp) continue;
        a.hit.add(e);
        this.strike(e, a.dmg);
        if (a.pierce-- <= 0) { a.obj.destroy(); return false; }
      }
      if (a.y < -30) { a.obj.destroy(); return false; }
      a.obj.y = a.y;
      return true;
    });
  }

  /* ---------- the enemy ---------- */
  spawn(kind, back = 0) {
    const F = CFG.fort, K = Object.assign({ speed: kind === 'logR' ? F.kinds.chest.speed : F.kinds.mystery.speed }, F.kinds[kind.startsWith('log') ? 'log' : kind]);
    const hp = kind === 'banner' ? 1e9 : kind === 'mystery' ? Math.round(F.mystery.hp * (1 + F.mystery.grow * this.mysteries)) : kind === 'barrel' ? Math.round(F.barrel.hp * (1 + F.barrel.grow * this.barrels)) : kind === 'chest' ? Math.round(F.chest.hp * (1 + F.chest.grow * this.chests))
      : kind === 'logL' || kind === 'logR' ? Math.round(F.log.hp * (1 + F.log.grow * this.logs) * (kind === 'logR' ? F.log.chest : 1))
      : Math.max(1, Math.round(K.hp * F.hp * (1 + F.grow * (this.waveNo - 1))));
    const [r0, r1] = this.roadAt();
    const e = { kind, K, x: r0 + Math.random() * (r1 - r0), y: -40 - back, hp, maxHp: hp, cd: K.ms, seed: Math.random() * 9 };
    if (kind === 'warlord') e.x = W / 2;
    if (kind === 'banner' || kind === 'mystery' || kind === 'barrel' || kind === 'logL') e.x = F.laneL / 2 - 3;
    if (kind === 'chest' || kind === 'logR') e.x = (W + F.laneR) / 2 + 3;
    if (K.key === 'log') e.kind = 'log';
    e.obj = this.img(e.x, e.y, K.key).setOrigin(0.5, 1); if (K.scale) e.obj.setScale(S * K.scale);
    if (K.crate) {
      const left = kind === 'banner' || kind === 'mystery' || kind === 'barrel';
      if (kind === 'banner') { e.n = F.banner.start; e.acc = 0; }
      e.boost = left ? kind : e.kind === 'log' ? 'log' : F.chest.prizes[(this.chestN = (this.chestN || 0) + 1) % F.chest.prizes.length];
      if (e.boost === 'archers' && this.archerCount() >= F.maxArchers) e.boost = 'fire';
      if (e.boost === 'repair' && this.gate >= F.gateHp) e.boost = 'sharp';
      e.name = { banner: '', mystery: '?', barrel: 'BOOM', log: '', archers: '+' + F.moreArchers + ' ARCHERS', fire: 'FIRE ARROWS', repair: 'REPAIR', sharp: 'SHARP +' + Math.round(F.sharp * 100) + '%' }[e.boost];
      e.label = this.txt(e.x, e.y, '', kind === 'banner' ? 20 : 12, '#fff', { stroke: kind === 'banner' ? '#0d1642' : kind === 'mystery' ? '#38006b' : kind === 'barrel' ? '#2b0e08' : '#5d3a00', strokeThickness: 4, align: 'center', lineSpacing: -3, fit: 86 });
    } else if (K.big) e.label = this.txt(e.x, e.y, '', kind === 'warlord' ? 18 : 13, '#fff', { stroke: '#7f0000', strokeThickness: 4 });
    this.enemies.push(e);
    return e;
  }

  startWave() {
    const F = CFG.fort, [count, demons, brutes, secs] = F.waves[this.waveNo];
    this.waveNo++;
    const last = this.waveNo === F.waves.length, ms = secs * 1000;
    for (let i = 0; i < count; i++) this.spawns.push({ at: this.t + Math.random() * ms, kind: Math.random() < demons ? 'demon' : 'zombie' });
    for (let i = 0; i < brutes; i++) this.spawns.push({ at: this.t + ms * (i + 0.6) / (brutes + 0.4), kind: 'brute' });
    if (last) this.spawns.push({ at: this.t + ms * 0.45, kind: 'warlord' });
    this.spawns.sort((a, b) => a.at - b.at);
    this.nextWave = this.t + ms + F.gap;
    this.banner(last ? 'FINAL WAVE' : 'WAVE ' + this.waveNo, last ? 'the warlord is coming' : brutes ? (brutes > 1 ? brutes + ' brutes' : 'a brute') + ' in the ranks' : '');
    if (brutes || last) Sound.play('warnPower');
  }

  updateWaves() {
    const F = CFG.fort;
    while (this.spawns.length && this.spawns[0].at <= this.t) {
      const s = this.spawns.shift(), e = this.spawn(s.kind);
      if (s.kind === 'warlord') { Music.set('boss'); Sound.play('gong'); this.shake(400, 0.012); this.banner('THE WARLORD', 'stop him before he reaches the gate'); }
    }
    if (this.waveNo && this.waveNo <= F.waves.length && (this.spawns.length || this.enemies.some(e => !e.gone && !e.K.crate))) {      // the side lanes keep coming while the fight lasts
      if (this.t >= this.boxT) {                              // the left lane: banner, "?" box, banner, barrel, and round again
        this.boxT = this.t + F.left.everyMs;
        let k = F.left.order[this.leftN++ % F.left.order.length];
        if (k === 'banner' && this.archerCount() >= F.maxArchers) k = 'mystery';
        if (k === 'mystery') { this.spawn('logL'); this.spawn('mystery', 44); } else this.spawn(k);
      }
      if (this.t >= this.chestT) { this.chestT = this.t + F.chest.everyMs; this.spawn('logR'); this.spawn('chest', 50); }
    }
    const foes = this.enemies.some(e => !e.gone && !e.K.crate);
    if (this.waveNo < F.waves.length) {
      if (this.t >= this.nextWave || (this.waveNo && !this.spawns.length && !foes && this.t >= this.nextWave - F.gap - 3000)) this.startWave();
    } else if (!this.spawns.length && !foes) this.finish(true);
  }

  updateEnemies(wdt) {
    const F = CFG.fort, now = this.time.now;
    this.enemies = this.enemies.filter(e => {
      if (e.gone) return false;
      const stopY = F.wallY - e.K.stop + (e.K.big ? 14 : 0), D = F.door;
      const held = !e.K.crate && this.doorShut && e.y <= D.y - 4;                  // the shut gate is in the way
      if (!e.K.crate && e.y < D.y) { const [r0, r1] = this.roadAt(), tx = clamp(e.x, r0, r1); e.x += clamp(tx - e.x, -90 * wdt, 90 * wdt); }
      if (!e.K.crate && this.freezeLeft > 0) { /* frozen where it stands */ }
      else if (held && e.y >= D.y - 10 - (e.seed * 3 | 0)) {
        e.cd -= wdt * 1000;
        if (e.cd <= 0) { e.cd = e.K.ms; this.hitDoor(e); }
      } else if (e.y < stopY) e.y = Math.min(held ? D.y - 4 : stopY, e.y + e.K.speed * wdt);
      else if (e.K.crate) {
        if (e.kind === 'banner') this.recruit(e); else if (e.kind === 'chest') this.float(e.x, e.y - 30, 'LOST', '#cfd8dc', 16);
        this.remove(e); return false;
      }
      else {
        e.cd -= wdt * 1000;
        if (e.cd <= 0) { e.cd = e.K.ms; this.hitGate(e); }
      }
      const walk = e.y < stopY && !(this.freezeLeft > 0);
      if (WALKERS[e.kind] && walk && e.obj.active) {         // walking frames, quick for the stronghold's fast crowd
        const key = e.kind + '_' + (Math.floor(now * WALKERS[e.kind] * 1.8 + e.seed * 7) % 4);
        if (e.obj.texture.key !== key) e.obj.setTexture(key);
      }
      e.obj.setPosition(e.x, e.y + (e.K.big && !walk ? Math.max(0, 1 - e.cd / 220) * 10 : 0)).setDepth(e.y)
        .setRotation(e.K.crate ? 0 : Math.sin(now * (walk ? 0.011 : 0.02) + e.seed) * (e.K.big ? 0.04 : 0.09));
      if (e.label) e.label.setPosition(e.x, e.y - (e.K.crate ? e.obj.displayHeight / 2 + 1 : e.obj.displayHeight + 8)).setDepth(e.K.crate ? e.y + 1 : 4000).setText(e.kind === 'banner' ? '+' + e.n + (e.n >= F.banner.max ? '\nMAX' : '') : e.kind === 'log' ? String(Math.ceil(e.hp)) : e.K.crate ? e.name + '\n' + Math.ceil(e.hp) : String(Math.ceil(e.hp)));
      return true;
    });
  }

  hitGate(e) {
    if (this.over) return;
    this.gate = Math.max(0, this.gate - e.K.hit);
    this.hurt = 1;
    Sound.play(e.K.big ? 'slam' : 'gateHit');
    this.shake(e.K.big ? 320 : 90, e.K.big ? 0.016 : 0.004);
    if (e.K.big || Math.random() < 0.5) this.float(e.x, CFG.fort.wallY - 14, '−' + e.K.hit, '#ff5252', e.K.big ? 24 : 15);
    this.fort.setTint(0xff9a9a); this.time.delayedCall(90, () => { if (this.fort.active) this.fort.clearTint(); });
    if (this.gate <= 0) this.finish(false);
  }

  strike(e, dmg) {
    if (e.gone) return;
    if (e.kind === 'banner') this.raiseBanner(e, dmg); else e.hp -= dmg;
    if (!e.flash) {
      e.flash = true;
      if (e.K.big) e.obj.setTint(0xff9a9a); else if (e.kind === 'banner') e.obj.setTint(0xbbdefb); else e.obj.setTintFill(0xffffff);
      this.time.delayedCall(55, () => { if (e.obj.active) e.obj.clearTint(); e.flash = false; });
    }
    if (e.hp <= 0) this.kill(e);
  }

  // Arrows in a recruit banner raise its number; the wall collects whatever it shows.
  raiseBanner(e, dmg) {
    const B = CFG.fort.banner;
    if (e.n >= B.max) return;
    e.acc += dmg;
    for (let step; e.n < B.max && e.acc >= (step = B.hp * Math.pow(B.grow, this.recruits + e.n - B.start)); ) {
      e.acc -= step; e.n++;
      Sound.play('gateGood');
      this.tweens.add({ targets: e.label, scale: 1.5, duration: 90, yoyo: true });
      this.burst.setParticleTint(0x64b5f6); this.burst.explode(6, e.x, e.y - 24);
    }
  }
  recruit(e) {
    const F = CFG.fort, n = Math.min(e.n, F.maxArchers - this.archerCount());
    if (n <= 0) return;
    this.recruits += n; this.moreArchers += n; this.syncArchers();
    Sound.play('buy'); this.float(e.x, e.y - 40, '+' + n + (n > 1 ? ' ARCHERS' : ' ARCHER'), '#bbdefb', 17);
  }
  // A powder barrel shot open rolls to the middle of the road and goes off there.
  updateBlasts() {
    const F = CFG.fort, B = F.barrel;
    this.blasts = this.blasts.filter(b => {
      const k = clamp((this.t - b.t0) / B.rollMs, 0, 1);
      b.obj.setPosition(b.x0 + (W / 2 - b.x0) * k, b.y).setRotation(k * 6.28).setDepth(b.y);
      if (k < 1) return true;
      b.obj.destroy();
      for (const e of [...this.enemies]) {
        if (e.gone || e.K.crate || Math.hypot(e.x - W / 2, e.y - e.K.tall / 2 - b.y) > B.r + e.K.half) continue;
        this.strike(e, e.kind === 'warlord' ? e.maxHp * B.boss : e.kind === 'brute' ? e.maxHp * B.big : e.hp);
      }
      Sound.play('wallBreak'); Sound.play('slam'); this.shake(380, 0.02); this.cameras.main.flash(140, 255, 190, 90);
      this.burst.setParticleTint(0xff9800); this.burst.explode(50, W / 2, b.y);
      const ring = { r: 20, a: 0.85 };
      this.tweens.add({ targets: ring, r: B.r, a: 0, duration: 380, ease: 'Cubic.out',
        onUpdate: () => this.blastG.clear().fillStyle(0xffb74d, ring.a * 0.6).fillCircle(W / 2, b.y, ring.r).lineStyle(5, 0xfff3e0, ring.a).strokeCircle(W / 2, b.y, ring.r),
        onComplete: () => this.blastG.clear() });
      this.float(W / 2, b.y - 30, 'BOOM!', '#ffcc80', 26);
      return false;
    });
  }

  remove(e) { e.gone = true; e.obj.destroy(); if (e.label) e.label.destroy(); if (e.glow) e.glow.destroy(); }

  kill(e) {
    const F = CFG.fort, x = e.x, y = e.y - e.K.tall / 2;
    this.remove(e);
    this.burst.setParticleTint({ zombie: 0x9ccc65, demon: 0xab47bc, brute: 0xef5350, warlord: 0xef5350, mystery: 0xba68c8, barrel: 0xff7043, chest: 0xffd54f, log: 0x8d6e63, leaf: 0x8d6748 }[e.kind]);
    this.burst.explode(e.K.big ? 40 : 10, x, y);
    if (e.K.crate) { this.openCrate(e, x, y); return; }
    Sound.play('kill');
    const raw = e.K.souls || Stats.soulsPerKill() * F.coinShare, gain = Math.floor(raw) + (Math.random() < raw % 1 ? 1 : 0);
    this.earned += gain; Save.souls += gain;
    this.charge = Math.min(this.specialMax, this.charge + (e.K.big ? this.specialMax / 5 : 1));
    if (!this.ultWave) {
      const was = this.ultCharge;
      this.ultCharge = Math.min(this.ultMax, was + (e.K.big ? this.ultMax / 8 : 1));
      if (was < this.ultMax && this.ultCharge >= this.ultMax) { Sound.play('ultReady'); this.float(130, 628, 'ULTIMATE READY!', '#ffe082', 15); }
    }
    if (e.K.big) { this.shake(300, 0.012); this.banner(e.kind === 'warlord' ? 'WARLORD SLAIN' : 'BRUTE DOWN', '+' + gain + ' coins'); if (e.kind === 'warlord') { Sound.play('gong'); this.cameras.main.flash(250, 255, 240, 200); } }
    const orb = this.img(x, y, 'soul').setDepth(5001).setScale(S * (e.K.big ? 2 : 1.2));
    this.tweens.add({ targets: orb, x: 22, y: 56, duration: 520, ease: 'Cubic.in', onComplete: () => { orb.destroy(); Sound.play('soul'); } });
  }

  openCrate(e, x, y) {
    const F = CFG.fort;
    if (e.kind === 'leaf') { this.shutLeaf(e); return; }
    if (e.kind === 'log') { this.logs++; Sound.play('wallBreak'); return; }
    if (e.kind === 'barrel') {
      this.barrels++; Sound.play('gateGood');
      this.blasts.push({ obj: this.img(e.x, e.y - 19, 'barrel'), x0: e.x, y: e.y - 19, t0: this.t });
      return;
    }
    if (e.kind === 'mystery') this.mysteries++; else this.chests++;
    this.dropPrize(e, x, y);
  }
  // The prize falls toward the wall; the archers have to be under it when it arrives.
  dropPrize(e, x, y) {
    const box = e.kind === 'mystery';
    const obj = this.img(x, y, box ? 'mystery' : 'chest').setScale(S * 0.55).setDepth(2950);
    const label = this.txt(x, y, box ? '?' : e.name, box ? 16 : 11, '#fff', { stroke: box ? '#38006b' : '#5d3a00', strokeThickness: 4, align: 'center', fit: 86 }).setDepth(2951);
    const ring = this.add.graphics().setDepth(2949);
    this.drops.push({ kind: e.kind, boost: e.boost, x, y, obj, label, ring });
