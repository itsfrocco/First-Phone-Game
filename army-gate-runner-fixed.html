<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Army Gate Runner</title>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>
<script>
// Fallback if Phaser doesn't load
window.addEventListener('load', () => {
  if (typeof Phaser === 'undefined') {
    document.body.innerHTML = '<div style="color:white;text-align:center;padding:40px;font-family:sans-serif;"><h2>Could not load game engine</h2><p>Make sure you have an internet connection and open this file in a proper browser (Safari or Chrome), not the Files preview.</p></div>';
  }
});
</script>
<style>
  body { margin: 0; background: #111; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; touch-action: none; }
  #game { border-radius: 16px; overflow: hidden; box-shadow: 0 0 40px rgba(0,180,255,0.5); }
</style>
</head>
<body>
<div id="game"></div>
<script>
// Persistent data (loaded from localStorage)
let coins = parseInt(localStorage.getItem('army_coins')) || 500;
let fireRateLevel = parseInt(localStorage.getItem('army_fire')) || 1;
let damageLevel = parseInt(localStorage.getItem('army_damage')) || 1;
let revenueLevel = parseInt(localStorage.getItem('army_revenue')) || 1;

function saveProgress() {
  try {
    localStorage.setItem('army_coins', coins);
    localStorage.setItem('army_fire', fireRateLevel);
    localStorage.setItem('army_damage', damageLevel);
    localStorage.setItem('army_revenue', revenueLevel);
  } catch (e) {
    console.warn('Could not save progress', e);
  }
}

// Save when leaving the page
window.addEventListener('beforeunload', saveProgress);
window.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'hidden') saveProgress();
});

class UpgradeScene extends Phaser.Scene {
  constructor() {
    super({ key: 'UpgradeScene' });
  }

  create() {
    this.cameras.main.setBackgroundColor('#4fc3f7');

    this.add.rectangle(200, 360, 400, 720, 0x4fc3f7);
    this.add.rectangle(200, 420, 320, 420, 0x78909c).setStrokeStyle(5, 0x546e7a);

    this.add.text(200, 50, 'UPGRADES', { fontSize: '36px', color: '#ffffff', fontStyle: 'bold' }).setOrigin(0.5);
    this.coinText = this.add.text(200, 100, '', { fontSize: '26px', color: '#ffeb3b', fontStyle: 'bold' }).setOrigin(0.5);

    // Simple army preview
    for (let i = 0; i < 5; i++) {
      this.add.circle(140 + i * 28, 500, 9, 0x1976d2);
      this.add.circle(140 + i * 28, 486, 7, 0x0d47a1);
    }

    this.makeCard(70, 220, 'FIRE RATE', 0x4caf50, fireRateLevel, () => { fireRateLevel++; });
    this.makeCard(200, 220, 'DAMAGE', 0x2196f3, damageLevel, () => { damageLevel++; });
    this.makeCard(330, 220, 'REVENUE', 0xffc107, revenueLevel, () => { revenueLevel++; });

    const start = this.add.rectangle(200, 620, 240, 70, 0x00e676).setInteractive({ useHandCursor: true });
    this.add.text(200, 620, 'START RUN', { fontSize: '30px', color: '#000000', fontStyle: 'bold' }).setOrigin(0.5);
    start.on('pointerdown', () => this.scene.start('GameScene'));

    this.refreshCoins();
  }

  getCost(level) {
    return Math.floor(40 * Math.pow(1.55, level - 1));
  }

  makeCard(x, y, title, color, level, onUpgrade) {
    const cost = this.getCost(level);
    this.add.rectangle(x, y, 115, 170, color).setStrokeStyle(4, 0xffffff);
    this.add.text(x, y - 60, title, { fontSize: '15px', color: '#fff', fontStyle: 'bold' }).setOrigin(0.5);
    this.add.text(x, y - 25, 'Lv ' + level, { fontSize: '22px', color: '#fff' }).setOrigin(0.5);
    this.add.text(x, y + 15, cost + ' coins', { fontSize: '14px', color: '#fff' }).setOrigin(0.5);

    const btn = this.add.rectangle(x, y + 55, 95, 34, 0x000000, 0.45).setInteractive({ useHandCursor: true });
    this.add.text(x, y + 55, 'UPGRADE', { fontSize: '13px', color: '#fff' }).setOrigin(0.5);

    btn.on('pointerdown', () => {
      if (coins >= cost) {
        coins -= cost;
        onUpgrade();
        saveProgress();
        this.scene.restart();
      }
    });
  }

  refreshCoins() {
    this.coinText.setText('Coins: ' + coins);
  }
}

class GameScene extends Phaser.Scene {
  constructor() {
    super({ key: 'GameScene' });
  }

  create() {
    this.cameras.main.setBackgroundColor('#4fc3f7');
    this.add.rectangle(200, 360, 400, 720, 0x4fc3f7);
    this.add.rectangle(200, 450, 320, 600, 0x607d8b).setStrokeStyle(6, 0x455a64);
    // Road lines
    for (let i = 0; i < 8; i++) {
      this.add.rectangle(200, 300 + i * 70, 8, 30, 0xffffff, 0.4);
    }
    this.add.rectangle(30, 450, 16, 600, 0x37474f);
    this.add.rectangle(370, 450, 16, 600, 0x37474f);

    this.armyCount = 4 + Math.floor(fireRateLevel * 0.7);
    this.coinsEarned = 0;
    this.progress = 0;
    this.over = false;
    this.targetX = 200;
    this.lastShot = 0;
    this.army = [];
    this.gates = [];
    this.enemies = [];
    this.bullets = [];

    this.spawnArmy();
    this.buildGates();
    this.spawnEnemies();

    this.input.on('pointermove', p => { this.targetX = Phaser.Math.Clamp(p.x, 80, 320); });
    this.input.on('pointerdown', p => { this.targetX = Phaser.Math.Clamp(p.x, 80, 320); });

    this.progBg = this.add.rectangle(200, 30, 250, 12, 0x263238);
    this.prog = this.add.rectangle(75, 30, 0, 8, 0x00e676).setOrigin(0, 0.5);
    this.coinLabel = this.add.text(20, 50, '', { fontSize: '18px', color: '#ffeb3b' });
    this.armyLabel = this.add.text(20, 74, '', { fontSize: '16px', color: '#ffffff' });
  }

  spawnArmy() {
    this.army.forEach(s => s.destroy());
    this.army = [];
    const n = Math.min(this.armyCount, 12);
    const cols = Math.min(4, Math.ceil(Math.sqrt(n * 1.1)));
    for (let i = 0; i < n; i++) {
      const col = i % cols;
      const row = Math.floor(i / cols);
      const c = this.add.container(this.targetX + (col - (cols - 1) / 2) * 20, 560 + row * 16);
      
      // Shadow
      const shadow = this.add.ellipse(0, 10, 14, 6, 0x000000, 0.25);
      // Body
      const body = this.add.rectangle(0, 2, 14, 18, 0x1565c0);
      body.setStrokeStyle(1, 0x0d47a1);
      // Helmet
      const helmet = this.add.ellipse(0, -10, 16, 12, 0x0d47a1);
      helmet.setStrokeStyle(1, 0x002171);
      // Visor
      const visor = this.add.rectangle(0, -8, 10, 3, 0x42a5f5);
      // Gun
      const gun = this.add.rectangle(8, 1, 14, 4, 0x212121);
      gun.setStrokeStyle(1, 0x000000);
      
      c.add([shadow, body, helmet, visor, gun]);
      this.physics.add.existing(c);
      c.body.setSize(14, 18);
      this.army.push(c);
    }
  }

  buildGates() {
    const data = [
      { y: 200, bad: {op:'-',n:2}, good: {op:'+',n:4} },
      { y: -150, bad: {op:'-',n:3}, good: {op:'x',n:2} },
      { y: -500, bad: {op:'-',n:4}, good: {op:'+',n:6} },
      { y: -850, bad: {op:'-',n:5}, good: {op:'x',n:2} },
      { y: -1200, bad: {op:'-',n:4}, good: {op:'+',n:8} },
      { y: -1550, bad: {op:'-',n:6}, good: {op:'x',n:3} },
      { y: -1900, bad: {op:'-',n:5}, good: {op:'+',n:10} },
      { y: -2250, bad: {op:'-',n:7}, good: {op:'x',n:2} }
    ];
    data.forEach(d => {
      this.gates.push(this.add.rectangle(200, d.y, 8, 48, 0xffffff));
      // Randomize sides
      const blueOnLeft = Math.random() > 0.5;
      if (blueOnLeft) {
        this.gates.push(this.createGate(110, d.y, d.good, 0x2979ff)); // blue left
        this.gates.push(this.createGate(290, d.y, d.bad, 0xff1744));  // red right
      } else {
        this.gates.push(this.createGate(110, d.y, d.bad, 0xff1744));  // red left
        this.gates.push(this.createGate(290, d.y, d.good, 0x2979ff)); // blue right
      }
    });
  }

  createGate(x, y, op, color) {
    const c = this.add.container(x, y);
    const label = op.op === '+' ? '+' + op.n : op.op === '-' ? '-' + op.n : '×' + op.n;
    
    // Barrier body
    const bg = this.add.rectangle(0, 0, 120, 48, color);
    bg.setStrokeStyle(4, 0xffffff);
    // Inner highlight
    const highlight = this.add.rectangle(0, -8, 110, 16, 0xffffff, 0.25);
    // Posts
    const postL = this.add.rectangle(-55, 0, 8, 52, 0x424242);
    const postR = this.add.rectangle(55, 0, 8, 52, 0x424242);
    
    const txt = this.add.text(0, 0, label, { 
      fontSize: '26px', 
      color: '#ffffff', 
      fontStyle: 'bold',
      stroke: '#000000',
      strokeThickness: 3
    }).setOrigin(0.5);
    
    c.add([postL, postR, bg, highlight, txt]);
    this.physics.add.existing(c);
    c.body.setSize(120, 48);
    c.op = op;
    c.used = false;
    return c;
  }

  spawnEnemies() {
    // More enemies, harder to kill, placed between the widely spaced gates
    const enemySpots = [50, -300, -650, -1000, -1350, -1700, -2050];
    enemySpots.forEach((baseY, idx) => {
      const count = 6 + idx * 2; // more enemies as you go further
      for (let i = 0; i < count; i++) {
        const x = 80 + Math.random() * 240;
        const y = baseY - i * 28;
        const e = this.add.container(x, y);
        // Shadow
        const shadow = this.add.ellipse(0, 9, 12, 5, 0x000000, 0.2);
        // Body
        const body = this.add.rectangle(0, 1, 13, 16, 0xc62828);
        body.setStrokeStyle(1, 0x8e0000);
        // Helmet
        const helmet = this.add.ellipse(0, -9, 15, 11, 0xb71c1c);
        helmet.setStrokeStyle(1, 0x7f0000);
        // Eyes
        const eye = this.add.rectangle(0, -7, 8, 2, 0xffcdd2);
        
        e.add([shadow, body, helmet, eye]);
        this.physics.add.existing(e);
        e.body.setSize(12, 15);
        // Much higher HP
        e.hp = 4 + Math.floor(damageLevel * 0.8) + idx;
        this.enemies.push(e);
      }
    });
  }

  update(time, delta) {
    if (this.over) return;

    const speed = 90;
    this.gates.forEach(g => g.y += speed * delta / 1000);
    this.enemies.forEach(e => e.y += speed * delta / 1000);

    const cols = Math.min(4, Math.ceil(Math.sqrt(this.army.length || 1)));
    this.army.forEach((s, i) => {
      const col = i % cols;
      const want = this.targetX + (col - (cols - 1) / 2) * 18;
      s.x = Phaser.Math.Linear(s.x, want, 0.22);
    });

    const delay = Math.max(70, 200 - fireRateLevel * 18);
    if (time - this.lastShot > delay && this.army.length > 0) {
      this.lastShot = time;
      const s = this.army[Phaser.Math.Between(0, this.army.length - 1)];
      const b = this.add.circle(s.x, s.y - 14, 3, 0xffee58);
      this.physics.add.existing(b);
      b.body.setVelocityY(-480);
      this.bullets.push(b);
    }

    this.bullets = this.bullets.filter(b => b.y > -40);

    // Gate collisions
    this.army.forEach(s => {
      this.gates.forEach(g => {
        if (!g.op || g.used) return;
        if (Math.abs(s.x - g.x) < 50 && Math.abs(s.y - g.y) < 26) {
          if (g.op.op === '+') this.armyCount += g.op.n;
          if (g.op.op === '-') this.armyCount = Math.max(0, this.armyCount - g.op.n);
          if (g.op.op === 'x') this.armyCount = Math.floor(this.armyCount * g.op.n);
          g.used = true;
          this.tweens.add({ targets: g, alpha: 0, duration: 180 });
          this.spawnArmy();
        }
      });
    });

    // Bullets vs enemies
    this.bullets.forEach(b => {
      this.enemies.forEach(e => {
        if (!e.active) return;
        if (Math.abs(b.x - e.x) < 14 && Math.abs(b.y - e.y) < 14) {
          e.hp -= Math.max(1, Math.floor(damageLevel * 0.7));
          b.destroy();
          if (e.hp <= 0) {
            const gain = 6 * revenueLevel;
            this.coinsEarned += gain;
            coins += gain;
            saveProgress();
            e.destroy();
          }
        }
      });
    });

    // Army vs enemies — subtract exactly one soldier per enemy contact
    const hitEnemies = [];
    this.army.forEach(s => {
      this.enemies.forEach(e => {
        if (!e.active || e.hit) return;
        if (Math.abs(s.x - e.x) < 20 && Math.abs(s.y - e.y) < 20) {
          e.hit = true;
          hitEnemies.push(e);
        }
      });
    });

    if (hitEnemies.length > 0) {
      // Only remove one soldier per frame max, or one per enemy but safely
      hitEnemies.forEach(e => {
        if (this.armyCount > 0) {
          this.armyCount = Math.max(0, this.armyCount - 1);
          const txt = this.add.text(e.x, e.y - 10, '-1', { fontSize: '22px', color: '#ff1744', fontStyle: 'bold' }).setOrigin(0.5);
          this.tweens.add({ targets: txt, y: e.y - 40, alpha: 0, duration: 450, onComplete: () => txt.destroy() });
        }
        e.destroy();
      });
      this.spawnArmy();
    }

    this.gates = this.gates.filter(g => g.y < 740);
    this.enemies = this.enemies.filter(e => e.active && e.y < 740);
    this.bullets = this.bullets.filter(b => b.active);

    this.progress = Math.min(100, this.progress + delta * 0.0022);
    this.prog.width = 250 * (this.progress / 100);
    this.coinLabel.setText('Coins: ' + coins + ' (+' + this.coinsEarned + ')');
    this.armyLabel.setText('Army: ' + this.armyCount);
    // Save every few seconds while playing
    if (Math.floor(time / 3000) !== Math.floor((time - delta) / 3000)) {
      saveProgress();
    }

    if (this.armyCount <= 0) this.finish('WIPED OUT');
    if (this.progress >= 100) this.finish('LEVEL CLEAR');
  }

  finish(msg) {
    this.over = true;
    saveProgress();
    this.add.rectangle(200, 360, 400, 720, 0x000000, 0.75);
    this.add.text(200, 300, msg, { fontSize: '34px', color: '#ffffff' }).setOrigin(0.5);
    this.add.text(200, 355, '+' + this.coinsEarned + ' coins', { fontSize: '22px', color: '#ffeb3b' }).setOrigin(0.5);
    this.add.text(200, 420, 'Tap to continue', { fontSize: '18px', color: '#bbbbbb' }).setOrigin(0.5);
    this.input.once('pointerdown', () => this.scene.start('UpgradeScene'));
  }
}

// Start the game AFTER classes are defined
const config = {
  type: Phaser.AUTO,
  width: 400,
  height: 720,
  parent: 'game',
  backgroundColor: '#4fc3f7',
  physics: { default: 'arcade', arcade: { gravity: { y: 0 } } },
  scene: [UpgradeScene, GameScene]
};

new Phaser.Game(config);
</script>
</body>
</html>
